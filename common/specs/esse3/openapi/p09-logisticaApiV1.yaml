---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso alla parte logistica dell'offerta\
    \ didattica\n\n* Condivisioni Logistiche (AD e UD)\n* Syllabus\n* Aule e Edifici\n\
    \n## ChangeLog\n \n Versione       | Versione di Esse3 di rilascio | Interventi\
    \ \n -              | -                             | -\n     1.0.0      |   \
    \                            | versione iniziale\n     1.1.0      | 18.03.01.00\
    \                   | aggiunti gli endpoint per le aule ed edifici \n"
  version: "1.0.0"
  title: "ESSE3 Logistica API"
basePath: "/logistica-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
paths:
  /easystaff/logistica/{aaOffId}:
    get:
      tags:
      - "easystaff"
      summary: "informazioni logistiche per easystaff."
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>\n# <center><span style=\"color:red\">ATTENZIONE</span><center>\n\
        <div style=\"color:red;font-size:medium;text-align:center\">\n  Il metodo\
        \ è utilizzabile se è attiva l'integrazione con easystaff ed è dedicato a\
        \ questa integrazione<br/>\n  La response potrebbe cambiare senza preavviso\
        \ e senza la garanzia di retrocompatibilità, non utilizzare\n</div>\n    \
        \    \nVengono ritornate le informazioni logistiche sulle attività di un determinato\
        \ anno di offerta vanno anche valorizzati i parametri dipCod oppure una lista\
        \ di cds da passare sul parametro listaCds\n\n\n**Estensioni:**\n\nCodice\
        \ Estensione|Valore|Nota\n-|-|-\nx-cache-type|noCache|Nessuna cache impostata\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: easystaff-user-tecnico-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nEasyStaff|Funzione abilitata se attivata l'integrazione con Easystaff|Security.checkEasyStaff(),\
        \ Security.checkUserTecnico()\n\n\nClasse di modello : EasystaffAdLog\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\naaOffId|primaryKey\n\
        adLogId|primaryKey\nfatPartCod|primaryKey\npartCod|primaryKey\n\n\nClasse\
        \ di modello : EasystaffDoc\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nudLogId|primaryKey\ntipoCreCod|primaryKey\n\
        \n\nClasse di modello : EasystaffAd\n======\n\nEstensioni sulle proprietà\n\
        ----\nProprietà | x-field-type\n-|-|\ndipCsaCod|optional\ndipIstatCod|optional\n\
        tipoSpecCod|optional\ndomPartCod|primaryKey\n\n\nClasse di modello : EasystaffUd\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        fisicaFlg|optional\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getEasystaffLogistica"
      parameters:
      - name: "aaOffId"
        in: "path"
        description: "Id dell'anno di offerta"
        required: true
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "dipCod"
        in: "query"
        description: "codice del dipartimento"
        required: false
        type: "string"
      - name: "listaCds"
        in: "query"
        description: "lista dei codici corso da estrarre separata da ,"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/EasystaffAdLogConDettagli"
        "422":
          description: "errore"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      security:
      - basicAuth: []
      - jwt:
        - "openid"
      x-enabled-profiles:
      - easystaff-user-tecnico-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "EasyStaff"
              description: "Funzione abilitata se attivata l'integrazione con Easystaff"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkEasyStaff"
                  description: "controlla che sia attivata l'integrazione con easystaff"
              - checkDummy2:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente collegato sia un utente tecnico"
      x-custom-operation: "multiple"
      x-cache-type: "noCache"
  /easystaff/struttura/{aaOffId}:
    get:
      tags:
      - "easystaff"
      summary: "informazioni di struttura per easystaff."
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>\n# <center><span style=\"color:red\">ATTENZIONE</span><center>\n\
        <div style=\"color:red;font-size:medium;text-align:center\">\n  Il metodo\
        \ è utilizzabile se è attiva l'integrazione con easystaff ed è dedicato a\
        \ questa integrazione<br/>\n  La response potrebbe cambiare senza preavviso\
        \ e senza la garanzia di retrocompatibilità, non utilizzare\n</div>\n    \
        \    \nVengono ritornate le informazioni di struttura dei corsi/ordinamenti/percorsi/sedi\
        \ collegate ad delle offerte di un determinato anno di offerta Vanno anche\
        \ valorizzati i parametri dipCod oppure una lista di cds da passare sul parametro\
        \ listaCds\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nEasyStaff|Funzione\
        \ abilitata se attivata l'integrazione con Easystaff|Security.checkEasyStaff(),\
        \ Security.checkUserTecnico()\n\n\nClasse di modello : EasystaffCdsord\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\ndipCsaCod|optional\n\
        dipIstatCod|optional\n\n\nClasse di modello : EasystaffPdsord\n======\n\n\
        Estensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nstatoCod|optional\n\
        \n\nClasse di modello : EasystaffSedi\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nsedePrincipaleFlg|optional\n\n\nClasse\
        \ di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getEasystaffStruttura"
      parameters:
      - name: "aaOffId"
        in: "path"
        description: "Id dell'anno di offerta"
        required: true
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "dipCod"
        in: "query"
        description: "codice del dipartimento"
        required: false
        type: "string"
      - name: "listaCds"
        in: "query"
        description: "lista dei codici corso da estrarre separata da ,"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/EasystaffCdsordConDettagli"
        "422":
          description: "errore"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      security:
      - basicAuth: []
      - jwt:
        - "openid"
      x-enabled-profiles:
      - easystaff-user-tecnico-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "EasyStaff"
              description: "Funzione abilitata se attivata l'integrazione con Easystaff"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkEasyStaff"
                  description: "controlla che sia attivata l'integrazione con easystaff"
              - checkDummy2:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente collegato sia un utente tecnico"
      x-cache-type: "noCache"
  /logistica:
    get:
      tags:
      - "logistica"
      summary: "Recupera la lista dei record della tabella di testata P09_AD_LOG,\
        \ filtrati per i parametri opzionali. I parametri lavorano solo sulla AD FISICA\
        \ della condivisione."
      description: "recupera la lista degli oggetti `AdLog` con le informazioni di\
        \ testata della logistica. I parametri ozionali **start** e **limit** consentono\
        \ di paginare i risultati.\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-public-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        ALL|Funzione Pubblica|Security.checkDummy()\n\n\nClasse di modello : AdLog\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        sedeId|primaryKey\n"
      operationId: "getLogistica"
      parameters:
      - name: "aaOffId"
        in: "query"
        description: "Id dell'anno di offerta"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "cdsCod"
        in: "query"
        description: "codice del corso di studio"
        required: false
        type: "string"
      - name: "cdsDes"
        in: "query"
        description: "descrizione del corso di studio (se viene utilizzato il carattere\
          \ * viene applicato il like)"
        required: false
        type: "string"
      - name: "aaOrdId"
        in: "query"
        description: "Id dell'ordinamento"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "pdsId"
        in: "query"
        description: "id del percorso di studio"
        required: false
        type: "integer"
        format: "int64"
      - name: "pdsCod"
        in: "query"
        description: "codice del percorso di studio"
        required: false
        type: "string"
      - name: "pdsDes"
        in: "query"
        description: "descrizione del percorso di studio (se viene utilizzato il carattere\
          \ * viene applicato il like)"
        required: false
        type: "string"
      - name: "adId"
        in: "query"
        description: "id dell'attivita didattica"
        required: false
        type: "integer"
        format: "int64"
      - name: "adCod"
        in: "query"
        description: "codice dell'attivita didattica"
        required: false
        type: "string"
      - name: "adDes"
        in: "query"
        description: "descrizione  dell'attivita didattica (se viene utilizzato il\
          \ carattere * viene applicato il like)"
        required: false
        type: "string"
      - name: "linguaDidCod"
        in: "query"
        description: "codice ISO6392 della lingua di erogazione della didattica"
        required: false
        type: "string"
      - name: "sedeDes"
        in: "query"
        description: "descrizione della sede (se viene utilizzato il carattere * viene\
          \ applicato il like)"
        required: false
        type: "string"
      - name: "dataModLog"
        in: "query"
        description: "data di ultima modifica della logistica"
        required: false
        type: "string"
        maxLength: 10
        minLength: 10
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/AdLog"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
      x-cache-type: "noCache"
  /logistica/copertura/cancellabile:
    get:
      tags:
      - "logistica"
      summary: "Indica se una copertura risulta cancellabile."
      description: "Indica se una copertura risulta cancellabile recuperando un oggetto\
        \ di tipo 'CoperturaCancellabile'.\nE' necessario specificare almeno un parametro.\n\
        ##### Codici di ritorno della funzione\nCodice di Ritorno | Descrizione\n\
        \ -                | -\n 0                | copertura non presente in ESSE3,\
        \ quindi cancellabile\n 1                | copertura cancellabile\n 2    \
        \            | copertura NON cancellabile perché è presente in un registro\
        \ docenti (P09_REG_DOC)\n 3                | copertura NON cancellabile perché\
        \ è presente in un questionario\n \n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|configuration|Risorsa di configurazione, la variazione\
        \ è molto lenta, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getCoperturaCancellabile"
      parameters:
      - name: "coperId"
        in: "query"
        description: "identificativo copertura"
        required: false
        type: "integer"
        format: "int64"
      - name: "matricola"
        in: "query"
        description: "codice della matricola dello studente"
        required: false
        type: "string"
      - name: "aaOffId"
        in: "query"
        description: "identificativo dell'anno di offerta"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "cdsCod"
        in: "query"
        description: "codice del corso di studio"
        required: false
        type: "string"
      - name: "aaOrdId"
        in: "query"
        description: "Id dell'ordinamento"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "pdsCod"
        in: "query"
        description: "codice del percorso di studio"
        required: false
        type: "string"
      - name: "adCod"
        in: "query"
        description: "codice dell'attivita didattica"
        required: false
        type: "string"
      - name: "udCod"
        in: "query"
        description: "codice dell'unità didattica"
        required: false
        type: "string"
      - name: "domPartCod"
        in: "query"
        description: "Codice dominio di partizione degli studenti all'interno di un\
          \ fattore di partizione"
        required: false
        type: "string"
        maxLength: 10
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/CoperturaCancellabile"
        "422":
          description: "errore"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
  /logistica/syllabusAD:
    put:
      tags:
      - "logistica"
      summary: "Aggiorna le informazioni del syllabus associate alla logistica in\
        \ chiave (completa o parziale). Se non specificati i codici di dominio e/o\
        \ partizione, verranno utilizzate le informazioni fornite per identificare\
        \ le entità da aggiornare. In caso di UTENTE_TECNICO, è necessario valorizzare\
        \ il campo docenteMatricola."
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Aggiorna le informazioni del syllabus associate\
        \ alla logistica in chiave (completa o parziale).\n\n\n**Estensioni:**\n\n\
        Codice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa di\
        \ configurazione, la variazione è molto lenta, cache Http abilitata, cache\
        \ server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: docente-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|funzione\
        \ accessibile alle utenze di tipo docente|Security.checkDocente()\n\n**Utente:\
        \ user-tecnico-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "putSyllabusAD"
      parameters:
      - name: "docenteMatricola"
        in: "query"
        description: "matricola del docente"
        required: false
        type: "string"
      - in: "body"
        name: "body"
        description: "Informazioni del syllabus da aggiornare. I campi opzionali non\
          \ indicati non verranno considerati in fase di aggiornamento."
        required: true
        schema:
          $ref: "#/definitions/SyllabusADPatch"
      responses:
        "200":
          description: "Successful response"
          schema:
            $ref: "#/definitions/SyllabusADPatchResult"
        "422":
          description: "Operazione non concessa"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      security:
      - basicAuth: []
      - jwt:
        - "openid"
      x-enabled-profiles:
      - docente-permissions:
          kind: "DOCENTE"
          profiles:
          - profile:
              name: "DOCENTE"
              description: "funzione accessibile alle utenze di tipo docente"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDocente"
                  description: "controlla che l'utente sia un docente"
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-custom-operation: "multiple"
      x-cache-endpoint-relations:
