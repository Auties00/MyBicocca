securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  Nazione:
    type: "object"
    properties:
      nazioneId:
        type: "integer"
        format: "int64"
        example: 245
        description: "ID numerico univoco della nazione"
      codFisc:
        type: "string"
        example: "Z704"
        description: "Codice di 4 cifre Lettera + 3 numeri: Znnn - la laettera è sempre\
          \ una Z. Nel caso dell´Italia questo attributo non è istanziato."
      cod:
        type: "string"
        example: "X1"
        description: "Codice di tre cifre - 3 numeri, utilizzato per descrivere la\
          \ nazione. Italia 200 Albania 201 ..."
      des:
        type: "string"
        example: "ISOLE VITI"
        description: "descrizione"
      dataInizioVal:
        type: "string"
        example: "31-DIC-75"
        description: "Se anno inizio validità è non nullo deve essere istanziato anche\
          \ l attributo Codifica_Precedente, che contiene l indicazione dello stato\
          \ da cui ha avuto origine la nazione codificata. Ad esempio dalla iugoslavia\
          \ hanno avuto origine   la SLOVENIA, la CROAZIA, la SERBIA-MONTENEGRO. Le\
          \ n uove codifiche presenteranno indicazione della codifica della nazione\
          \ da cui hanno avuto origine. Se la nazione di origine non ha più validità\
          \ viene indicato anche l anno di fine validità."
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      dataFineVal:
        type: "string"
        example: "31-DIC-75"
        description: "Data fine validità nazione."
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      codificaPrec:
        type: "integer"
        format: "int64"
        example: 200
        description: "Codifica nazione precedente, nel caso di nazione che sostituisce\
          \ una nazione non più valida."
      comuCodifFlg:
        type: "integer"
        format: "int32"
        example: 1
        description: "Indica se la nazione viene gestita a livello di comuni e province\
          \ codifcate."
      nazioneCod:
        type: "string"
        example: "CX"
        description: "ID codice MIUR"
      csaCod:
        type: "string"
        example: "CX"
        description: "Codice CSA, utilizzato per mappare le nazioni durante l´allineamento\
          \ docenti dal sistema CSA."
      territorioCedutoFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "Indica che è un territorio ceduto."
      strIban:
        type: "string"
        example: "DOkkBBBBBCCCCCCCCCCCCCCCCCCCC"
        description: "Struttura codice IBAN."
      prefixInternazionale:
        type: "string"
        example: "39"
        description: "Prefisso internazionale."
      equipCorsoBancaItaFlg:
        type: "integer"
        format: "int32"
        example: 1
        description: "La gestione delle coordinate bancarie è equiparata a quella\
          \ italiana."
      codIso31661:
        type: "string"
        example: "304"
        description: "Codifica ISO 3166 numerica a tre cifre"
    x-layout-name: "fake_layout"
    x-winsession-name: "fake_winsession"
    x-model-sub-package: "anagrafica.v1"
    x-model-sub-path: "anagrafica/v1"
  DettaglioErroreAggiuntivo:
    type: "object"
    properties:
      errorType:
        type: "string"
        example: "stackTrace"
        description: "descrizione del tipo di errore aggiuntivo"
      value:
        type: "string"
        example: "SocketTimeoutException...."
        description: "descrizione dell'errore"
      rawValue:
        type: "string"
        example: "SocketTimeoutException...."
        description: "descrizione dell'errore"
        x-field-type: "rawJson"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  CAP:
    type: "object"
    properties:
      nazioneId:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID numerico univoco della nazione"
      nazioneCodFisc:
        type: "string"
        example: "Z704"
        description: "Codice di 4 cifre Lettera + 3 numeri: Znnn - la laettera è sempre\
          \ una Z. Nel caso dell´Italia questo attributo non è istanziato."
      regioneId:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID numerico della regione"
      regioneCod:
        type: "string"
        example: "1"
        description: "ID numerico univoco della nazione"
      regioneDes:
        type: "string"
        example: "Piemonte"
        description: "Descrizione regione"
      sigla:
        type: "string"
        example: "TO"
        description: "Sigla automobilistica della provincia"
      provinciaCod:
        type: "string"
        description: "Codice ISTAT di 3 cifre utilizzato per indicare la provincia.\
          \ Esempio 084 Agrigento"
      provinciaDes:
        type: "string"
        example: "Torino"
        description: "descrizione provincia"
      comuneId:
        type: "integer"
        format: "int64"
        example: 7839
        description: "ID numerico unico del comune"
      comuneCod:
        type: "string"
        example: "L219"
        description: "Codice di 4 cifre (Lettera + 3 numeri) che è utilizzato nel\
          \ codice fiscale per indicare il comune di nascita."
      comuneDes:
        type: "string"
        example: "Torino"
        description: "descrizione comune"
      comuCap:
        type: "string"
        example: "10024"
        description: "Codice di 5 cifre - OBSOLETO."
      capId:
        type: "integer"
        format: "int64"
        example: 10024
        description: "Identificativo CAP"
      cap:
        type: "string"
        example: "10024"
        description: "Codice Avviamento postale del comune/località"
      capDes:
        type: "string"
        example: "10024"
        description: "Descizione della zona del cap"
    x-layout-name: "CAP_REST"
    x-winsession-name: "p01/n_am_p01_winsession_rest"
    x-model-sub-package: "anagrafica.v1"
    x-model-sub-path: "anagrafica/v1"
  DettaglioErrore:
    type: "object"
    properties:
      statusCode:
        type: "integer"
        format: "int32"
        example: 200
        description: "Http Status Code"
      retCode:
        type: "integer"
        format: "int32"
        example: -1
        description: "codice di errore"
      retErrMsg:
        type: "string"
        example: "Parametri non corretti"
        description: "descrizione dell'errore"
      errDetails:
        type: "array"
        items:
          $ref: "#/definitions/DettaglioErroreAggiuntivo"
    x-model-sub-package: "frk.v1"
