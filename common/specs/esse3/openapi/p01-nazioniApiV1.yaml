        example: "Z704"
        description: "Codice di 4 cifre Lettera + 3 numeri: Znnn - la laettera è sempre\
          \ una Z. Nel caso dell´Italia questo attributo non è istanziato."
      regioneId:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID numerico della regione"
      regioneCod:
        type: "string"
        example: "1"
        description: "Codice di due cifre utilizzato dall´Istat per indicare la regione:\
          \ 19 Sicilia 01 Piemonte"
      regioneDes:
        type: "string"
        example: "Piemonte"
        description: "Descrizione"
      codRegioVulc:
        type: "string"
        example: "1"
        description: "ID numerico univoco della nazione"
      sigla:
        type: "string"
        example: "TO"
        description: "Sigla automobilistica della provincia"
      provinciaCod:
        type: "string"
        example: "1"
        description: "Codice ISTAT di 3 cifre utilizzato per indicare la provincia.\
          \ Esempio 084 Agrigento"
      provinciaDes:
        type: "string"
        example: "Torino"
        description: "Descrizione provincia"
      annoDefinizione:
        type: "integer"
        format: "int64"
        example: 1960
        description: "Anno di definizione della provincia."
      provinciaPrecedente:
        type: "string"
        example: "VC"
        description: "Valorizzato nel caso di separazioni di province, ad esempio:\
          \ Prato e Firenze Rimini e Forlì ... L attributo è valorizzato nel caso\
          \ IN cui sia introdotto un anno di definizione (Anno_Definizione) - Esempio\
          \ di Rimini: - RN Emilia-Romagna Rimini 099 1993 FO"
      annoFineValidita:
        type: "integer"
        format: "int64"
        example: 2000
        description: "Anno di fine validità della provincia."
      attivoId:
        type: "integer"
        format: "int32"
        example: 0
        description: "Indica l'attivazione o meno della provincia 0) è attiva; 1)\
          \ è obsoleta; 2) non esiste più perché è stata accorpata da un altra  provincia."
    x-layout-name: "PROVINCE_REST"
