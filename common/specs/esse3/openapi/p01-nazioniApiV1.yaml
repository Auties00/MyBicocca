---
swagger: "2.0"
info:
  description: "API REST di ESSE3 che permette di accedere alle informazioni delle\
    \ nazioni, delle regioni, dei comuni, delle province e dei cap.\n\nVersione  \
    \     | Versione di Esse3 di rilascio | Interventi \n-              | -      \
    \                       | -\n1.0.0          | 23.06.00.00                   |\
    \ creazione API\n"
  version: "1.0.0"
  title: "ESSE3 Nazioni API"
basePath: "/nazioni-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /nazioni:
    get:
      tags:
      - "nazioni"
      summary: "recupero delle nazioni"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di recuperare le nazioni. Nel caso\
        \ il parametro iso6392Cod sia nullo, di default verrà impostato a ita. \n\n\
        \n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-public-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        ALL|Funzione Pubblica|Security.checkDummy()\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n"
      operationId: "getNazioni"
      parameters:
      - name: "iso6392Cod"
        in: "query"
        description: "Codice ISO lingua"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Nazione"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
  /nazioni/{nazioneId}/cap:
    get:
      tags:
      - "cap"
      summary: "recupero dei CAP"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di recuperare i CAP. \n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getCAP"
      parameters:
      - name: "nazioneId"
        in: "path"
        description: "identificativo della nazione"
        required: true
        type: "integer"
        format: "int64"
      - name: "nazioneCodFisc"
        in: "query"
        description: "Codice fiscale della nazione"
        required: false
        type: "string"
      - name: "regioneCod"
        in: "query"
        description: "Codice regione"
        required: false
        type: "string"
      - name: "sigla"
        in: "query"
        description: "Sigla della provincia"
        required: false
        type: "string"
      - name: "comuneId"
        in: "query"
        description: "id univoco comune"
        required: false
        type: "integer"
        format: "int64"
      - name: "comuneCod"
        in: "query"
        description: "Codice di 4 cifre (Lettera + 3 numeri) che è utilizzato nel\
          \ codice fiscale per indicare il comune di nascita."
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/CAP"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
  /nazioni/{nazioneId}/comuni:
    get:
      tags:
      - "comuni"
      summary: "recupero dei comuni"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di recuperare i comuni. \n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getComuni"
      parameters:
      - name: "nazioneId"
        in: "path"
        description: "identificativo della nazione"
        required: true
        type: "integer"
        format: "int64"
      - name: "iso6392Cod"
        in: "query"
        description: "Codice ISO lingua"
        required: false
        type: "string"
      - name: "nazioneCodFisc"
        in: "query"
        description: "Codice fiscale della nazione"
        required: false
        type: "string"
      - name: "regioneCod"
        in: "query"
        description: "Codice regione"
        required: false
        type: "string"
      - name: "sigla"
        in: "query"
        description: "Sigla della provincia"
        required: false
        type: "string"
      - name: "comuneCod"
        in: "query"
        description: "Codice di 4 cifre (Lettera + 3 numeri) che è utilizzato nel\
          \ codice fiscale per indicare il comune di nascita."
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Comune"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
