---
swagger: "2.0"
info:
  description: "### Modalità di autenticazione\n\n**L'autenticazione dei servizi REST\
    \ avviene tramite l'header Authorization.**\n\nIn questo caso la sessione è collegata\
    \ all'utente: con questa modalità (LOGIN IMPLICITA)  *non* sono possibili sessioni\
    \ multiple contemporanee\na parità di utente: cioè tutte le chiamate con il medesimo\
    \ Authorization header sono collegate alla medesima sessione lato server.\nAlla\
    \ prima invocazione viene creata in automatico la sessione lato server, nelle\
    \ invocazioni successive viene utilizzata sempre \nla medesima sessione finchè\
    \ è non si verifica un timeout oppure viene chiamato esplicitamente il metodo\
    \ /logout. \n\nNel caso siano necessarie più sessioni contemporanee è necessario\
    \ utilizzare esplicitamente il metodo /login che ritorna l'identificativo \ndi\
    \ sessione da utilizzare nelle chiamate successive. In questa modalità (LOGIN\
    \ ESPLICITA) la sessione è gestita direttamente dal client\n\n*Esempio di sessione\
    \ autenticata in ambienti con più tomcat, oppure nel caso di sessioni multiple\
    \ per il medeismo utente*\n\n1. esegure l'autenticazione sull'enpoint `/login`\
    \ la response fornisce il campo authToken che conteine il jsessionid\n2. effettuare\
    \ la chiamata ad un enpoint autenticato (es. `/libretti`) passando i seguenti\
    \ valori\n  1. Header Authorization (vedi sotto)\n  2. jsessionid passato nell'URL\
    \ (con il valore del punto 1) nel formato http://..../;jsessionid=<authToken>\
    \ o in alternativa il valore come cookie\n3. una volta finita la sessione effettuare\
    \ la chiamata (con gli header del punto 2) all'enpoint `/logout`\n\n+NB+: Nel\
    \ caso siano presenti più sessioni valide per il medesimo utente e non venga passato\
    \ il jsessionid il sistema risponde con \nstatusCode = 403 e errorCode (presente\
    \ nel body della response) 111\n\n*Esempio di chiamata con sessione autenticata\
    \ su un unico tomcat*\n\n1. effettuare la chiamata ad un enpoint autenticato (es.\
    \ `/libretti`) passando i seguenti valori\n  1. Header Authorization (vedi sotto)\n\
    \n## Autenticazioni Previste\nSono previste le seugenti autenticazioni\n\nAutenticazione\
    \ | Note  \n-              | -\nBASIC          | nell' header authorization va\
    \ passato il valore BASIC <token> come descritto nell' [RFC2617](https://www.ietf.org/rfc/rfc2617.txt)\n\
    OAUTH2         | il flusso di autenticazione è compatibile con l'[RFC6749](https://tools.ietf.org/html/rfc6749#section-1.3.2).\
    \  per i dettagli (**)\nAPIKEY         | l'apiKey va passata in tutte le chiamate\
    \ autenticatione nell'header `X-api-key` (***) \n\n__(**)__\n\n_I flow di autenticazione\
    \ supportati sono i seugenti_:\n  1. IMPLICIT\n  2. AUTHORIZATION_CODE\n  \n \
    \ Il tipo di flow da utilizzare dipende dalla singola applicatione registrata\
    \ su OAUTH, quindi va definito in fase di richiesta di creazione dell'applicazione\n\
    \  Per poter utilizzare l'autenticazione OAUTH occorre \n   1. Configurare un\
    \ server OAUTH2 compatibile con le specifiche OPENID \n   2. configurare il parametro\
    \ di configurazione di esse3 OAUTH_AUTHORIZATION_URL e OAUTH_JWK_KEYS di esse3\n\
    \   3. opzionalmente è possibile indicare quale sia il claim utilizzato per il\
    \ riconoscimento dell'utente nel token JWT con il parametro OAUTH_USER_CLAIM (il\
    \ default è sub)\n\nPer maggiori informazioni è possibile consultare la documentazione\
    \ sul [wiki](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-ConfigurazioneClientSWAGGERperOAUTH2)\n\
    \n__(***)__\n_Validazione client tramite ApiKey_:  \nL'autenticazione tramite\
    \ ApiKey è in aggiunta rispetto ad uno dei flussi previsti (Basic, Oauth2) _è\
    \ abilitabile tramite configurazione_ (Par_conf = REST_API_KEY_STRICT_MODE), il\
    \ default è disabilitato.\nIl provisioning delle ApiKey avviene tramite richeista\
    \ esplicita al personale di ateneo che effettuerà la generazione della chiave\
    \ tramite l'apposita maschera del client Esse3.  \nUna volta ricevuta la chiave\
    \ occorre passare l'apiKey nelle chiamate autenticate **in aggiunta** all'autenticazione\
    \ già prevista (obbligatoria) che avviene tramite basic Authentication oppure\
    \ Oauth2\nIn ogni metodo della documentazione vengono riportate le autenticazioni\
    \ previste. \n\n\n### AUTENTICAZIONE PER UTENTI NON PREVISTI\n La login è supportata\
    \ anche per i gruppi di utenti che non sono abilitati alla gestione delle API\
    \ REST.\n In questo caso le funzionalità si limitano alle api di autenticazione\
    \ \n * login\n * logout\n * checkPassword\n * changePassword\n \n Viene inserito\
    \ un header di warning che indica la limitazione.\n    \n Per gli altri path il\
    \ servizio risponde con un httpCode 400  \n\n\n### EVICTION DELLE SESSIONI\n\n\
    Per motivi di sicurezza, le sessioni lato backend durano al massimo 6 ore. \n\n\
    L'eviction delle sessioni ha comportamenti differenti in base alla modalità utilizzata\n\
    \n#### LOGIN IMPLICITA\nIl servizio provvede alla rimozione della sessione per\
    \ timeout quando si verifica una delle seguenti condizioni\n* la sessione non\
    \ risulta utilizzata da più tempo del valore definito sul gruppo collegato all'utente\
    \ (p18_grp.http_session_timeout)\n* la sessione risulta creata da più tempo del\
    \ parametro di configurazione REST_MAX_SESSION_TIME (default 5h 45m)\n \nQuindi\
    \ un eventuale cambio di password dell'utente viene rilevato dopo al massimo 6\
    \ ore dalla sua modifica \n(cioè quando la sessione viene rimossa e la login inmplicita\
    \ viene rieffettuata alla chiamata successiva)\n\n#### LOGIN ESPLICITA\nIn questo\
    \ caso le sessioni al timeout delle 6 ore *NON* vengono rimosse. La response della\
    \ login infatti comunica esplicitamente le chiavi di sessione (jsessionid e sessionid)\
    \ al client \ne quando il sessionid viene rimosso è necessario che il client effettui\
    \ esplicitamente una nuova login per acquisire i nuovi valori.\nE' quindi responabilità\
    \ del client chiamante gestire correttamente il timeout massimo della sessione\
    \ dalla sua creazione.\nIn questa casisitca le sessioni sono raggruppate per authorization\
    \ header ai fini del timeout configutato configurato sulla p18_grp.http_session_timeout.\
    \ L'eviction delle sessioni avviene in modo aggregato quando \nil valore dell'ultimo\
    \ utilizzo di una qualsiasi delle sessioni con lo stesso auth header supera il\
    \ valore previsto dal campo p18_grp.http_session_timeout.\n\n*Esempio:*\n\nsono\
    \ presenti due sessioni per lo stesso auth header (Basic GFDmxcdos....)\n\n* la\
    \ prima sessione ha jsessionid = xdFdskzAAsaj32lzlaaa\n* la seconda session ha\
    \ jsessionid = aaslke3ksd29i2zoie12\n\nLe ultime chiamate in ordine cronologico\
    \ riportano i seguenti TimeStamp (e http_session_timeout = 60 min) e Ora corrente\
    \ 2022-06-29T19:50:00.00Z\n\n*  JSID = xdFdskzAAsaj32lzlaaa => 2022-06-29T19:34:50.63Z\n\
    *  JSID = xdFdskzAAsaj32lzlaaa => 2022-06-29T19:30:00.12Z\n*  JSID = aaslke3ksd29i2zoie12\
    \ => 2022-06-29T17:20:30.10Z\n*  JSID = xdFdskzAAsaj32lzlaaa => 2022-06-29T17:10:20.98Z\n\
    \nLa sessione verrà invalidata alla data 2022-06-29T20:34:50.63Z (cioè al timeout\
    \ della sessione xdFdskzAAsaj32lzlaaa) e rimossa dal sistema, a quel punto i due\
    \ JSID non saranno più\nvalidi. La sessione aaslke3ksd29i2zoie12 invece risulterebbe\
    \ già invalida ma risulta utilizzabile  fintanto che la sessione xdFdskzAAsaj32lzlaaa\
    \ è attiva.\nIn ogni caso dopo 6 ore dalla loro creazione entrambe le sessioni\
    \ risulteranno inutilizabili.    \n\n## Token JWT \n\nEsse3 permette di generare\
    \ dei token JWT che possono essere utilizzati per l'autenticazione alle API,\n\
    questa funzionalità autogenera una coppia di chiavi (pubblica e privata) nella\
    \ base dati di esse3 e consente \ndi utilizzarla per generare dei token che vengono\
    \ riconosciuti dalle API\n\nE' possibile generare un nuovo token in due modalità\
    \ differenti\n* direttamente dalla login aggiungendo il campo opzionale jwt\n\
    * tramite l'endpoint `/login/jwt/new`\n\nL'url di esposizione delle chiavi è `GET\
    \ /jwt/jwk`\nL'url di refresh è `GET /jwt/refresh`\n\n## ChangeLog\n\nVersione\
    \       | Versione di Esse3 di rilascio | Interventi \n-              | -    \
    \                         | -\n    1.1.0      | 17.11.00.00                  \
    \ | deprecato il metodo post changePassword in favore del metodo put \n    1.1.0\
    \      | 17.11.00.00                   | deprecato il metodo post checkLogon in\
    \ favore del metodo get\n    1.2.0      | 18.01.02.00                   | Modificata\
    \ la modalità di autenticazione, il cookie di sessione (jsessionid) è necessario\
    \ in ambienti con più tomcat per  utilizzare lo stesso tomcat\n    1.3.0     \
    \ | 18.02.00.00                   | Aggiunto il metodo /sessions/{sessionId}/check\n\
    \    1.4.0      | 18.07.02.00                   | Aggiunta la possibilità di autenticare\
    \ gli utenti con gruppi non gestiti per i servizi REST\n    1.4.1      | 18.07.02.00\
    \                   | rimossi i metodi deprecati [POST /checkLogon] e [POST /changePassword]\n\
    \    1.5.0      | 19.11.01.00                   | gestione sessioni multiple per\
    \ il medesimo utente\n    1.6.0      | 20.01.01.00                   | aggiunta\
    \ la validazione del client tramite ApiKey\n    1.6.1      | 20.11.00.00     \
    \              | gestione corretta della risposta della login nel caso di più\
    \ profili disponibili\n    1.7.0      | 22.10.01.00                   | generazione\
    \ dei token jwt con le chiavi di esse3\n    1.8.0      | 23.03.02.00         \
    \          | Aggiunto alla response l'oggetto TrattoAttivo per gli utenti studente,\
    \ aggiunto anche il campo sesso\n    \n"
  version: "1.8.0"
  title: "Common Auth API"
