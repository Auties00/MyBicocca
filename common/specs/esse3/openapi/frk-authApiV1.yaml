  /login:
    get:
      tags:
      - "autenticazione"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Effettua la login ad esse3.\nE' possibile richiedere\
        \ una tipologia specifica di profilo utente tramite l'header HTTP X-Esse3-User-Profile,\
        \ indicando come valore STUDENTE, DOCENTE o USER_TECNICO\nNel caso di utenza\
        \ con più profili (e accesso tramite codice fiscale) viene ritornato lo status\
        \ code 300 e *NON* viene effettauta la login.\nOccorre come indicato rieffettuare\
        \ la chiamata aggiungendo uno dei profili disponibili   \n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|noCache|Nessuna cache\
        \ impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\nClasse di modello : SessioneUtente\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\njwt|optional\n\n\nClasse di modello\
        \ : SessioneUtente\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\njwt|optional\n"
      operationId: "login"
      parameters:
