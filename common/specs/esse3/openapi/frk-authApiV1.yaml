securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  ChangePasswordResult:
    type: "object"
    properties:
      result:
        type: "string"
        description: "risultato dell'operazione, può valere:\n* OK - operazione andata\
          \ a buon fine\n* NO_PERMISSIONS - l'utenza tecnica non ha i diritti per\
          \ la funzione SI_18_008\n* EMPTY_PARAM - la password fornita è vuota\n*\
          \ AUTH_FAILURE - la password passata nel parametro old_password non è corretta,\
          \ oppure old_password non è fornito ed il parametro PWD_CHANGE_LOW_SECURITY\
          \ non è popolato correttamente\n* INVALID_NEW_PASSWORD - la password non\
          \ soddisfa i requisiti minimi configurati nel sistema\n* ERR_1118 - la password\
          \ coincide con la password precedentemente inserita nel sistema\n* ERR_1003\
          \ - l'utente specificato non è presenete nel sistema\n"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  Utente:
    type: "object"
    required:
    - "firstName"
    - "grpDes"
    - "grpId"
    - "grpPta"
    - "grpUserTecnicoFlg"
    - "id"
    - "lastName"
    - "userId"
    properties:
      firstName:
        type: "string"
        example: "Mario"
        description: "nome dell'utente"
        maxLength: 80
        x-internal-name: "nome"
      lastName:
        type: "string"
        example: "Rossi"
        description: "cognome dell'utente"
        maxLength: 80
        x-internal-name: "cognome"
      sex:
        type: "string"
        example: "M"
        description: "sesso dell'utente"
        maxLength: 1
        x-internal-name: "sesso"
      codFis:
        type: "string"
        example: "XXXYYY99X12K123T"
        description: "codice fiscale della persona"
        minLength: 16
        maxLength: 16
      idAb:
        type: "integer"
        format: "int64"
        example: 123
        description: "idAb relativo alle anagrafiche comuni di U-Gov"
      persId:
        type: "integer"
        format: "int64"
        example: 123
        description: "identificativo della persona, viene valorizzato solo per determinati\
          \ gruppi (vedi campo grpId)\n  - 2 : gruppo didattica\n  - 4 : gruppo studenti\
          \ in ipotesi\n  - 6 : gruppo studenti\n  - 8 : gruppo preiscritti\n  - 9\
          \ : gruppo registrati\n"
      docenteId:
        type: "integer"
        format: "int64"
        example: 123
        description: "identificativo del docente, viene valorizzato solo per determinati\
          \ gruppi (vedi campo grpId)\n  - 7 : gruppo docenti \n"
      soggEstId:
        type: "integer"
        format: "int64"
        example: 123
        description: "identificativo del soggetto esterno, viene valorizzato solo\
          \ per determinati gruppi (vedi campo grpId)\n"
      id:
        type: "integer"
        format: "int64"
        example: 123
        description: "Id identificativo univoco dell'utente"
      grpId:
        type: "integer"
        format: "int32"
        example: 123
        description: "id del gruppo utente, viene utilizzato per descriminare l'anagrafica\
          \ da utilizzare"
      grpUserTecnicoFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "indica se il gruppo dell' utente e' un gruppo di utenti tecnici"
      grpPta:
        type: "integer"
        format: "int32"
        example: 0
        description: "indica se il gruppo dell' utente e' un gruppo di personale tecnico\
          \ amministrativo"
      grpDes:
        type: "string"
        example: "Docente"
        description: "descrizione del gruppo dell'utente"
        maxLength: 20
      sessionTimeout:
        type: "integer"
        format: "int32"
        example: 10
        description: "timeout di sessione in minuti impostato per il gruppo utente"
      userId:
        type: "string"
        example: "mario.rossi"
        description: "userId con il quale l'utente ha effettuato il login"
        maxLength: 20
      tipoFirmaId:
        type: "integer"
        format: "int32"
        example: 0
        description: "id del tipo firma collegato all'utente"
        minimum: 0.0
      tipoFirmaFaId:
        type: "integer"
        format: "int32"
        example: 0
        description: "id del tipo firma autmatica collegato all'utente"
        minimum: 0.0
      aliasName:
        type: "string"
        example: "Luca"
        description: "nome alias dell'utente"
        maxLength: 80
        x-internal-name: "nome_alias"
      trattiCarriera:
        type: "array"
        items:
          $ref: "#/definitions/ChiaviTrattoCarriera"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  JWKModel:
    type: "object"
    properties:
      keys:
        type: "array"
        items:
          $ref: "#/definitions/JWKKey"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  ChiaviTrattoCarriera:
    type: "object"
    required:
    - "cdsDes"
    - "cdsId"
    - "matId"
    - "matricola"
    - "staMatCod"
    - "staMatDes"
    - "staStuCod"
    - "staStuDes"
    - "stuId"
    properties:
      stuId:
        type: "integer"
        format: "int64"
        example: 123
        description: "id interno della carriera a cui appartiene il tratto di carriera\
          \ dello studente"
      matId:
        type: "integer"
        format: "int64"
        example: 123
        description: "id interno del tratto di carriera dello studente"
        x-internal-name: "p04_mat_mat_id"
      matricola:
        type: "string"
        example: "AA-123"
        description: "codice matricola associato al tratto di carriera dello studente"
      cdsId:
        type: "integer"
        format: "int64"
        example: 123
        description: "id del corso di studio a cui fa riferimento il tratto di carriera"
      cdsDes:
        type: "string"
        description: "descrizione del corso di studio a cui fa riferimento il tratto\
          \ di carriera"
      staStuCod:
        type: "string"
        example: "A"
        description: "codice dello stato della carriera a cui è associato il tratto.\
          \ \nPer il dettaglio dei codici possibili consultare la documentazione di\
          \ ESSE3\n"
      staStuDes:
        type: "string"
        example: "Attivo"
        description: "descrizione dello stato della carriera a cui è associato il\
          \ tratto. \nPer il dettaglio dei codici possibili consultare la documentazione\
          \ di ESSE3\n"
        x-internal-name: "stati_stu_des"
      motStastuCod:
        type: "string"
        example: "IMM"
        description: "codice del motivo dello stato della carriera. Fornisce un dettaglio\
          \ sulla motivazione dello stato della carriera \nPer il dettaglio dei codici\
          \ possibili consultare la documentazione di ESSE3\n"
      motStastuDes:
        type: "string"
        example: "Attivo"
        description: "descrizione del motivo dello stato della carriera. Fornisce\
          \ un dettaglio sulla motivazione dello stato della carriera\nPer il dettaglio\
          \ dei codici possibili consultare la documentazione di ESSE3\n"
      staMatCod:
        type: "string"
        example: "A"
        description: "codice dello stato del tratto di carriera \nPer il dettaglio\
          \ dei codici possibili consultare la documentazione di ESSE3\n"
      staMatDes:
        type: "string"
        example: "Attivo"
        description: "descrizione dello stato del tratto di carriera \nPer il dettaglio\
          \ dei codici possibili consultare la documentazione di ESSE3\n"
        x-internal-name: "stati_mat_des"
      dettaglioTratto:
        $ref: "#/definitions/TrattoCarriera"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  DettaglioErrore:
    type: "object"
    properties:
      statusCode:
        type: "integer"
        format: "int32"
        example: 200
        description: "Http Status Code"
      retCode:
        type: "integer"
        format: "int32"
        example: -1
        description: "codice di errore"
      retErrMsg:
        type: "string"
        example: "Parametri non corretti"
        description: "descrizione dell'errore"
      errDetails:
        type: "array"
        items:
          $ref: "#/definitions/DettaglioErroreAggiuntivo"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  SessioneUtente:
    type: "object"
    required:
    - "authToken"
    - "expPwd"
    - "user"
    properties:
      user:
        $ref: "#/definitions/Utente"
      authToken:
        type: "string"
        example: "XDddlw213123ws233"
        description: "contiene il token di autenticazione (jsessionid) della sessione\
          \ web"
      internalAuthToken:
        type: "string"
        example: "ASDFKLASJKdk12kl341s"
        description: "token di autenticazione (sessionid) del backend di esse3"
      expPwd:
        type: "boolean"
