        /><img src=\"jwt.png\"/></span>Modifica la password di un utente. Per poter\
        \ accedere al servizio occorrono le credenziali di un'utenza\ntecnica passate\
        \ tramite header http \"Authorization: Basic ....\".\nNB: l'utente deve poter\
        \ utilizzare il tipo client REST ed avere abilitato l'accesso alla funzione\
        \ SI_18_008.\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-auth-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        AUTENTICATO|Funzione riservata a tutti gli utenti autenticati|Security.checkAuthUser()\n"
      operationId: "changeUserPassword"
      parameters:
      - in: "body"
        name: "body"
        description: "Oggetto con i campi da modificare"
        required: true
        schema:
          $ref: "#/definitions/ParametriChangeUserPassword"
      responses:
        "200":
          description: "il contenuto ritornato esprime il risultato dell'operazione.\n"
          schema:
            $ref: "#/definitions/ChangePasswordResult"
        "401":
          description: "l'header \"Authorization\" non è presente oppure contiene\
            \ dati non validi o credenziali errate"
