        type: "string"
        example: "15/10/2015"
        description: "Data inserimento del questionario. Il formato con cui deve essere\
          \ definita la data DD/MM/YYYY"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
        x-internal-name: "quest_data_ins"
      questDataMod:
