        type: "string"
        example: "Questionario ANVUR scheda 1 e 3"
        description: "descrizione del questionario configurato"
      statoQuestCod:
        type: "string"
        example: "A"
        description: "stato del questionario configurato"
        enum:
        - "A"
        - "B"
      questionarioNote:
        type: "string"
        example: "Questionario ANVUR scheda 1 e 3"
        description: "note del questionario configurato"
        x-internal-name: "questionario_note"
