        \n**Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|Permette\
        \ la visualizzazione delle informazioni della carriea dello studente|Security.checkStuId(stuId)\n\
        \n\nClasse di modello : PaginaQuestionario\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\npaginaId|primaryKey\n\n\nClasse di\
