---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso ai questionari"
  version: "1.0.0"
  title: "ESSE3 Questionari API"
basePath: "/questionari-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /questionari/compilazione/{stuId}/quest/{questionarioId}/{questCompId}/save/{pageId}:
    put:
      tags:
      - "Compilazione questionari"
      summary: "Salva le risposte di una pagina di questionario"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Salva le risposte della pagina passata per\
        \ parametro, normalmente è quella che l'utente sta compilando attualmente.\n\
        \n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa\
        \ di configurazione, la variazione è molto lenta, cache Http abilitata, cache\
        \ server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-student-carriera-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nSTUDENTE|Permette la visualizzazione delle informazioni della carriea\
        \ dello studente|Security.checkStuId(stuId)\n\n**Utente: user-tecnico-permissions**\n\
        \nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione accessibile\
        \ alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n\n\n\
        Classe di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n\n\n\
        Classe di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "savePageAns"
      parameters:
      - name: "stuId"
        in: "path"
        description: "id della carriera dello studente"
        required: true
        type: "integer"
        format: "int64"
      - name: "questionarioId"
        in: "path"
        description: "codice del questionario"
        required: true
        type: "string"
      - name: "questCompId"
        in: "path"
        description: "id del questionario compilato"
        required: true
        type: "integer"
        format: "int64"
      - name: "pageId"
        in: "path"
        description: "identifica la pagina di un questionario"
        required: true
        type: "integer"
        format: "int64"
      - name: "eventCompId"
        in: "query"
        description: "id dell'evento di compilazione del questionario (?)"
        required: true
        type: "string"
      - in: "body"
        name: "ansBody"
        description: "Oggetto che contiene le risposte alle domande"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/Answer"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "string"
            example: "OK"
            description: "Ritorna OK se la pagina è salvata con successo"
        "400":
          description: "Errori nella compilazione del questionario.\nError cod: \n\
            \  * MANDATORY_MISSING: risposta obbligatoria non fornita\n  * DATE_FORMAT|NUMBER_FORMAT:\
            \ formato risposta non rispettato\n  * NO_TEXT: fornito testo libero dove\
            \ previsto solo testo fisso\n  * TOO_VALUES: troppe risposte nelle scelte\
            \ multiple\n  * QUESTION_DOES_NOT_EXIST: domanda inesistente. \n  \nIl\
            \ value contiene l'id della pagina, della domanda e della risposta nel\
            \ seguente formato\n'paginaId: valoreId | domandaId: valoreId | rispostaId:\
            \ valoreId' \n"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/DettaglioErrore"
        "404":
          description: "risorsa non trovata"
          schema:
            $ref: "#/definitions/DettaglioErrore"
        "422":
          description: "sessione utente non valida"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      security:
      - basicAuth: []
      - jwt:
        - "openid"
      x-enabled-profiles:
      - common-student-carriera-permissions:
          kind: "STUDENTE"
          profiles:
          - profile:
              name: "STUDENTE"
              description: "Permette la visualizzazione delle informazioni della carriea\
                \ dello studente"
              checks:
              - checkStuId:
                  className: "Security"
                  functionName: "checkStuId"
                  description: "controlla che lo stuId appartenga ad una delle carriere\
                    \ dello studente"
                  parameters:
                  - stuId:
                      name: "stuId"
                      in: "path"
                      description: "id della carriera studente"
                      required: true
                      type: "integer"
                      format: "int64"
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-custom-operation: "single"
  /questionari/compilazione/{stuId}/{adsceId}/quest/{questionarioId}/start:
    put:
      tags:
      - "Compilazione questionari"
      summary: "Crea un nuovo questionario da compilare"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>crea una nuova compilazione a seconda della\
        \ tipologia di questionario e ritorna la prima pagina\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa\
        \ di configurazione, la variazione è molto lenta, cache Http abilitata, cache\
