        x-internal-name: "quest_data_mod"
      quesitoId:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID dell'elemento del questionario configurato"
      elemCod:
        type: "string"
        example: "R_INS1"
        description: "codice dell'elemento del questionario configurato"
      elementiDes:
        type: "string"
        example: "Dichiarazione di frequenza"
        description: "descrizione dell'elemento del questionario configurato"
        x-internal-name: "elem_des"
      parentQuesitoId:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID dell'elemento padre dell'elemento del questionario configurato"
        x-internal-name: "parent_quesito_id"
      tipoFormatoCod:
        type: "string"
        example: "TL_RSP_TFB"
        description: "codice del formato dell'elemento. Vale per domande e risposte"
        x-internal-name: "tipo_formato_cod"
      tipoFormatoDes:
        type: "string"
        example: "Risposta a testo fisso"
        description: "descrizione del formato dell'elemento. Vale per domande e risposte"
      quesitoPunteggio:
        type: "integer"
        format: "int32"
        example: 4
        description: "punteggio numerico associato all'elemento"
        x-internal-name: "quesito_punteggio"
      obbligatorioFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "Flag che indica se l'elento corrente domanda � obbligatoria\
          \ oppure no"
        minimum: 0.0
        maximum: 1.0
      quesitoNote:
        type: "string"
        example: "Questionario ANVUR scheda 1 e 3"
        description: "note dell'elemento del questionario configurato"
        x-internal-name: "quesito_note"
      tagCod:
        type: "string"
        example: "STU_ID_COMP"
        description: "codice del tag associato all'elemento del questionario"
        x-internal-name: "tag_cod"
      categCod:
        type: "string"
        example: "CAT_ECO"
        description: "codice della categoria associata all'elemento del questionario"
        x-internal-name: "categ_cod"
      tipoElemCod:
        type: "string"
        example: "T_DOMANDA"
        description: "codice del tipo dell'elemento."
        x-internal-name: "tipo_elem_cod"
      elementiNota:
        type: "string"
        example: "note"
        description: "note dellelemento del questionario configurato"
        x-internal-name: "elem_nota"
      rispostaId:
        type: "integer"
        format: "int64"
        example: 1
        description: "ID della risposta del questionario compilato"
        x-internal-name: "risposta_id"
      testoLibero:
        type: "string"
        example: "Esempio di risposta a testo libero"
        description: "testo della risposta nel caso di riposta libera"
        x-internal-name: "testo_libero"
      rispostaDataIns:
        type: "string"
        example: "15/10/2015"
        description: "Data inserimento della risposta. Il formato con cui deve essere\
          \ definita la data DD/MM/YYYY"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
        x-internal-name: "risposta_data_ins"
      rispostaDataMod:
        type: "string"
        example: "15/10/2015"
        description: "Data modifica della risposta. Il formato con cui deve essere\
          \ definita la data DD/MM/YYYY"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
        x-internal-name: "risposta_data_mod"
