        \n\nClasse di modello : RisposteCompilate\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nquesitoId|primaryKey\n\n\nClasse di\
        \ modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
