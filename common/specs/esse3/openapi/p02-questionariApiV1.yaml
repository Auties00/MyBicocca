        required: true
        type: "integer"
        format: "int64"
      - name: "eventCompId"
        in: "query"
        description: "id dell'evento di compilazione del questionario (?)"
        required: true
        type: "string"
      - name: "tagList"
        in: "query"
        description: "(DEPRECATO, usare tagListB) nodo restituito sul dataset UD_LOG_PDS_LIST_WEB\
          \ dalla retrieve LISTA_UD_QUEST_VAL_DID"
        required: false
        type: "string"
      - name: "questConfigId"
        in: "query"
        description: "id della configurazione del questionario (?)"
        required: true
        type: "integer"
        format: "int64"
      - name: "raw"
        in: "query"
        description: "Gestisce delle operazioni sulla descrizione delle domande e\
          \ recupero tag\n* 1 Recupera la lista dei tag e le domande senza sostituire\
          \ i placeholder.\n* 0 (default) recupera le domande con i placeholder restituiti,\
          \ NON recupera la lista dei tag.\n"
        required: false
        type: "integer"
        maxLength: 1
        format: "int64"
      - in: "body"
        name: "body"
        description: "Metodo alternativo di passare la lista dei tag, il body viene\
          \ trattato con precedenza. È comunque obbligatorio passare la lista dei\
          \ tag attraverso il body o attraverso query string"
        required: false
        schema:
          $ref: "#/definitions/TagsList"
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/PaginaQuestionario"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
