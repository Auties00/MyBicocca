      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Sono supportati i seguenti tipi di dato da\
        \ tradurre\n\nTipo (in)      | valore del codice (in)        | valore del\
        \ campo Id (out)  | Chiave Composta | lista Codci aggiuntivi (in)        \
        \                      | Lista Id (out)\n-              | -              \
        \               | -                          | -               | -       \
        \                                                 | -\nAD             | p09_ad_gen.cod\
        \                | p09_ad_gen.ad_id           | No              |        \
        \                                                  |\nCDS            | p06_cds.cod\
        \                   | p06_cds.cds_id             | No              |     \
        \                                                     |\nPDS            |\
        \ p06_pdsord.cod                | p06_pdsord.pds_id          | Si        \
        \      |  p06_cds.cod, p06_pdsord.aa_ord_id, p06_pdsord.pds_id    |  cds_id,\
        \ aa_ord_id, pds_id\nPDSORD         | p06_pdsord.cod                | p06_pdsord.pdsord_id\
        \       | No              |  p06_cds.cod, p06_pdsord.aa_ord_id, p06_pdsord.pds_id\
        \    | \n\n\nIl servizio prende in ingresso un json di id da tradurre e risponde\
        \ con i relativi codici tradotti, nel caso di chiavi composte \nviene valorizzato\
        \ l'insieme chiave composta che contiene la lista degli ID relativi al campo\
        \ richiesto, va comunque valorizzato il campo cod principale\n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa\
        \ di configurazione, la variazione è molto lenta, cache Http abilitata, cache\
