paths:
  /alias/{userId}:
    get:
      tags:
      - "servizi"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera le informazioni dell'alias.\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|noCache|Nessuna cache\
        \ impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getAlias"
      parameters:
      - name: "userId"
        in: "path"
        description: "identificativo univoco che permette di estrarre i dati di utenza\
          \ dalla tabella P18_USER"
        required: true
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/Alias"
        "422":
          description: "parametri errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-cache-type: "noCache"
    post:
      tags:
      - "alias"
      summary: "Inserisce gli alias"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Il sevizio che provvede all’inserimento dell’\
        alias. Verrà richiesto come parametro di esecuzione utente associato all'anagrafica\
        \ a cui attribuire l'alias (tramite il servizio di recupero utenti sarà possibile\
        \ determinare l’utente dal codice fiscale), l'alias da attribuire e l'eventuale\
        \ data di scadenza dell'alias (parametro opzionale). Nel caso in cui l alias\
        \ sia già presente effettua un aggiornamento della data.\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa\
        \ di configurazione, la variazione è molto lenta, cache Http abilitata, cache\
        \ server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "insertUpdateAlias"
      parameters:
      - name: "userId"
        in: "path"
        description: "identificativo univoco che permette di estrarre i dati di utenza\
          \ dalla tabella P18_USER"
        required: true
        type: "string"
      - name: "alias"
        in: "query"
        description: "alias dell utente"
        required: true
        type: "string"
      - name: "dataScadenza"
        in: "query"
        description: "data di scadenza"
        required: false
        type: "string"
      responses:
        "201":
          description: "Update succeded"
          schema:
            $ref: "#/definitions/Alias"
        "422":
          description: "aggiornamento non riuscito"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-custom-operation: "single"
      x-cache-endpoint-relations:
        canonicalEndpointsAction: "invalidate"
    delete:
      tags:
      - "alias"
      summary: "Elimina l'alias associato ad un utente"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
