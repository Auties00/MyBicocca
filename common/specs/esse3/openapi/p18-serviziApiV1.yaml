        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n"
      operationId: "deleteAlias"
      parameters:
      - name: "userId"
        in: "path"
        description: "identificativo univoco che permette di estrarre i dati di utenza\
          \ dalla tabella P18_USER"
        required: true
        type: "string"
      - name: "alias"
        in: "query"
        description: "alias dell utente"
        required: true
        type: "string"
      responses:
        "204":
          description: "Delete succeded"
          schema:
            $ref: "#/definitions/RitornoAlias"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-cache-endpoint-relations:
        canonicalEndpointsAction: "invalidate"
  /annoRif/{tipoDataRifCod}:
    get:
      tags:
      - "servizi"
      description: "Recupera le informazioni dell'anno accademico di riferimento relativo\
        \ al tipo data di input.\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|configuration|Risorsa di configurazione, la variazione\
        \ è molto lenta, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-public-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        ALL|Funzione Pubblica|Security.checkDummy()\n\n\nClasse di modello : AnnoDiRiferimento\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        tipoDataRifCod|primaryKey\n"
      operationId: "getAnnoAccademico"
      parameters:
      - name: "tipoDataRifCod"
        in: "path"
        description: "codice del tipo data di riferimento"
        required: true
        type: "string"
      - name: "tipoCorsoCod"
        in: "query"
        description: "codice del tipo di corso di studio"
        required: false
        type: "string"
      - name: "dataRif"
        in: "query"
        description: "data di riferimento"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/AnnoDiRiferimento"
        "422":
          description: "parametri errati"
      security: []
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
