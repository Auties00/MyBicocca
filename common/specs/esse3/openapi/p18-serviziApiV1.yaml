        required: false
        type: "string"
      - name: "nota"
        in: "query"
        description: "nota associata al parametro di configurazione  (se viene utilizzato\
          \ il carattere * viene applicato il like)"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
