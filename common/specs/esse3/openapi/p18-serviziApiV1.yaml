    \       | Versione di Esse3 di rilascio | Interventi \n-              | -    \
    \                         | -\n    1.1.0      | 19.09.02.00                  \
    \ | aggiunto il metodo /elenchi/{tstId}\n    1.1.0      | 19.09.02.00        \
    \           | aggiunto il metodo /utente-info/{userId} \n"
  version: "1.1.0"
  title: "ESSE3 servizi API"
basePath: "/servizi-service-v1"
