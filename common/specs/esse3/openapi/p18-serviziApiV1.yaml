  /par-conf:
    get:
      tags:
      - "servizi"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera le informazioni di un array di parametri\
        \ di configurazione legato al batch input. I parametri opzionali filtrano\
        \ una UD qualsiasi dell'offerta. I parametri ozionali **start** e **limit**\
        \ consentono di paginare i risultati.\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|configuration|Risorsa di configurazione, la variazione\
        \ è molto lenta, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUserTecnicoMassivo|funzione\
        \ massiva riservata ad utenti tecnici autorizzati|Security.checkMassiveGET()\n\
        \n**Utente: common-soggetto-esterno-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nSOGG_EST|Permette la visualizzazione delle informazioni collegate ad\
        \ una anagrafica soggetto esterno|Security.checkSoggettoEsterno()\n\n**Utente:\
        \ docente-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|funzione\
        \ accessibile alle utenze di tipo docente|Security.checkDocente()\n\n\nClasse\
        \ di modello : ParametroDiConfigurazione\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nparCod|primaryKey\n"
