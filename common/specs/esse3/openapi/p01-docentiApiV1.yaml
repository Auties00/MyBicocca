---
swagger: "2.0"
info:
  description: "I servizi presenti permettono di recuperare le informazioni dei docenti\
    \ ed eseguire operazioni su di essi.\n"
  version: "1.0.0"
  title: "ESSE3 Docenti API"
basePath: "/docenti-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /docenti:
    get:
      tags:
      - "docenti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera le informazioni sul docenti con gli\
        \ eventuuali orari di ricevimento. I parametri opzionali filtrano uno o più\
        \ docenti.\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-massive-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nUserTecnicoMassivo|funzione massiva riservata ad utenti tecnici autorizzati|Security.checkMassiveGET()\n\
        \n\nClasse di modello : DocentiNew\n======\n\nEstensioni sulle proprietà\n\
        ----\nProprietà | x-field-type\n-|-|\ndocentiRecapiti|optional\ndocentiNote|optional\n\
        cariche|optional\norario|optional\ndocenteId|primaryKey\n\n\nClasse di modello\
        \ : DocentiRecapiti\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\ndocenteId|primaryKey\n\n\nClasse di modello : DocentiNote\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        docenteId|primaryKey\n\n\nClasse di modello : DocentiOrario\n======\n\nEstensioni\
        \ sulle proprietà\n----\nProprietà | x-field-type\n-|-|\ndocenteOrarioId|primaryKey\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getDocenti"
      parameters:
      - name: "docenteMatricola"
        in: "query"
        description: "matricola del docente"
        required: false
        type: "string"
      - name: "docenteCognome"
        in: "query"
        description: "cognome del docente (se viene utilizzato il carattere * viene\
          \ applicato il like)"
        required: false
        type: "string"
      - name: "docenteNome"
        in: "query"
        description: "nome del docente (se viene utilizzato il carattere * viene applicato\
          \ il like)"
        required: false
        type: "string"
      - name: "codFis"
        in: "query"
        description: "codice fiscale dell'utente"
        required: false
        type: "string"
      - name: "idAb"
        in: "query"
        description: "ID address book della  persona in ugov"
        required: false
        type: "integer"
        format: "int64"
      - name: "dataMod"
        in: "query"
        description: "data di ultima modifica"
        required: false
        type: "string"
        maxLength: 10
        minLength: 10
      - name: "dataIns"
        in: "query"
        description: "data di inserimento"
        required: false
        type: "string"
        maxLength: 10
        minLength: 10
      - name: "caricaId"
        in: "query"
        description: "ID carica"
        required: false
        type: "integer"
        format: "int64"
      - name: "cdsIdCarica"
        in: "query"
        description: "ID Corso di Studio assiciata alla carica"
        required: false
        type: "integer"
        format: "int64"
      - name: "facIdCarica"
        in: "query"
        description: "ID Facoltà/Dipartimento assiciata alla carica"
        required: false
        type: "integer"
        format: "int64"
      - name: "dataValiditaCarica"
        in: "query"
        description: "Filtro di una carica valida in una determinata data (formato\
          \ DD/MM/YYYY)"
        required: false
        type: "string"
        maxLength: 10
      - name: "facIdAppartenenza"
        in: "query"
        description: "ID Facoltà/Dipartimento appartenenza"
        required: false
        type: "integer"
        format: "int64"
      - name: "ruoliDocCod"
        in: "query"
        description: "Codice ruoli Docenti"
        required: false
        type: "array"
        items:
          type: "string"
          example: "ORD"
          description: "Codice ruolo Docente"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/DocentiNew"
        "422":
          description: "aggiornamento non riuscito"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-circuit-breaker-props:
        rateLimiter-enable: false
        circuitBreaker-enable: false
        bulkhead-enable: true
      x-enabled-profiles:
      - user-tecnico-massive-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UserTecnicoMassivo"
              description: "funzione massiva riservata ad utenti tecnici autorizzati"
