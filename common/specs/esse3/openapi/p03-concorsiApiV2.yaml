---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per accedere alle strutture concorsuali, i servizi\
    \ permettono di recuperare la configurazione dei concorsi, recuperare le iscrizioni,\
    \ le classifiche, le graduatorie ed effettuare gli inserimenti di esse.\nLa documentazione\
    \ è consultabile al link https://wiki.u-gov.it/confluence/display/ESSE3/WS+ESSE3+Area+Concorsi\n\
    ## ChangeLog\n  \nVersione       | Versione di Esse3 di rilascio | Interventi\
    \ \n-              | -                             | -\n    1.0.0      | 21.10.00.00\
    \                   | aggiunta API recupero dati di configurazione dei concorsi\n"
  version: "1.0.0"
  title: "ESSE3 servizi API"
basePath: "/concorsi-service-v2"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /concorsi:
    get:
      tags:
      - "concorsi"
      summary: "Configurazione concorsi"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti  `Concorso`.\n\
        \n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        UTENTE_TECNICO|funzione accessibile alle utenze tecniche per accessi ai servizi\
        \ REST|Security.checkUserTecnico()\n\n\nClasse di modello : Concorso\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\naaId|primaryKey\n\
        testId|primaryKey\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getConcorsi"
      parameters:
      - name: "aaId"
        in: "query"
        description: "anno concorso"
        required: false
        type: "integer"
        format: "int64"
      - name: "filter"
        in: "query"
        description: "il parametro consente di applicare dei filtri alla classe di\
          \ modello utilizzando il linguaggio  [RSQL](https://github.com/jirutka/rsql-parser).\n\
          La lista degli operatori utilizzabili è disponibile [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosullerigherecuperate)\
          \   \n   *NB* il filtro viene applicato DOPO aver recuperato i dati\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Concorso"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
