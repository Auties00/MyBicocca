securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  DettaglioIscrittoConcorso:
    type: "object"
    required:
    - "persId"
    - "posId"
    properties:
      aaId:
        type: "integer"
        format: "int64"
        example: 2017
        description: "Anno concorso"
      testId:
        type: "integer"
        format: "int64"
        example: 1
        description: "Identificativo del concorso"
      persId:
        type: "integer"
        format: "int64"
        example: 1
        description: "Identificativo persona iscritta"
        x-field-type: "primaryKey"
      posId:
        type: "integer"
        format: "int64"
        example: 3
        description: "Identificativo posizione"
        x-field-type: "primaryKey"
      tipoTestCod:
        type: "string"
        example: "A"
        description: "Tipo di concorso: A = test di ammissione ad un corso di studio\
          \ E = Esame di stato S = concorso per accedere ad una SSIS V = test di valutazione\
          \ conoscenze del candidato"
      modTest:
        type: "string"
        example: "U"
        description: "Indica la modalità di svolgimento del concorso, test di valutazione,\
          \ esame di stato: - E: ad esaurimento posti (ordine di presentazione della\
          \ domanda di immatricolazione) - U: basato sul superamento di una prova\
          \ unica - M: basato sul superamento di prove multiple - D: basato sull´\
          ordine di presentazione della domanda di ammissione al concorso."
      tipoTestDes:
        type: "string"
        example: "di Ammissione"
        description: "Descrizione tipologia concorso"
      tipoTestDesEng:
        type: "string"
        example: "Admission"
        description: "Descrizione in lingua inglese della tipologia concorso"
      concorsoDes:
        type: "string"
        example: "Ammissione alle lauree triennali"
        description: "Descrizione del concorso."
      concorsoDesEng:
        type: "string"
        example: "Admission test"
        description: "Descrizione in lingua inglese del concorso."
      dataIniAmmWeb:
        type: "string"
        example: "18/12/2017"
        description: "Data d''inizio del periodo valido per la compilazione delle\
          \ domande di ammissione al concorso, test di valutazione, esame di stato\
          \ da web."
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      dataFinAmmWeb:
        type: "string"
        example: "18/12/2017"
        description: "Data di fine del periodo valido per la compilazione delle domande\
          \ di ammissione al concorso, test di valutazione, esame di stato da web."
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      dataIniDomRipescaggio:
        type: "string"
        example: "22/08/2017"
        description: "Data di inizio del periodo valido per il ripescaggio al concorso."
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      dataFinDomRipescaggio:
        type: "string"
        example: "17/09/2017"
        description: "Data di fine del periodo valido per il ripescaggio al concorso."
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      concNazionale:
        type: "integer"
        format: "int64"
        example: 1
        description: "flag che indica se il concorso è nazionale o meno"
      nota:
        type: "string"
        example: "Attenzione"
        description: "Nota associata al concorso"
      concorsoNotaEng:
        type: "string"
        example: "Attention"
        description: "Nota associata al concorso."
      tipoCorsoCod:
        type: "string"
        example: "L2"
        description: "Tipo di corso di studio a cui è associato il concorso, test\
          \ di valutazione, esame di stato. Per gli esami di stato assume valori nulli."
      tipoCorsoDes:
        type: "string"
        example: "Corso di Laurea"
        description: "Descrizione tipologia corso di studio associata ala concorso"
      tipoCorsoDesEng:
        type: "string"
        example: "Bachelor Degree"
        description: "Descrizione in lingua inglese della tipologia corso di studio\
          \ associata ala concorso"
      taxPagFlg:
        type: "integer"
        format: "int32"
        example: 1
        description: "Indica se il candidato ha pagato o meno la tassa di iscrizione\
          \ al concorso"
      linguaConcorso:
        type: "array"
        items:
          $ref: "#/definitions/LinguaConcorso"
      dettaglioSede:
        type: "array"
        items:
          $ref: "#/definitions/DettaglioSede"
      dettaglioPds:
        type: "array"
        items:
          $ref: "#/definitions/DettaglioPds"
      borse:
        type: "array"
        items:
          $ref: "#/definitions/BorseConcorso"
      dettaglioTest:
        type: "array"
        items:
          $ref: "#/definitions/DettaglioTest"
    x-layout-name: "V03_AMM_CONC_ISCR_REST"
