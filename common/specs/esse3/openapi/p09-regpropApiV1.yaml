      regpropAndId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id univoco del della regola AND"
        x-field-type: "primaryKey"
      regpropOrId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id univoco del della regola OR"
      regpropVincId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id univoco del vincolo di propedeuticità"
      regpropId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id univoco del regolamento di propedeuticità"
      tipoVincoloRegola:
        type: "string"
        example: "NUM_AF"
        description: "per poter soddisfare la regola occorre che venga rispettato\
          \ il tipo di vincolo indicato \n(NUM_AD => Numero di Attività Formative\
          \ da superare (tra quelle possibili); \n TUTTE_AD => vanno superate tutte\
          \ le attività formative elencate; \n PESO => Peso minimo valido)\n"
        enum:
        - "NUM_AD"
        - "TUTTE_AD"
        - "PESO"
        x-internal-name: "tipo_regprop_cod"
      numAd:
        type: "integer"
        format: "int32"
        example: 1
        description: "nel caso il tipoVincoloRegola sia NUM_AF rappresenta il numero\
          \ minimo di AD da superare"
      peso:
        type: "number"
        format: "float"
        example: 5.0
        description: "nel caso il tipoVincoloRegola sia PESO rappresenta il numero\
          \ minimo CFU da superare"
      raggruppamentoFigli:
        type: "integer"
        format: "int32"
        example: 1
        description: "indica come gli elementi figli della regola vanno considerati\
          \ (1 => OR; 2 => AND)"
      figli:
        type: "array"
        items:
          $ref: "#/definitions/RegolaPropFiglio"
