        \ essere valorizzati staSceCod,tottaleOre, totaleRilevazioni ,percentualeOre,\
        \ percentualeRilevazione\n-52   | Mancano dei valori obbligatori della rilevazione.\
        \ devono essere statoRilevazione durata,dataOraInizio\n-53   | Il valore di\
        \ statoRilevazione deve essere A oppure R\n-54   | La matricola passata in\
        \ ingresso non identifica un tratto di carriera univoco\n-55   | La riga del\
        \ libretto passsata in ingresso non coincide con i valori in ingresso (adCod,cdsCod,aaOrdId,pdsId,aaOffId)\n\
        -56   | I valori in ingresso (adCod,cdsCod,aaOrdId,pdsId,aaOffId) non consentono\
        \ di selezionare una sola riga di libretto\n-57   | il campo matId è un campo\
        \ obbligatorio\n-58   | il campo adsceId è un campo obbligatorio\n-59   |\
        \ codFisDocenteControllo non identifica un docente\n-60   | codFisDocenteControllo\
        \ non risulta valorizzato\n-61   | il docente con il codiceFiscaleControllo\
        \ non ha nessuna copertura sulla AD dellla riga del libretto\n-62   | Non\
        \ è possibile cancellare la rilevazione se non viene passata la chiave principale\
        \ della tabella\n-63   | La riga non è stata cancellata\n-64   | Occorre valorizzare\
        \ i parametri della logistica per calcolare la data corretta\n-65   | Occorre\
        \ valorizzare i parametri della logistica per calcolare la data della logistica\
        \ corretta \n-66   | Non è possibile inserire la riga con ext_code = xxxx\
        \ poichè è già presente\n-80   | Deve essere almeno valorizzata una delle\
