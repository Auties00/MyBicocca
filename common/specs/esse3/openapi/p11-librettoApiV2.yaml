  /libretti/freq:
    put:
      tags:
      - "massivo"
      summary: "imposta o rimuove la frequenza per una lista di studenti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Permette di assegnare la freuenza massivamente\
        \ a più studenti\nE' possibile indicare anche il dettaglio delle rilevazioni\
        \ alle lezioni. Se passato i dettagli delle rilevazioni vanno a sovrascrivere\
        \ (per anno di rilevazione) le rilevazioni presenti\n\n##### JSON in ingresso\n\
        Campo                                                                    \
        \          | Descrizione                                                 \
        \                                    | Note\n-                           \
        \                                                       | -              \
        \                                                                        \
        \         | -\ncodFisDocenteRilevazione                                  \
        \                         | il codice fiscale del docente che ha effettuato\
        \ la rilevazione                                  | Il campo va valorizzato\
        \ solo se vengono utilizzate le rilevazioni <br><br> La valorizzazione avviene\
        \ in automatico con codice fiscale del docente nel caso questo sia un docente,\
        \ viceversa se questo è un utente tecnico allora va popolato manualmente\n\
        codFisDocenteControllo                                                   \
        \          | codice fiscale del docente con cui effettuare il controllo di\
        \ coerenza con le righe di libretto | Nel caso sia valorizzato viene controllato\
        \ che il docente colllegato al codcie fiscale abbia una titolarità nel *CODICE*\
        \ della riga che viene caricata. <br><br> La valorizzazione avviene in automatico\
        \ con codice fiscale del docente nel caso questo sia un docente, viceversa\
        \ se questo è un utente tecnico allora va popolato manualmente.<br><br> Nel\
        \ caso non si voglia effettuare il controllo è possibile valorizzare il campo\
        \ come stringa vuota \nadCod                                             \
        \                                 | campo che indica l'attività che lo studente\
        \ deve avere nel libretto                             | Campo obbligatorio,\
        \ valorizzare con il codice AD della riga di libretto da selezionare: viene\
        \ utilizzato assieme ai campi di itentificazione dello studente per selezionare\
        \ la riga di libretto su cui aggiornare la frequenza\ncdsCod<br>aaOrdId<br>pdsId<br>aaOffId<br>fatPartCod<br>domPartCod<br>partCod<br>\
        \   | filtro per il recupero delle righe di libretto                     \
        \                             | Campi opzionali, se valorizzati il controllo\
        \ sulle righe di libretto indicate dagli oggetti studente verifica che oltre\
        \ il codice AD ci sia corrispondenza anche con i valori passati. *Questi campi\
        \ sono necessari per visualizzare i dati nella maschera Rilevazione Frequenze*\n\
        studenti.matricola<br>studenti.matId<br>studenti.adsceId                 \
        \          | l'insieme degli studenti a cui caricare o rimuovere la frequenza\
        \                                | Ogni oggetto rilevazione deve poter identificare\
        \ univocamente una riga di libretto.<br><br> Per poter identificare una riga\
        \ è possibile utilizzare uno dei seguenti campi: <ul><li><strong>matricola</strong>:\
        \ viene cercata la riga di libretto con il codice adCod presente nel tratto\
        \ attivo della carriera attiva che coincide con la matricola</li><li><strong>matId</strong>:\
        \ viene selezionato il tratto di carriera relativo al matId passato in ingresso,\
        \ necessario nel caso il campo matricola non identifici un libretto univoco\
