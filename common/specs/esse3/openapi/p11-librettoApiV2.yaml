securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  ParametriFreq:
    type: "object"
    required:
    - "staSceCod"
    discriminator: "parametriFreqType"
    properties:
      staSceCod:
        type: "string"
        example: "F"
        description: "stato dell'attività didattica F imposta la frequenza P la rimuove"
        pattern: "F|P"
      aaFreqId:
        type: "integer"
        format: "int32"
        example: 2020
        description: "anno di acquisizione della frequenza"
        minimum: 1970.0
        maximum: 2050.0
      dataFreq:
        type: "string"
        example: "10/10/2020"
        description: "data di acquisizione della frequenza"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      percentualePresenza:
        type: "number"
        format: "float"
        description: "percentuale di completamento della frequenza"
        minimum: 0.0
        maximum: 100.0
      percentualeOrePresenza:
        type: "number"
        format: "float"
        example: 0.0
        description: "percentuale ore di frequnza"
        minimum: 0.0
        maximum: 100.0
      rilevazioni:
        type: "array"
        items:
          $ref: "#/definitions/ParametriRilevazioniStudente"
    x-model-sub-package: "libretto.v1"
    x-model-sub-path: "libretto/v1"
  MediaLibretto:
    type: "object"
    required:
    - "base"
    - "definizioneBase"
    - "media"
    - "tipoMediaCod"
    - "tipoOk"
    properties:
      definizioneBase:
        type: "string"
        description: "Tipo di definizione della media recuperando il valore della\
          \ base dall''ordinamento (CDSORD) oppure in base 110 (CDS)"
        enum:
        - "CDS"
        - "CDSORD"
      tipoMediaCod:
        type: "string"
        description: "descrizione della tipologia di media prevista Aritmetica o Ponderata"
        enum:
        - "A"
        - "P"
      base:
        type: "integer"
        format: "int32"
        description: "Base su cui viene calcolata la media"
      tipoOk:
        type: "integer"
        format: "int32"
        description: "valore impostato a 1 se il tipo di media è coerente con quella\
          \ prevista dalle regole"
        minimum: 0.0
        maximum: 1.0
      media:
        type: "number"
        format: "float"
        description: "media calcolata"
    x-model-sub-package: "libretto.v1"
    x-model-sub-path: "libretto/v1"
  TestataTipoGestPren:
    type: "object"
    properties:
      tipoGestPrenCod:
        type: "string"
        example: "STD"
        description: "codice che identifica il tipoGestPren"
        minLength: 3
        maxLength: 3
        x-field-type: "primaryKey"
      des:
        type: "string"
        example: "des"
        description: "descrizione libera"
      listaStudentiFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "indica se è prevista la gestione delle liste studenti in fase\
          \ di prenotazione"
      regAppFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "indica se è prevista la gestione delle regole appelli"
      chkCancPren:
        type: "integer"
        format: "int32"
        example: 1
        description: "imposta la modalità di cancellazione delle prenotazioni"
    x-layout-name: "TIPI_GEST_PREN"
    x-winsession-name: "p10/n_di_10_022_configurazione_calesa"
    x-model-sub-package: "calesa.v1"
    x-model-sub-path: "calesa/v1"
  ParametriFreqSingola:
    allOf:
    - $ref: "#/definitions/ParametriFreq"
    - type: "object"
      properties:
        aaRilevazioneId:
          type: "integer"
          format: "int32"
          example: 2022
          description: "anno della rilevazione, se non passato viene preso il DR_CARR"
        codFisDocenteRilevazione:
          type: "string"
          example: "MRRRSS70G55H4444T"
          description: "codice fiscale del docente nel caso il servizio venga invocato\
            \ come utente tecnico"
        codFisDocenteControllo:
          type: "string"
          example: "MRRRSS70G55H4444T"
          description: "codice fiscale del docente nel caso il servizio venga invocato\
            \ come utente tecnico, per evitare il controllo passare stringa vuota"
