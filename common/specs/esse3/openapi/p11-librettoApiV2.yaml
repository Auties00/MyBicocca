        \                                          | campi con il totale delle ore\
        \ e rilevazioni effettuate                                          | i campi\
        \ sono richiesti se esiste almeno un record rilevazioni inserito\nstudenti.percentualePresenza<br>studenti.percentualeOrePresenza\
        \                    | campi che indicano la percentuale di ore di presenza\
        \ e di rilevazioni dello studente            | i campi sono richiesti se esiste\
        \ almeno un record rilevazioni inserito\n        \n##### Codici di ritorno\
        \ della funzione\nCodice di Ritorno | Descrizione\n-                 | -\n\
        1                 | esecuzione corretta, tutte le rilevazioni sono state caricate\
        \ correttamente\n2                 | ci sono rilevazioni che non sono state\
        \ caricate, il dettaglio è presente negli scarti\n-1                | errore\
        \ generico\n\nPer ogni singolo studente, se ci sono degli errori viene riportato\
        \ un dei seguenti errori (reperibili su scarti[i].retCode)\n\n##### Codici\
        \ di ritorno della funzione\nCodice di Ritorno | Descrizione\n-          \
        \       | -\n-1    | La riga del libretto richiesta non esiste\n-2    | L'attività\
        \ è già superata\n-3    | L'attività ha la frequenza ottenuta tramite convalida\
        \ o riconoscimento.\n-4    | L'attività ha già una prova verbalizzata con\
        \ esito positivo.\n-5    | L'attività è figlia di un raggruppamento di frequenza.\n\
        -6    | Lo studente non ha una iscrizione valida nell''anno passato in ingresso\n\
        -7    | Non è possibile rimuove la frequenza se esiste una prova verbalizzata\n\
        -8    | Non è possibile rimuove la frequenza su una prova in stato Pianificato\n\
        -9    | Non è possibile modificare la frequenza su un tratto carriera non\
        \ attivo\n-10   | Non è possibile modificare la frequenza su una carriera\
        \ non attiva\n-11   | L'anno di frequenza non può essere inferiore all'anno\
        \ di offerta delll''attività didattica\n-50   | La coppia (matId,adCod) in\
        \ ingresso coincide con più righe di libretto, occorre passare anche il campo\
