          type: "integer"
          format: "int32"
          example: 0
          description: "totale rilevazioni"
        totaleOreRilevazioni:
          type: "number"
          format: "float"
          example: 0.0
          description: "ore totali di rilevazioni"
    x-model-sub-package: "libretto.v1"
    x-model-sub-path: "libretto/v1"
