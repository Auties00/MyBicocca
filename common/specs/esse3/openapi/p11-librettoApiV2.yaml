        \n\nClasse di modello : AppelloTgaConfigDett\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nkey|primaryKey\nvalue|primaryKey\n"
      operationId: "getAppelliLibretto"
