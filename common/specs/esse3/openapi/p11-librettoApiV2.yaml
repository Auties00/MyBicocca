---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso al libretto studente, i servizi permettono\
    \ di operare sul libretto degli studenti recuperando le seguenti entità\n\n* testate\
    \ del libretto (tratto di carriera)\n* medie del libretto\n* statistiche sul libretto\n\
    * riga del libretto (attività didattica)\n* prove afferenti ad una riga di libretto\n\
    * segmenti afferenti ad una riga di libretto\n* syllabys collegato ad una riga\
    \ di libretto\n* partizioni collegate ad una riga di libretto\n\n## ChangeLog\n\
    \nVersione       | Versione di Esse3 di rilascio | Interventi \n-            \
    \  | -                             | -\n1.1.0          | 18.02.00.00         \
    \          | Aggiunto l'enpoint /libretti/{matId}/stats con le statistiche del\
    \ libretto  \n1.2.0          | 19.10.03.00                   | Aggiunto l'enpoint\
    \ /libretti/{matId}/righe/{adsceId}/appelli con la lista degli appelli collegati\
    \ alla riga di libretto\n1.2.0          | 19.10.03.00                   | Aggiunto\
    \ l'enpoint /libretti/{matId}/righe/{adsceId}/prenotazioni con la lista delle\
    \ prenotazioni collegate alla riga di libretto\n1.2.0          | 19.10.03.00 \
    \                  | Aggiunto l'enpoint /libretti/{matId}/righe/{adsceId}/prenotazioni/{applistaId}\
    \ con la prenotazione collegate alla riga di libretto\n2.0.0          | 20.05.00.00\
    \                   | Modificato l'endpoint /libretti/{matId}/righe/{adsceId}/freq\
    \ richiedendo un BODY al posto dei parametri FormData, estesi i possibili valori\
    \ con il dettaglio della rilevazione frequenze\n2.1.0          | 20.07.02.00 \
    \                  | Modificato l'endpoint /libretti/{matId}/righe/{adsceId}/appelli,\
    \ aggiunto l'attributo opzionale config e il relativo parametro attoreCod\n2.2.0\
    \          | 20.11.03.00                   | Aggiunto l'endpoint /libretti/classe-studenti/{adLogId}\
    \ con la lista delle righe di libretto degli studenti appartenenti alla condivisione\
    \ logistica\n2.2.0          | 20.11.03.00                   | Aggiunto l'endpoint\
    \ /libretti/classe-studenti/{logAaOffId}/{logAdCod}/{logCdsCod}/{logAaOrdId}/{logPdsCod}\
    \ con la lista delle righe di libretto degli studenti appartenenti alla condivisione\
    \ logistica\n2.3.0          | 21.01.00.00                   | Aggiunto l'endpoint\
    \ /libretti/{matId}/appelli per il recupero degli appelli collegati ad un libretto\n\
    2.4.0          | 21.01.01.00                   | Aggiunto l'endpoint /libretti/rilevazione-freq\
    \ per la gestione delle rilevazioni frequenze\n2.5.0          | 21.04.03.00  \
    \                 | aggiunto il filtro q=APPELLI_PRENOTABILI_E_FUTURI\n2.6.0 \
    \         | 21.11.02.00                   | aggiunti gli endpoint per la l'inserimento\
    \ e cancellazione delle righe del libretto\n2.6.0          | 21.11.02.00     \
    \              | aggiunti gli endpoint per la l'inserimento e cancellazione dei\
    \ riconoscimenti di una riga di libretto\n2.7.0          | 23.03.02.00       \
    \            | aggiunti gli endpoint per il recupero dello statino di prenotazione\
    \ (pdf) e attestato di presenza esame (pdf)\n"
  version: "2.7.0"
  title: "ESSE3 Libretto API"
basePath: "/libretto-service-v2"
tags:
- name: "matricola"
  description: "informazioni sui tratti di carriera"
- name: "libretto"
  description: "informazioni sulle righe di libretto"
- name: "partizione"
  description: "informazioni sulle partizioni"
- name: "syllabus"
  description: "informazioni sul syllabus"
- name: "segmento"
  description: "informazioni sui segmenti"
- name: "prova"
  description: "informazioni sulle prove"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
