        APPELLI_PRENOTABILI_E_FUTURI|recupera tutti gli appelli che non hanno nessuna\
        \ prenotazione e risultano prenotabili o futuri\n\n\nClasse di modello : AppelloLibretto\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        config|optional\ndatacalId|optional\ncapostipiteId|optional\ncommPianId|optional\n\
        indexId|optional\nperiodoId|optional\nappId|primaryKey\nnoteSistLog|optional\n\
        tagTemplId|optional\nsedeId|optional\ngruppoVotoId|optional\nadId|primaryKey\n\
        cdsId|primaryKey\nadStuCod|optional\nadStuDes|optional\nstaSceCod|optional\n\
        \n\nClasse di modello : Appello\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nconfig|optional\ndatacalId|optional\ncapostipiteId|optional\n\
        commPianId|optional\nindexId|optional\nperiodoId|optional\nappId|primaryKey\n\
        noteSistLog|optional\ntagTemplId|optional\nsedeId|optional\ngruppoVotoId|optional\n\
        adId|primaryKey\ncdsId|primaryKey\n\n\nClasse di modello : TestataTipoGestApp\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        tipoGestAppCod|primaryKey\n\n\nClasse di modello : TestataTipoGestPren\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\ntipoGestPrenCod|primaryKey\n\
        \n\nClasse di modello : AppelloPrenConfigDett\n======\n\nEstensioni sulle\
