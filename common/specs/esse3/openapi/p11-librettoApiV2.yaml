  /libretti/{matId}/righe/{adsceId}/freq:
    put:
      tags:
      - "libretto"
      summary: "imposta o rimuove le frequenza dal libretto"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Imposta o rimuove la frequenza di una riga\
        \ di libretto: i valori per l'impostazione della frequenza sono i seguenti\n\
        \  \n  \n  * staSceCod: stato dell'attività didattica (F imposta la freuenza,\
        \ P la rimuove)\n  * aaRilevazioneId: anno della rilevazione della frequenza,\
        \ se non passato viene preso il DR_CARR alla data corrente\n  * aaFreqId:\
        \ anno di acquisizione della frequenza\n  * dataFreq: data di acquisizione\
        \ della frequenza\n  * codFisDocenteControllo: codice fiscale del docente\
        \ con cui effettuare il controllo di coerenza con le righe di libretto, vengono\
        \ caricate solo le attività per le quali il docente indicato ha una titolarità\
        \ sul CODICE Attività didiattica. Viene valorizzato automaticamente se l'utente\
        \ che esegue l'operazione è un docente \n  \n  E'possibile passare opzionalmente\
        \ anche i dati per la rilevazione presenzei dati della rilevazione presenze\
        \ sono i seguenti:\n  \n  * codFisDocenteRilevazione: il codice fiscale del\
        \ docente che ha effettuato la rilevazione; è obbligatorio se l'utente che\
        \ esegue l'operazione non è un docente, se popolato indica il docente che\
        \ ha effettuato la rilevazione\n  * totaleRilevazioni: numero totale rilevazioni\n\
        \  * totaleOreRilevazioni: numero totale ore effettaute\n  * rilevazioni:\
        \ insieme che contiene la lista delle rilevazioni del singolo studente\n \
        \ \n  ##### Codici di ritorno della funzione\nCodice di Ritorno | Descrizione\n\
        -                 | -\n-1    | La riga del libretto richiesta non esiste\n\
        -2    | L'attività è già superata\n-3    | L'attività ha la frequenza ottenuta\
        \ tramite convalida o riconoscimento.\n-4    | L'attività ha già una prova\
        \ verbalizzata con esito positivo.\n-5    | L'attività è figlia di un raggruppamento\
        \ di frequenza.\n-6    | Lo studente non ha una iscrizione valida nell''anno\
        \ passato in ingresso\n-7    | Non è possibile rimuove la frequenza se esiste\
        \ una prova verbalizzata\n-8    | Non è possibile rimuove la frequenza su\
        \ una prova in stato Pianificato\n-9    | Non è possibile modificare la frequenza\
        \ su un tratto carriera non attivo\n-10   | Non è possibile modificare la\
        \ frequenza su una carriera non attiva\n-51   | Mancano dei valori obbligatori\
        \ della rilevazione. devono essere valorizzati staSceCod,tottaleOre, totaleRilevazioni\
        \ ,percentualeOre, percentualeRilevazione\n-52   | Mancano dei valori obbligatori\
        \ della rilevazione. devono essere statoRilevazione durata,dataOraInizio\n\
        -53   | Il valore di statoRilevazione deve essere A oppure R\n-54   | La matricola\
        \ passata in ingresso non identifica un tratto di carriera univoco\n-55  \
        \ | La riga del libretto passsata in ingresso non coincide con i valori in\
        \ ingresso (adCod,cdsCod,aaOrdId,pdsId,aaOffId)\n-56   | I valori in ingresso\
        \ (adCod,cdsCod,aaOrdId,pdsId,aaOffId) non consentono di selezionare una sola\
        \ riga di libretto\n-57   | il campo matId è un campo obbligatorio\n-58  \
        \ | il campo adsceId è un campo obbligatorio\n-59   | codFisDocenteControllo\
        \ non identifica un docente\n-60   | codFisDocenteControllo non risulta valorizzato\n\
        -61   | il docente con il codiceFiscaleControllo non ha nessuna copertura\
        \ sulla AD dellla riga del libretto\n-100  | Errore durante la rimozione della\
        \ frequenza (dettaglio nel messaggio di errore)\n\n\n**Estensioni:**\n\nCodice\
        \ Estensione|Valore|Nota\n-|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza media, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE_PIANI|Permette\
        \ la visualizzazione dei libretti iscritti ai corsi sui quali il docente è\
        \ responsabile dei piani|SecurityCarrieraStudente.checkMatIdResponsabilePiani(matId)\n\
        DOCENTE_APP|Permette la visualizzazione dei libretti che hanno una prenotazione\
        \ in un'attività gestita dal docente|SecurityCarrieraStudente.checkMatIdListaIscritti(matId)\n\
        \n\nClasse di modello : RigaLibretto\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nadsceId|primaryKey\ndebitoFlg|optional\n\
        ofaFlg|optional\ngenAutoFlg|optional\ngenRicSpecFlg|optional\ntipoOrigEvecar|optional\n\
        urlSitoWeb|optional\ninfoDottorati|optional\nrilFreq|optional\nstatoMissione|optional\n\
        statoMissioneDes|optional\ninfoInterateneo|optional\nextraInfo|optional\n\n\
        \nClasse di modello : RilFreq\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nadsceRilId|primaryKey\n\n\nClasse di modello\
        \ : RigaLibrettoExtra\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\nmatId|primaryKey\nadsceId|primaryKey\n\n\nClasse di\
        \ modello : RigaLibrettoExtra\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nmatId|primaryKey\nadsceId|primaryKey\n\n\n\
        Classe di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "setFrequenzaManuale"
      parameters:
      - name: "matId"
        in: "path"
