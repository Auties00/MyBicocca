- jwt:
  - "openid"
paths:
  /libretti:
    get:
      tags:
      - "matricola"
      summary: "Tratti carriera che contengono i libretti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti  `TrattoCarriera`.\
        \ I parametri ozionali **start** e **limit** consentono di paginare i risultati.\
        \ E'' possibile filtrare i libretti da ricercare utilizzando i parametri di\
        \ corso ordinamento e percorso dei tratti dello studente\n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE_PIANI|Permette\
        \ la visualizzazione dei libretti iscritti ai corsi sui quali il docente è\
        \ responsabile dei piani|SecurityCarrieraStudente.checkFilterResponsabilePiani(matricola,\
        \ cdsStuId, cdsStuCod, aaOrdStuId, pdsStuId, pdsStuCod)\nDOCENTE_APP|Permette\
        \ la visualizzazione dei libretti che hanno una prenotazione in un'attività\
        \ gestita dal docente|SecurityCarrieraStudente.checkFilterListaIscritti(matricola,\
        \ cdsStuId, cdsStuCod, aaOrdStuId, pdsStuId, pdsStuCod)\n\n**Utente: STUDENTE**\n\
        \nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|Permette la visualizzazone\
        \ dei libretti delle carriere dello studente|SecurityCarrieraStudente.checkFilterMatId(matricola,\
        \ cdsStuId, cdsStuCod, aaOrdStuId, pdsStuId, pdsStuCod, codFis, staStuCod)\n\
        \n\nClasse di modello : TrattoCarriera\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\naaImm1|optional\ntipoCorsoCod|optional\n\
        tipoCorsoDes|optional\ndrCarr|optional\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n"
      operationId: "getTrattiCarriera"
      parameters:
      - name: "matricola"
        in: "query"
        description: "codice della matricola dello studente"
        required: false
        type: "string"
      - name: "cdsStuId"
        in: "query"
        description: "id del corso di studio di appartenenza dello studente"
        required: false
        type: "integer"
        format: "int64"
      - name: "cdsStuCod"
        in: "query"
        description: "codice del corso di studio di appartenenza dello studente"
        required: false
        type: "string"
      - name: "aaOrdStuId"
        in: "query"
        description: "codice dell'ordinamento di appartenenza dello studente"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "pdsStuId"
        in: "query"
        description: "id del percorso di studio di appartenenza dello studente"
        required: false
        type: "integer"
        format: "int64"
      - name: "pdsStuCod"
        in: "query"
        description: "codice del percorso di studio di appartenenza dello studente"
        required: false
        type: "string"
      - name: "codFis"
        in: "query"
        description: "codice fiscale delo studente"
        required: false
        type: "string"
      - name: "staStuCod"
        in: "query"
        description: "codice dello stato della carriera"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
