  /libretti/{matId}/stats:
    get:
      tags:
      - "libretto"
      summary: "Tutte le medie del libretto"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera le informazioni sulle statistiche\
        \ collegate al libretto.\n\nIl calcolo viene effettuato con il motore controllo\
        \ piani, per fornire le informazioni di CFU Convalidati  secondo le regole\n\
        di percorso previste per l'ordinamento collegato alla iscrizione dello studente.\n\
        \nNel caso le regole di percorso non siano presenti, non vengono forniti i\
        \ valori (lasciati a null) \n\n* `umPesoCalcolato` \n* `umPesoConvalidato`\n\
        * `umPesoSuperato`\n* `umPesoMax`\n\nma i soli valori derivanti dalla somma\
        \ dei pesi presenti a libretto.\n  \n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE_PIANI|Permette\
        \ la visualizzazione dei libretti iscritti ai corsi sui quali il docente è\
        \ responsabile dei piani|SecurityCarrieraStudente.checkMatIdResponsabilePiani(matId)\n\
        DOCENTE_APP|Permette la visualizzazione dei libretti che hanno una prenotazione\
        \ in un'attività gestita dal docente|SecurityCarrieraStudente.checkMatIdListaIscritti(matId)\n\
        \n**Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|Permette\
        \ la visualizzazone delle informazioni del tratto della carriea dello studente|Security.checkMatId(matId)\n\
        \n\nClasse di modello : StatsLibretto\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nmedie|optional\n\n\nClasse di modello\
        \ : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getStatsLibretto"
      parameters:
      - name: "matId"
        in: "path"
        description: "id del tratto di carriera per cui recuperare il libretto"
        required: true
        type: "integer"
        format: "int64"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "dataRifMedieIni"
        in: "query"
        description: "data di riferimento iniziale per il calcolo delle medie"
        required: false
        type: "string"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      - name: "dataRifMedieFin"
        in: "query"
        description: "data di riferimento finale per il calcolo delle medie"
        required: false
        type: "string"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      - name: "motRegolePercorso"
        in: "query"
        description: "tipo di regole da utilizzare (default OFFF)"
        required: false
        type: "string"
        enum:
        - "OFFF"
        - "RAD"
      - name: "motOrigineDati"
