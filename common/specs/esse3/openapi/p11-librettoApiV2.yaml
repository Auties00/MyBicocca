  /libretti/rilevazioni-freq/:
    put:
      tags:
      - "massivo"
      summary: "gestione delle rilevazioni di frequenza"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di gestire le rilevazioni di frequenza,\
        \ è possibile anche passare le rilevazioni frequenze sul metodo di assegnazione\
        \ della frequenza\nmassivo `libretti/freq` oppure puntuale `/libretti/{matId}/righe/{adsceId}/freq`.\
        \ Quei metodi assegnano la frequenza e salvano anche le \ninformazioni sul\
        \ dettaglio delle rilevazioni.\n\nQuesto metodo al contrario invece consente\
        \ di gestire le sole rilevazioni secondo i codici delle operazioni previste.\
        \ \nIn questo caso i dati precedentemetne inseriti non vengono sovrascritti.\n\
        \ \n\n##### JSON in ingresso\nCampo                                      \
        \                                        | Descrizione                   \
        \                                                                  | Note\n\
        -                                                                        \
        \          | -                                                           \
        \                                    | -\noperazione                     \
        \                                                    | tipo di operazione\
        \ richiesta                                                              \
        \      | possibili valori : ADD_RILEVAZIONI, DELETE_RILEVAZIONI, CALCOLA_STATS_E_ALLINEA_FREQ\n\
        codFisDocenteRilevazione                                                 \
        \          | il codice fiscale del docente che ha effettuato la rilevazione\
        \                                  | Il campo va valorizzato solo se vengono\
        \ utilizzate le rilevazioni <br><br> La valorizzazione avviene in automatico\
        \ con codice fiscale del docente nel caso questo sia un docente, viceversa\
        \ se questo è un utente tecnico allora va popolato manualmente\ncodFisDocenteControllo\
        \                                                             | codice fiscale\
        \ del docente con cui effettuare il controllo di coerenza con le righe di\
        \ libretto | Nel caso sia valorizzato viene controllato che il docente colllegato\
        \ al codcie fiscale abbia una titolarità nel *CODICE* della riga che viene\
        \ caricata. <br><br> La valorizzazione avviene in automatico con codice fiscale\
        \ del docente nel caso questo sia un docente, viceversa se questo è un utente\
        \ tecnico allora va popolato manualmente.<br><br> Nel caso non si voglia effettuare\
        \ il controllo è possibile valorizzare il campo come stringa vuota \nadCod\
        \                                                                        \
        \      | campo che indica l'attività che lo studente deve avere nel libretto\
        \                             | Campo obbligatorio, valorizzare con il codice\
        \ AD della riga di libretto da selezionare: viene utilizzato assieme ai campi\
        \ di itentificazione dello studente per selezionare la riga di libretto su\
        \ cui aggiornare la frequenza\ncdsCod<br>aaOrdId<br>pdsId<br>aaOffId<br>fatPartCod<br>domPartCod<br>partCod<br>\
        \   | filtro per il recupero delle righe di libretto                     \
        \                             | Campi opzionali, se valorizzati il controllo\
        \ sulle righe di libretto indicate dagli oggetti studente verifica che oltre\
        \ il codice AD ci sia corrispondenza anche con i valori passati. *Questi campi\
        \ sono necessari per visualizzare i dati nella maschera Rilevazione Frequenze*\n\
        studenti.matricola<br>studenti.matId<br>studenti.adsceId                 \
        \          | l'insieme degli studenti a cui caricare o rimuovere la frequenza\
        \                                | Ogni oggetto rilevazione deve poter identificare\
        \ univocamente una riga di libretto.<br><br> Per poter identificare una riga\
        \ è possibile utilizzare uno dei seguenti campi: <ul><li><strong>matricola</strong>:\
        \ viene cercata la riga di libretto con il codice adCod presente nel tratto\
        \ attivo della carriera attiva che coincide con la matricola</li><li><strong>matId</strong>:\
        \ viene selezionato il tratto di carriera relativo al matId passato in ingresso,\
        \ necessario nel caso il campo matricola non identifici un libretto univoco\
        \ (carriere compatibili)</li><li><strong>adsceId</strong>: viene selezioata\
        \ la riga di libretto indicata, necessario quando il campo adCod non consenta\
        \ di selezionare una riga univoca (attività reiterabile)</li></ul><br><br>\
        \ Se vengono pasati contemporaneamente più valori questi devono essere coerenti\n\
        studenti.aaFreqId<br>studenti.staSceCod<br>studenti.dataFreq             \
        \          | campi per impostare/Rimuovere la frequenza                  \
        \                                    | Operazioni possibili<be><br><br><ul><li><strong>Assegnazione\
        \ frequenza</strong>: impostare staSceCod=F e aaFreqId=anno_freq, la data\
        \ di frequenza è opzionale</li><li><strong>Assegnazione frequenza</strong>:\
        \ impostare staSceCod=P e aaFreqId=null</li></ul>\nstudenti \n\n##### Codici\
        \ Operazioni prevsite\nOperazione                   | Descrizione\n-     \
        \                       | -\nADD_RILEVAZIONI              | Aggiunge le rilevazioni\
        \ allo studente\nDELETE_RILEVAZIONI           | cancella le rilevazioni dallo\
        \ studente, la rilevazione da cancellare viene passata nel parametro IdRilevazione\
        \ della rilevazione stessa\nCALCOLA_STATS_E_ALLINEA_FREQ | calcola le statistiche\
        \ e allinea la frequenza sui libretti (solo per la AD non superate), se non\
        \ passati l'anno di frequenza e la data vengono calcolate come l'anno corrente\
        \ (DR_CARR) e la data dell'ultima rilevazione.\n        \n##### Codici di\
        \ ritorno della funzione\nCodice di Ritorno | Descrizione\n-             \
        \    | -\n1                 | esecuzione corretta, tutte le rilevazioni sono\
        \ state caricate correttamente\n2                 | ci sono rilevazioni che\
        \ non sono state caricate, il dettaglio è presente negli scarti\n-1      \
        \          | errore generico\n\nPer ogni singolo studente, se ci sono degli\
        \ errori viene riportato un dei seguenti errori (reperibili su scarti[i].retCode),\
        \ per il dettaglio dei codici di errore verificare la documentazione del metodo\
        \ `/libretti/freq`\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|funzione\
        \ accessibile alle utenze di tipo docente|Security.checkDocente()\n\n\nClasse\
        \ di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "putMassivaRilevazioni"
      parameters:
      - in: "body"
        name: "body"
        description: "Oggetto che contiene gli studenti a cui assegnare la frequenza"
        required: true
        schema:
