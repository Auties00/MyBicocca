      x-custom-operation: "single"
  /importBadgeIssuing:
    put:
      tags:
      - "importBadgeIssuing"
      summary: "consente di importare i dati di emissione di un badge"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di acquisire le informazioni relative\
        \ all'avvenuta emissione (o annullamento) di un badge su piattaforma esterna,\
        \ a seguito di un evento notificato precedentemente da parte di Esse3.\n\n\
        ##### Dati in ingresso\nCampo       | Campi obbligatori                  \
        \          | Note \n-           | -                                      \
        \      | - \n/           | evento, refId, badgeId, email, dataEmissione |\
        \ badgeId, email, dataEmissione non sono obbligatori nel caso di evento=ANNULLAMENTO\n\
        \n##### Codici di errore restituiti\nCodice di Ritorno | Descrizione\n-  \
        \               | -\n 0                | Errore generico\n-1             \
        \   | Non risulta inviata alcuna richiesta badge per il caso indicato\n\n\n\
        **Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "putBadgeIssuing"
      parameters:
      - in: "body"
        name: "body"
        description: "Oggetto che contiene i dati di emissione/annullamento di un\
          \ badge"
        required: true
        schema:
          $ref: "#/definitions/NotificaEmissioneBadge"
      responses:
        "200":
          description: "Dati acquisiti con successo"
          schema:
            type: "string"
            description: "Esito dell'operazione"
        "422":
          description: "Operazione non riuscita"
          schema:
            $ref: "#/definitions/DettaglioErrore"
