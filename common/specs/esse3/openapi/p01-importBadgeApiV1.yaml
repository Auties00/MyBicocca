            $ref: "#/definitions/RitornoBadgeClass"
        "422":
          description: "Inserimento non riuscito"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
