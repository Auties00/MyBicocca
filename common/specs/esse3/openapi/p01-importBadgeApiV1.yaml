swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'import dati relativi ad Open Badge emessi\
    \ su piattaforma esterna\n\n## ChangeLog\n\nVersione       | Versione di Esse3\
    \ di rilascio | Interventi \n -             | -                             |\
    \ -\n    1.1.0      | 22.02.01.00                   | creazione\n    1.2.0   \
    \   | 22.10.00.00                   | aggiunto importBadgeIssuing\n    \n"
  version: "1.1.0"
  title: "ESSE3 Import Badge"
basePath: "/importbadge-service-v1"
tags:
- name: "importBadgeClass"
  description: "Import Tipi Titoli da REST"
