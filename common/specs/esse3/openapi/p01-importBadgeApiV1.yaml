securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalit� � disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  BadgeClass:
    type: "object"
    required:
    - "createdAt"
    - "id"
    - "issuer"
    - "obidescription"
    - "obiname"
    - "status"
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1
        description: "identificativo numerico"
      identificativo:
        type: "string"
        example: "identificativo91"
        description: "campo Identificativo"
        maxLength: 255
      status:
        type: "string"
        example: "published"
        description: "status"
        maxLength: 255
      obiname:
        type: "string"
        example: "Entrepreneurship Basic"
        description: "nome della badge class"
        maxLength: 255
      obidescription:
        type: "string"
        example: "Giardino delle imprese - High School"
        description: "descrizione"
        maxLength: 4000
      createdAt:
        type: "string"
        example: "10/10/2007"
        description: "data di creazione"
        maxLength: 10
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      updatedAt:
        type: "string"
        example: "10/10/2007"
        description: "data di ultima modifica"
        maxLength: 10
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      imageUrl:
        type: "string"
        example: "https://bestr.it/filemanager/show/a88182aa-0dba-4306-84a0-edc7d7245be7.png"
        description: "visual del badge"
        maxLength: 255
      alignment:
        type: "string"
        example: "Open badge"
        description: "attributo aggiuntivo alla badge class viene recuperato solo\
          \ in get ignorato nella post"
        maxLength: 255
      issuer:
        $ref: "#/definitions/Issuer"
      customData:
        type: "array"
        items:
          $ref: "#/definitions/CustomData"
