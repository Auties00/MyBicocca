paths:
  /importAward:
    post:
      tags:
      - "importAward"
      summary: "consente di importare uno o più badge (Award)"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Importa i dati di uno o più badge (Award):\
        \ in Esse3 vengono inseriti come Titoli universitari, dettagliati per livello\
        \ (Badge Class)\n\n##### Parametri in ingresso\nCampo       | Campi obbligatori\
        \                 | Note \n-           | -                               \
        \  | - \nimport      |  - vedi modello                   | il body json che\
        \ contiene tutte le informazioni da importare\n\n##### Codici di ritorno della\
        \ funzione\nCodice di Ritorno | Descrizione\n-                 | -\n-1  |\
        \ Errore nell'import\n\n\n##### Note \n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ bassa, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        UTENTE_TECNICO|funzione accessibile alle utenze tecniche per accessi ai servizi\
        \ REST|Security.checkUserTecnico()\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n"
      operationId: "postImportAward"
      parameters:
      - in: "body"
        name: "body"
        description: "Oggetto che contiene il json con i dati da inserire"
        required: true
        schema:
          type: "array"
          items:
            $ref: "#/definitions/Award"
      responses:
        "201":
          description: "Ritorna idtestata elaborazione se import con successo"
          schema:
            $ref: "#/definitions/RitornoAward"
        "422":
          description: "Inserimento non riuscito"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-custom-operation: "single"
  /importBadgeClass:
    post:
      tags:
      - "importBadgeClass"
      summary: "consente di importare una o più tipologie di badge (Badge Class)"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Importa i dati di una o più tipologie di badge\
        \ (Badge Class): in Esse3 vengono inserite all'interno dei Tipi Titoli universitari\n\
        \n##### Parametri in ingresso\nCampo       | Campi obbligatori           \
        \      | Note \n-           | -                                 | - \nimport\
        \      |  - vedi modello                   | il body json che contiene tutte\
        \ le informazioni da importare\n\n##### Codici di ritorno della funzione\n\
        Codice di Ritorno | Descrizione\n-                 | -\n-1  | Errore nell'import\n\
        \n\n##### Note \n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|lowRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ bassa, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
