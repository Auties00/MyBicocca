      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Modifica una prenotazione di una determinata\
        \ persona annullando il vecchio appuntamento indicato\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|midRefreshRateUserDependent|Risorsa\
