---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per Calendario Appuntamenti\n\n## ChangeLog\n  \n\
    Versione       | Versione di Esse3 di rilascio | Interventi \n-              |\
    \ -                             | -\n    1.0.0      | 20.01.02.00            \
    \       | aggiunto l'endpoint get    /calendari/contesti/{contestoCalendario}\
    \ per recuperare i calendari relativi ad un contesto\n    1.0.0      | 20.01.02.00\
    \                   | aggiunto l'endpoint get    /calendari/turni/{codTipoCalendario}\
    \ per recuperare i turni relativi ad un calendario\n    1.0.0      | 20.01.02.00\
    \                   | aggiunto l'endpoint get    /calendari/contesti/{contestoCalendario}/appuntamenti/{persId}\
    \ per recuperare le prenotazioni di una persona\n    1.0.0      | 20.01.02.00\
    \                   | aggiunto l'endpoint post   /calendari/appuntamenti/{persId}\
    \ per prenotare un appuntamento\n    1.0.0      | 20.01.02.00                \
    \   | aggiunto l'endpoint put    /calendari/appuntamenti/{persId}/{appId} per\
    \ modificare una prenotazione\n    1.0.0      | 20.01.02.00                  \
    \ | aggiunto l'endpoint delete /calendari/appuntamenti/{persId}/{appId} per annullare\
    \ una prenotazione\n"
  version: "1.0.0"
  title: "ESSE3 servizi API"
basePath: "/calendario-app-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /calendari/appuntamenti/{persId}:
