# The live tests of Esse3, run with a student's account: see "Live tests" in common/codegen/README.md.
account:
  env: [ESSE3_USERNAME, ESSE3_PASSWORD]
  roles: [STUDENT, AUTHENTICATED_USER, ANY]
  headers:
    Authorization: "Basic {base64:{env:ESSE3_USERNAME}:{env:ESSE3_PASSWORD}}"
  anonymous: [Careers.getCareers]
limits:
  requestsPerSecond: 2
  maxRequests: 2500
operations:
  Auth.logout:
    skip: Ends the session the other cases use.
  PersonalData.putMobilePhone:
    # Sets a placeholder number on the student's record for a moment, then puts the old one back.
    # A student with no number on record is skipped: there would be nothing to restore.
    inputs:
      personId: { from: PersonalData.getPersonTitles, pick: personId }
      body: { cellulare: "3330000000" }
    undo:
      restore:
        read: PersonalData.getPerson
        with: { personId: $args.personId }
        pick: mobilePhone
        into: body.mobilePhone
    verify:
      call: PersonalData.getPerson
      with: { personId: $args.personId }
      contains: { path: mobilePhone, value: $args.body.mobilePhone }
