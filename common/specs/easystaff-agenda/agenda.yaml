# Agenda Web, EasyStaff's public timetable portal of the university (lesson schedules, exam
# calendars, rooms and events), and EasyBadge, its attendance service on the same host. EasyStaff
# publishes no spec, so this one is written by hand from the traffic of the official web
# front-end. See common/codegen/readers/openapi for the x-mb-* extensions.
#
# Agenda Web is a PHP application: its option lists are JSON assigned to variables of a script
# (combo.php), its searches are form posts carrying the state of the search form, and its room
# showcase is a page whose script assigns the rooms as JSON too. Dates are sent as dd-MM-yyyy,
# and lessons and events time-stamped with epoch seconds.
openapi: 3.0.3
info:
  title: EasyStaff Agenda Web
  version: "1"
x-mb-id: easystaff-agenda
x-mb-prefix: EasyStaff
x-mb-client:
  # The university's servers are slow.
  timeoutSeconds: 30
  sendsNulls: false

servers:
  - url: https://gestioneorari.didattica.unimib.it
    x-mb-name: Main

tags:
  - name: Core
    description: Academic years, teachers and study programs.
  - name: Buildings
    description: Buildings, rooms and their occupation.
  - name: Schedule
    description: Weekly lesson schedules.
  - name: Exams
    description: Exam calendars.
  - name: Events
    description: Events booked in the university's rooms.
  - name: Attendance
    description: EasyBadge, the attendance records of lessons with compulsory attendance.

paths:
  # combo.php declares the options of the search forms as script variables; one call declares
  # several, which are separate operations here.
  /PortaleStudentiUnimib/combo.php?academic-years:
    get:
      tags: [Core]
      operationId: getAcademicYears
      summary: The academic years, keyed by an internal identifier.
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: ec_, aa: "1" }
      x-mb-script-variable: anni_accademici_ec
      responses:
        "200":
          description: The script declaring the years.
          content:
            text/javascript:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/EasyStaffAcademicYear"
  /PortaleStudentiUnimib/combo.php?teachers:
    get:
      tags: [Core]
      operationId: getTeachers
      summary: The teachers of an academic year, with the courses they teach.
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: ec_, page: docenti }
      x-mb-script-variable: elenco_docenti
      parameters:
        - $ref: "#/components/parameters/AcademicYear"
      responses:
        "200":
          description: The script declaring the teachers.
          content:
            text/javascript:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffTeacher"
  /PortaleStudentiUnimib/combo.php?study-programs:
    get:
      tags: [Core]
      operationId: getStudyPrograms
      summary: The study programs of an academic year, with their years and subjects.
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: ec_, page: corsi }
      x-mb-script-variable: elenco_corsi
      parameters:
        - $ref: "#/components/parameters/AcademicYear"
      responses:
        "200":
          description: The script declaring the study programs.
          content:
            text/javascript:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffStudyProgram"
  /PortaleStudentiUnimib/combo.php?buildings:
    get:
      tags: [Buildings]
      operationId: getBuildings
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: rooms_ }
      x-mb-script-variable: elenco_sedi
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The script declaring the buildings.
          content:
            text/javascript:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffBuilding"
  /PortaleStudentiUnimib/combo.php?rooms:
    get:
      tags: [Buildings]
      operationId: getRooms
      summary: The rooms of every building, keyed by the building's code.
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: rooms_ }
      x-mb-script-variable: elenco_aule
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The script declaring the rooms.
          content:
            text/javascript:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/EasyStaffRoom"
  /PortaleStudentiUnimib/combo.php?teaching-areas:
    get:
      tags: [Buildings]
      operationId: getTeachingAreas
      summary: The teaching areas (schools and departments).
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: rooms_ }
      x-mb-script-variable: elenco_scuole
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The script declaring the teaching areas.
          content:
            text/javascript:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffTeachingArea"
  /PortaleStudentiUnimib/combo.php?event-types:
    get:
      tags: [Events]
      operationId: getEventTypes
      x-mb-path: /PortaleStudentiUnimib/combo.php
      x-mb-query: { sw: rooms_ }
      x-mb-script-variable: elenco_tipi
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The script declaring the event types.
          content:
            text/javascript:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffEventType"

  /PortaleStudentiUnimib/rooms_call.php:
    post:
      tags: [Buildings]
      operationId: getBuildingOccupation
      summary: The events of a building's rooms on a day.
      x-mb-envelope: [events]
      x-mb-form:
        view: rooms
        include: rooms
        list: ""
        week_grid_type: "-1"
        ar_codes_: ""
        ar_select_: ""
        col_cells: "0"
        empty_box: "0"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "0"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: ["sede[]", date]
              properties:
                sede[]:
                  x-mb-name: buildings
                  x-mb-repeated: true
                  description: The codes of the buildings.
                  type: array
                  items:
                    type: string
                aula[]:
                  x-mb-name: rooms
                  x-mb-repeated: true
                  description: The codes of the rooms to restrict the occupation to.
                  type: array
                  items:
                    type: string
                date:
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffRoomOccupationEvent"

  /PortaleStudentiUnimib/index.php:
    get:
      tags: [Buildings]
      operationId: getRoomDetails
      summary: The showcase of a building's rooms (capacity, floor, equipment, accessibility), by building identifier.
      description: The showcase page assigns the rooms it shows to `window.data_to_show`, which its own PDF export reads.
      x-mb-query:
        form-type: vetrina_aule
        view: vetrina_aule
        include: vetrina_aule
        list: ""
        week_grid_type: "-1"
        ar_codes_: ""
        ar_select_: ""
        col_cells: "0"
        empty_box: "1"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "0"
      x-mb-script-variable: window.data_to_show
      parameters:
        - name: sede[]
          in: query
          required: true
          x-mb-name: buildings
          x-mb-repeated: true
          description: The codes of the buildings.
          schema:
            type: array
            items:
              type: string
        - name: aula[]
          in: query
          x-mb-name: rooms
          x-mb-repeated: true
          description: The codes of the rooms to restrict the showcase to.
          schema:
            type: array
            items:
              type: string
        - name: _lang
          in: query
          x-mb-name: language
          schema:
            default: it
            allOf:
              - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The showcase page.
          content:
            text/html:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/EasyStaffRoomShowcaseBuilding"

  # grid_call.php answers the lesson schedule search, in three modes.
  /PortaleStudentiUnimib/grid_call.php?program:
    post:
      tags: [Schedule]
      operationId: getScheduleByProgram
      summary: The week of lessons of some years of a study program.
      x-mb-path: /PortaleStudentiUnimib/grid_call.php
      x-mb-envelope: [celle]
      x-mb-form:
        view: easycourse
        form-type: corso
        include: corso
        empty_box: "1"
        highlighted_date: "0"
        all_events: "1"
        ar_codes_: ""
        ar_select_: ""
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [anno, corso, "anno2[]", date]
              properties:
                anno:
                  x-mb-name: academicYear
                  description: The first calendar year of the academic year.
                  type: string
                corso:
                  x-mb-name: program
                  description: The code of the study program.
                  type: string
                anno2[]:
                  x-mb-name: years
                  x-mb-repeated: true
                  description: The codes of the years of the study program.
                  type: array
                  items:
                    type: string
                date:
                  x-mb-name: week
                  description: A day of the week.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The cells of the schedule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffScheduleCell"
  /PortaleStudentiUnimib/grid_call.php?teacher:
    post:
      tags: [Schedule]
      operationId: getScheduleByTeacher
      summary: The week of lessons a teacher gives in some years of a study program.
      x-mb-path: /PortaleStudentiUnimib/grid_call.php
      x-mb-envelope: [celle]
      x-mb-form:
        view: easycourse
        form-type: docente
        include: docente
        visualizzazione_orario: cal
        periodo_didattico: ""
        list: ""
        week_grid_type: "-1"
        ar_codes_: ""
        ar_select_: ""
        col_cells: "0"
        empty_box: "1"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "1"
        faculty_group: "0"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [anno, docente, corso, "anno2[]", date]
              properties:
                anno:
                  x-mb-name: academicYear
                  description: The first calendar year of the academic year.
                  type: string
                docente:
                  x-mb-name: teacher
                  description: The code of the teacher.
                  type: string
                corso:
                  x-mb-name: program
                  description: The code of the study program.
                  type: string
                anno2[]:
                  x-mb-name: years
                  x-mb-repeated: true
                  description: The codes of the years of the study program.
                  type: array
                  items:
                    type: string
                txtcurr:
                  x-mb-name: yearNames
                  description: The names of the years, comma-separated, as the form shows them.
                  type: string
                date:
                  x-mb-name: week
                  description: A day of the week.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The cells of the schedule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffScheduleCell"
  /PortaleStudentiUnimib/grid_call.php?subjects:
    post:
      tags: [Schedule]
      operationId: getScheduleBySubjects
      summary: >-
        The week of lessons of some subjects, merged into one schedule. Each cell carries its
        subject's code; the cells are those of a separate search per subject.
      x-mb-path: /PortaleStudentiUnimib/grid_call.php
      x-mb-envelope: [celle]
      x-mb-form:
        view: easycourse
        form-type: attivita
        include: attivita
        visualizzazione_orario: cal
        periodo_didattico: ""
        list: ""
        week_grid_type: "-1"
        ar_codes_: ""
        ar_select_: ""
        col_cells: "0"
        empty_box: "1"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "1"
        faculty_group: "0"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [anno, "attivita[]", date]
              properties:
                anno:
                  x-mb-name: academicYear
                  description: The first calendar year of the academic year.
                  type: string
                attivita[]:
                  x-mb-name: subjects
                  x-mb-repeated: true
                  description: The codes of the subjects.
                  type: array
                  items:
                    type: string
                date:
                  x-mb-name: week
                  description: A day of the week.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The cells of the schedule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffScheduleCell"

  # test_call.php answers the exam calendar search, in three modes.
  /PortaleStudentiUnimib/test_call.php?program:
    post:
      tags: [Exams]
      operationId: getExamsByProgram
      summary: The exams of some years of a study program in a date range.
      x-mb-path: /PortaleStudentiUnimib/test_call.php
      x-mb-form:
        view: easytest
        et_er: "1"
        week_grid_type: "-1"
        col_cells: "0"
        empty_box: "1"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "0"
        form-type: et_cdl
        include: et_cdl
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [scuola, esami_cdl, "anno2[]", datefrom, dateto]
              properties:
                scuola:
                  x-mb-name: teachingArea
                  description: The code of the study program's teaching area.
                  type: string
                esami_cdl:
                  x-mb-name: program
                  description: The code of the study program.
                  type: string
                anno2[]:
                  x-mb-name: years
                  x-mb-repeated: true
                  description: The numbers of the years of the study program (1, 2, …).
                  type: array
                  items:
                    type: string
                datefrom:
                  x-mb-name: from
                  description: The first day.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                dateto:
                  x-mb-name: to
                  description: The last day.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The exams, grouped by subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EasyStaffExamCalendar"
  /PortaleStudentiUnimib/test_call.php?teacher:
    post:
      tags: [Exams]
      operationId: getExamsByTeacher
      summary: The exams of a teacher in a date range.
      x-mb-path: /PortaleStudentiUnimib/test_call.php
      x-mb-form:
        view: easytest
        et_er: "1"
        week_grid_type: "-1"
        col_cells: "0"
        empty_box: "1"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "0"
        form-type: et_docente
        include: et_docente
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [esami_docente, datefrom, dateto]
              properties:
                esami_docente:
                  x-mb-name: teacher
                  description: The identifier of the teacher.
                  type: string
                datefrom:
                  x-mb-name: from
                  description: The first day.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                dateto:
                  x-mb-name: to
                  description: The last day.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The exams, grouped by subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EasyStaffExamCalendar"
  /PortaleStudentiUnimib/bookings_call.php:
    post:
      tags: [Events]
      operationId: getEvents
      summary: The events booked in a date range, filtered by building, room, type, status, day and time.
      x-mb-envelope: [events]
      x-mb-form:
        view: bookings
        form-type: bookings
        include: bookings
        mode: bookings
        list: ""
        week_grid_type: "-1"
        ar_codes_: ""
        ar_select_: ""
        col_cells: "0"
        empty_box: "0"
        only_grid: "0"
        highlighted_date: "0"
        all_events: "0"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: ["sede[]", datefrom, dateto]
              properties:
                sede[]:
                  x-mb-name: buildings
                  x-mb-repeated: true
                  description: The codes of the buildings; `all` for every building, `senza_aula` for events without a room.
                  type: array
                  items:
                    type: string
                aula[]:
                  x-mb-name: rooms
                  x-mb-repeated: true
                  description: The codes of the rooms.
                  type: array
                  items:
                    type: string
                tipo:
                  x-mb-name: type
                  description: The code of the event type.
                  type: integer
                stato:
                  x-mb-name: status
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffBookingStatus"
                ricerca:
                  x-mb-name: keyword
                  type: string
                datefrom:
                  x-mb-name: from
                  description: The first day.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                dateto:
                  x-mb-name: to
                  description: The last day.
                  type: string
                  format: date
                  x-mb-pattern: dd-MM-yyyy
                giorno_settimana[]:
                  x-mb-name: daysOfWeek
                  x-mb-repeated: true
                  type: array
                  items:
                    $ref: "#/components/schemas/EasyStaffDayOfWeek"
                start_time:
                  x-mb-name: startTime
                  type: string
                  format: time
                  x-mb-pattern: HH:mm
                end_time:
                  x-mb-name: endTime
                  type: string
                  format: time
                  x-mb-pattern: HH:mm
                _lang:
                  x-mb-name: language
                  default: it
                  allOf:
                    - $ref: "#/components/schemas/EasyStaffLanguage"
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EasyStaffEvent"

  /easybadge/api/corso_iscritti.php:
    post:
      tags: [Attendance]
      operationId: getAttendanceHistory
      summary: >-
        A student's attendance, keyed by the student's number and then by course; a student with
        no record is sent with an empty map.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EasyStaffAttendanceHistoryRequest"
      responses:
        "200":
          description: The attendance records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      $ref: "#/components/schemas/EasyStaffAttendanceRecord"
  /easybadge/api/TimbratureApi.php:
    post:
      tags: [Attendance]
      operationId: certifyAttendance
      summary: Records the student's presence at a lesson, from the code shown in the room.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EasyStaffCertifyAttendanceRequest"
      responses:
        "200":
          description: Whether the presence was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EasyStaffCertifyAttendanceResult"

components:
  parameters:
    AcademicYear:
      name: aa
      in: query
      required: true
      x-mb-name: academicYear
      description: The first calendar year of the academic year.
      schema:
        type: string
    Language:
      name: _lang
      in: query
      x-mb-name: language
      description: The language of the names and labels.
      schema:
        default: it
        allOf:
          - $ref: "#/components/schemas/EasyStaffLanguage"

  schemas:
    EasyStaffLanguage:
      type: string
      enum: [it, en, es, de, fr]
      x-enum-varnames: [Italian, English, Spanish, German, French]
    EasyStaffDayOfWeek:
      type: string
      enum: ["1", "2", "3", "4", "5", "6", "7"]
      x-enum-varnames: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    EasyStaffBookingStatus:
      description: Whether a booked lesson or event takes place.
      type: string
      enum: ["0", "1"]
      x-enum-varnames: [Confirmed, Cancelled]
    EasyStaffScheduleCellType:
      type: string
      enum: [Lezione, chiusura_type]
      x-enum-varnames: [Lesson, Closure]
    EasyStaffExamType:
      type: string
      enum: [esame scritto, esame orale, esame scritto-orale]
      x-enum-varnames: [Written, Oral, OralAndWritten]
    EasyStaffAttendanceStatus:
      type: string
      enum: [frequentante, in_frequenza, non_frequentante]
      x-enum-varnames: [Attending, InProgress, NotAttending]
    EasyStaffCertificationResult:
      type: string
      enum: [ok, failure]
      x-enum-varnames: [Ok, Failure]
    EasyStaffRoomEquipment:
      description: Equipment of a room in the showcase, by its Italian name.
      type: string
      enum:
        - Attrezzature fisse
        - Attrezzature mobili
        - Cattedra
        - Finestre oscurabili
        - Gradoni
        - Impianto audio
        - Kit aule standard per videolezioni
        - Lavagna a fogli
        - Lavagna a pennarelli
        - Lavagna in ardesia
        - Lavagna luminosa
        - Lavagna saliscendi
        - Lettini
        - Monitor-Tv lcd-plasma
        - PC cattedra
        - Podio
        - Presa elettrica su postazione studente
        - Registrazione
        - Rete fissa
        - Rete wifi
        - Sedie Fisse con Banco
        - Sedie fisse con ribaltina
        - Sedie mobili con ribaltina
        - Sedie mobili senza ribaltina
        - Tavolo Accessibile (disabilità)
        - Telecamera
        - Video-Call conference
        - Videoproiettore soffitto+Telo
        - Webconference
      x-enum-varnames:
        - FixedEquipment
        - MobileEquipment
        - TeacherDesk
        - BlackoutWindows
        - TieredSeating
        - AudioSystem
        - StandardVideoLessonKit
        - FlipChart
        - Whiteboard
        - SlateBlackboard
        - OverheadProjector
        - SlidingBlackboard
        - ExaminationBeds
        - LcdPlasmaMonitor
        - TeacherPc
        - Podium
        - StudentPowerSocket
        - RecordingSystem
        - WiredNetwork
        - WifiNetwork
        - FixedChairsWithDesks
        - FixedChairsWithTabletArms
        - MobileChairsWithTabletArms
        - MobileChairsWithoutTabletArms
        - AccessibleTable
        - Camera
        - VideoConference
        - CeilingProjectorAndScreen
        - WebConference

