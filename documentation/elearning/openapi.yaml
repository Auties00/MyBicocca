openapi: 3.1.0
info:
  title: Moodle Web Services API
  description: REST API for the Moodle Mobile Application
  version: 5.1.0
  contact:
    name: Moodle
    url: https://moodle.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: '{protocol}://{host}/webservice/rest'
    description: Moodle Web Services REST endpoint
    variables:
      protocol:
        default: https
        enum:
          - https
          - http
        description: Protocol (HTTPS recommended)
      host:
        default: your-moodle-site.com
        description: Your Moodle site hostname
security:
  - wsToken: []
tags:
  - name: elearning
    description: Elearning functions
paths:
  /server.php:
    post:
      summary: Moodle Web Service Endpoint
      description: Single endpoint that handles all web service calls. The `wsfunction` parameter determines which operation to perform.
      tags:
        - elearning
      parameters:
        - name: moodlewsrestformat
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/WSFormat'
          description: Response format (always json for mobile app)
        - name: wstoken
          in: query
          required: true
          schema:
            type: string
          description: Web service authentication token
        - name: wsfunction
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/WSFunction'
          description: The web service function to call
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CoreAuthIsMinorPostRequest'
                - $ref: '#/components/schemas/CoreAuthRequestPasswordResetPostRequest'
