      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details
    RedirectResponse:
      type: object
      description: HTTP 302 redirect response
      properties:
        location:
          type: string
          format: uri
          description: Redirect URL
    HTMLResponse:
      type: string
      format: html
      description: HTML page content
    Indirizzo:
      type: object
      description: Address information
      properties:
        via:
          type: string
          description: Street address
        civico:
          type: string
          description: House number
        cap:
          type: string
          description: Postal code
        comune:
          type: string
          description: City
        provincia:
          type: string
          description: Province
        nazione:
