                  type: string
                  example: alautiero@gmail.com
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/fax:
                  type: string
                INTL_PREFIX_CELLULARE:
                  type: string
                  example: '+39'
                INTL_PREFIX_TXT_CELLULARE:
                  type: string
