openapi: 3.0.3
info:
  title: ESSE3 University Information System API
  description: HTML API for the University of Milano-Bicocca Online Student Information System
  version: 1.0.0
  contact:
    name: University of Milano-Bicocca
    url: https://www.unimib.it
servers:
  - url: https://s3w.si.unimib.it
    description: Production server
tags:
  - name: esse3_auth
    description: Authentication and session management
  - name: esse3_core
    description: Core system endpoints
  - name: esse3_addressbook
    description: Address book and personal data
  - name: esse3_calendar
    description: Calendar and appointments
  - name: esse3_degrees
    description: Degrees and qualifications
  - name: esse3_enrollment
    description: Enrollment management
  - name: esse3_admission
    description: Admission process
  - name: esse3_appelli
    description: Exam sessions and registration
  - name: esse3_carriera
    description: Academic career
  - name: esse3_certificati
    description: Certificates
  - name: esse3_tasse
    description: Fees and payments
  - name: esse3_tirocini
    description: Internships and placements
  - name: esse3_questionari
    description: Questionnaires and surveys
  - name: esse3_diritto_studio
    description: Student welfare and scholarships
  - name: esse3_student
    description: Student portal
  - name: esse3_checklist
    description: Process checklists
paths:
  /AddressBook/IndirizziSubmit.do:
    post:
      operationId: postIndirizzisubmit
      summary: Indirizzi Submit
      description: Endpoint for address book and personal data - IndirizziSubmit
      tags:
        - esse3_addressbook
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/naz_res_id:
                  type: string
                  example: '1_1'
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/p01_comu_comu_res_sigla:
                  type: string
                  example: MI
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/com_res_id:
                  type: string
                  example: '4745'
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/cap_res:
                  type: string
                  example: '20123'
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/fraz_res:
                  type: string
                  example: Milano
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/via_res:
                  type: string
                  example: Via San Sisto
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/num_civ_res:
                  type: string
                  example: '4'
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/tel_res:
                  type: string
                  example: '+393495089819'
                /WS/DataSet[@LocalEntityName='P01_ANAPER_ANAG_WEB']/Row[@Num='1']/dom_come_res_flg:
                  type: string
                  example: '1'
                form_id_formResDom:
                  type: string
                  example: formResDom
                procedi:
                  type: string
                  example: Avanti
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              description: Redirect URL
              schema:
                type: string
                format: uri
        '200':
          description: Successful operation
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
  /AddressBook/RecapitoSubmit.do:
    post:
      operationId: postRecapitosubmit
      summary: Recapito Submit
      description: Endpoint for address book and personal data - RecapitoSubmit
