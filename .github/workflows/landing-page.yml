name: Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'web/landing-page/**'
      - '.github/workflows/landing-page.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/landing-page/**'
      - '.github/workflows/landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-page-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/landing-page/package-lock.json

      - name: Install dependencies
        working-directory: web/landing-page
        run: npm ci

      - name: Type-check
        working-directory: web/landing-page
        run: npm run check

      - name: Build static site
        working-directory: web/landing-page
        run: npm run build

      - name: Verify Wrangler bundle
        working-directory: web/landing-page
        run: npx wrangler deploy --dry-run

      - name: Upload built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-dist
          path: web/landing-page/dist
          retention-days: 1

  deploy:
    name: Deploy to mybicocca.it
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mybicocca.it
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/landing-page/package-lock.json

      - name: Install dependencies
        working-directory: web/landing-page
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: landing-page-dist
          path: web/landing-page/dist

      - name: Deploy to Cloudflare Workers
        working-directory: web/landing-page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
