name: Codegen

on:
  push:
    branches: [main]
    paths:
      - 'common/**'
      - 'android/data-api/**'
      - 'ios/DataApi/**'
      - 'web/web-app/data-api/**'
      - 'web/web-app/package.json'
      - 'web/web-app/package-lock.json'
      - 'web/web-app/tsconfig.base.json'
      - '.github/workflows/codegen.yml'
  pull_request:
    branches: [main]
    paths:
      - 'common/**'
      - 'android/data-api/**'
      - 'ios/DataApi/**'
      - 'web/web-app/data-api/**'
      - 'web/web-app/package.json'
      - 'web/web-app/package-lock.json'
      - 'web/web-app/tsconfig.base.json'
      - '.github/workflows/codegen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codegen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: Generator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The android Gradle wrapper builds common/codegen too; its daemon is pinned to a
      # JetBrains JDK 21 (see android-ci.yml).
      - name: Set up the Gradle daemon JDK (JetBrains 21)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build and test the generator
        working-directory: common/codegen
        run: ../../android/gradlew build --stacktrace

      - name: Check that all generated SDKs are up to date
        working-directory: common/codegen
        run: ../../android/gradlew :cli:run --args="--check" --stacktrace

  kotlin:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the Gradle daemon JDK (JetBrains 21)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build and test the Kotlin SDK (live suites excluded)
        working-directory: android
        run: ./gradlew -p data-api test --stacktrace

  swift:
    name: iOS / iPadOS (Swift)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Also builds the generated live tests, which skip without LIVE_TESTS=1.
      - name: Build and test the Swift SDK
        working-directory: ios/DataApi
        run: swift test

  typescript:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/web-app/package-lock.json

      - name: Install dependencies
        working-directory: web/web-app
        run: npm ci

      # The generated SDK and its live tests, which need Vitest's and Node's types.
      - name: Type-check the TypeScript SDK and its live tests
        working-directory: web/web-app
        run: npx tsc -p data-api && npx tsc -p data-api/test
