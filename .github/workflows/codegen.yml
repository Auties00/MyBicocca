name: Codegen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'common/**'
      - 'android/data-api/**'
      - 'ios/DataApi/**'
      - 'web/**'
      - '.github/workflows/codegen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: Generator and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The android Gradle wrapper builds common/codegen too; its daemon is pinned to a
      # JetBrains JDK 21 (see android-ci.yml).
      - name: Set up the Gradle daemon JDK (JetBrains 21)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build and test the generator
        working-directory: common/codegen
        run: ../../android/gradlew build --stacktrace

      - name: Check that the generated code is up to date
        working-directory: common/codegen
        run: ../../android/gradlew :cli:run --args="--check" --stacktrace

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Type-check the web SDKs
        working-directory: web
        run: |
          npx --yes -p typescript@5.8.3 tsc -p packages/runtime
          npx --yes -p typescript@5.8.3 tsc -p packages/esse3
          npx --yes -p typescript@5.8.3 tsc -p packages/affluences
          npx --yes -p typescript@5.8.3 tsc -p packages/easystaff
          npx --yes -p typescript@5.8.3 tsc -p packages/easystaff-planning
          npx --yes -p typescript@5.8.3 tsc -p packages/moodle

  swift:
    name: Swift SDKs
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        working-directory: ios/DataApi
        run: swift test
