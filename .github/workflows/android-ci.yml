name: Android CI

on:
  push:
    branches: [main, optimize]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the compileSdk platform
        run: sdkmanager --channel=3 "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Raise Gradle heap for CI
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" >> "$HOME/.gradle/gradle.properties"

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: App unit tests (Wave 1 pure-JVM + Wave 2 Robolectric)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: data-api library tests (live suites excluded)
        working-directory: android
        run: ./gradlew -p data-api test --stacktrace

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/data-api/**/build/reports/tests/
            android/data-api/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  instrumented-ui-tests:
    name: Instrumented UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the compileSdk platform
        run: sdkmanager --channel=3 "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Raise Gradle heap for CI
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" >> "$HOME/.gradle/gradle.properties"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
