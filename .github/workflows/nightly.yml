name: Nightly Build

on:
  push:
    branches: [main, feature/nightly-updates]
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            cat << 'EOF' >> $GITHUB_ENV
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          fi

      - name: Build nightly APK
        run: ./gradlew assembleNightly

      - name: Generate Changelog
        id: changelog
        run: |
          git fetch --prune --unshallow --tags || true
          LATEST_TAG=$(git tag --sort=-creatordate | grep -v '^nightly$' | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            LOG=$(git log -n 20 --pretty=format:"- %s")
          else
            LOG=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "commit: ${{ github.sha }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### Changes since last stable release" >> $GITHUB_ENV
          echo "$LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Delete old nightly release and tag
        run: |
          gh release delete nightly --cleanup-tag -y || true
          git push --delete origin nightly || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   nightly
          name:       "Nightly Build"
          prerelease: true
          body:       ${{ env.RELEASE_BODY }}
          files:      android/app/build/outputs/apk/nightly/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}