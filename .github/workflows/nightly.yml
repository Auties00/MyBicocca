name: Nightly Build

on:
  push:
    # Main only: N counts commits along whichever branch is built, so a second branch would hand
    # out numbers that collide with main's or outrank them.
    branches: [main]
    # Only pushes that can change the APK. Docs, screenshots, CI config and the iOS/web/codegen
    # trees don't ship in it, so they wait for the next app change (whose changelog still lists
    # them, since it covers everything since the last stable release).
    paths:
      - 'android/**'
      - '!android/**/*.md'
  workflow_dispatch:

# One nightly at a time. Queued rather than cancelled: a run cut off mid-upload would leave a
# release with only some of its APKs, while a queued one just publishes after it — and GitHub keeps
# only the newest pending run, so a burst of pushes still ends on the latest commit.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Opt-out for app changes that still shouldn't publish a nightly: a "no-nightly" label on the
  # merged PR, or "[no nightly]" in the pushed commit's message. Manual runs always build.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$MESSAGE" == *"[no nightly]"* ]]; then
            echo "The commit message asks for no nightly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR whose merge (merge commit, squash or rebase) produced this commit, if any. A
          # failed lookup builds anyway: skipping by mistake is worse than an extra nightly.
          if ! LABELS=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
              --jq ".[] | select(.merge_commit_sha == \"$GITHUB_SHA\") | .labels[].name"); then
            echo "::warning::Couldn't look up the PR of $GITHUB_SHA, building the nightly anyway."
            LABELS=""
          fi
          if grep -qx 'no-nightly' <<< "$LABELS"; then
            echo "The merged PR is labelled no-nightly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      # Full history and tags: the nightly's number counts commits since the last stable tag, and
      # its changelog lists every change since that release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JetBrains, not Temurin: gradle/gradle-daemon-jvm.properties pins the Gradle daemon to a
      # JetBrains JDK 21, and the download links pinned there no longer resolve.
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
          cache: gradle

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Debug Keystore Aliases
        run: |
          if [ -f "release.keystore" ]; then
            echo "Listing aliases in the keystore (password will be automatically masked by GitHub if printed):"
            keytool -list -v -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "Alias name:" || echo "Failed to read keystore (wrong password?)"
          fi

      # The tag and the version baked into the APK both come from Gradle, so they can't disagree.
      - name: Resolve nightly version
        id: version
        run: |
          # The default shell has no pipefail, and without it a failing Gradle would read as an
          # empty version and skip quietly as though no tag existed.
          set -o pipefail
          VERSION=$(./gradlew -q printNightlyVersion | tail -n 1)
          echo "Nightly version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ ! "$VERSION" =~ -nightly\.[0-9]+$ ]]; then
            echo "::warning::No stable tag matches the current baseVersion, so this nightly can't be numbered. Skipping it; nightlies resume once the release is tagged."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A re-run of this commit republishes its own release; the same number on another commit
          # would mean main's history was rewritten, and publishing over it would mislabel the APKs.
          if EXISTING=$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}"); then
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $VERSION already exists on $EXISTING, not on $GITHUB_SHA."
              exit 1
            fi
          fi

      - name: Build nightly APK
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew assembleNightly

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        run: |
          # Everything since the last stable release, not just since the previous nightly: only
          # the newest nightly stays published, so its notes are the only ones anyone reads, and
          # they have to cover all that a nightly user is getting ahead of stable.
          PREVIOUS=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          # "commit:" is read back by the app to identify the build exactly.
          {
            echo "commit: $GITHUB_SHA"
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "### Changes since $PREVIOUS"
              git log "$PREVIOUS..HEAD" --pretty=format:'- %s' --no-merges
            else
              echo "### Recent changes"
              git log -n 20 --pretty=format:'- %s' --no-merges
            fi
            echo
          } > "$RUNNER_TEMP/nightly-notes.md"
          cat "$RUNNER_TEMP/nightly-notes.md"

      # Each nightly is its own pre-release, tagged on the exact commit it was built from. Never
      # "latest": that stays the newest stable release, which is what stable installs check.
      - name: Publish nightly release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name:             "Nightly ${{ steps.version.outputs.version }}"
          prerelease:       true
          make_latest:      false
          body_path:        ${{ runner.temp }}/nightly-notes.md
          files:            android/app/build/outputs/apk/nightly/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the Releases page down to one nightly. The newest stays published; the next nine,
      # by version (the order the app picks from), are turned into drafts: hidden from the public
      # page and from the app, which only sees published releases, but still there for anyone with
      # write access to roll back to. Older ones, and every nightly a stable release has overtaken
      # (0.0.6-nightly.* once 0.0.6 ships), are deleted along with their tags.
      - name: Tidy old nightlies
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: 10
        run: |
          set -o pipefail
          LATEST_STABLE=$(git tag --sort=-v:refname | { grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)
          LATEST_STABLE=${LATEST_STABLE#v}

          # True when the nightly's version core is at or below the latest stable release.
          superseded() {
            local core="${1#v}"
            core="${core%%-*}"
            [ -n "$LATEST_STABLE" ] && [ "$(printf '%s\n%s\n' "$core" "$LATEST_STABLE" | sort -V | tail -n 1)" = "$LATEST_STABLE" ]
          }

          gh release list --limit 200 --json tagName,isPrerelease,isDraft \
              --jq '.[] | select(.isPrerelease) | "\(.tagName) \(.isDraft)"' \
            | { grep -E -- '-nightly\.[0-9]+ (true|false)$' || true; } \
            | sort -V -r \
            | {
                position=0
                while read -r tag is_draft; do
                  if superseded "$tag"; then
                    echo "Deleting $tag (overtaken by $LATEST_STABLE)"
                    gh release delete "$tag" --cleanup-tag --yes
                    continue
                  fi
                  position=$((position + 1))
                  if [ "$position" -eq 1 ]; then
                    continue
                  elif [ "$position" -le "$KEEP" ]; then
                    if [ "$is_draft" = "false" ]; then
                      echo "Hiding $tag (now a draft)"
                      gh release edit "$tag" --draft=true
                    fi
                  else
                    echo "Deleting $tag (older than the newest $KEEP)"
                    gh release delete "$tag" --cleanup-tag --yes
                  fi
                done
              }
