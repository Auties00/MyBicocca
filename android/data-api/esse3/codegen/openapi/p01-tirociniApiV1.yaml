  /tirocini/azienda/{aziendaId}/convenzioni:
    get:
      tags:
      - "lista delle convenzioni disponibili per una data azienda"
      summary: "recupera la lista delle convenzioni per una data azienda"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Restituisce un oggetto  `DatiConvenzioniAzienda`\
        \ completo di tutte le informazioni sulla convenzione ricercata\n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza media, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n"
      operationId: "getConvenzioniAzienda"
      parameters:
      - name: "sdrCnvzDes"
        in: "query"
        description: "Descrizione della convenzione."
        required: false
        type: "string"
      - name: "aziendaId"
        in: "path"
        description: "Identificativo dell'azienda"
        required: true
        type: "integer"
        format: "int64"
      - name: "statoCnvzCod"
        in: "query"
        description: "codice dello stato della convenzione ('P-Proposta', 'I-istituita',\
          \ 'X-Cessata', 'R-Rifiutata')."
        required: false
        type: "string"
        enum:
        - "P"
        - "I"
        - "X"
        - "R"
      - name: "dataInizio"
        in: "query"
        description: "Data di inizio convenzione (dd/mm/yyyy)."
        required: false
        type: "string"
        maxLength: 10
        minLength: 10
      - name: "dataFine"
        in: "query"
        description: "Data di fine convenzione. E' possibile inserire anche l'ora\
          \ (dd/mm/yyyy hh:mm:ss)."
        required: false
        type: "string"
        maxLength: 19
        minLength: 10
      - name: "durataAnni"
        in: "query"
        description: "Durata in anni della convenzione"
        required: false
        type: "integer"
        format: "int32"
      - name: "aaId"
        in: "query"
        description: "Anno accademico di validità della convenzione."
        required: false
        type: "integer"
        format: "int32"
      - name: "defaultFlg"
        in: "query"
        description: "Dice se è la convenzione di default per una certa azienda (ente_est).\
          \ Utilizzata per gestire le convenzioni fittizie legate a opportunità per\
          \ le quali non serve la convenzione e per gestire i PF associati a convenzioni\
          \ uninominali."
        required: false
        type: "integer"
        format: "int32"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/DatiConvenzioniAzienda"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
