    get:
      tags:
      - "check che uno studente sia eligibile per il tipo di stage passato"
      summary: "Effettua il controllo che uno studente sia eligibile per il tipo di\
        \ stage passato tramite matricola, codice fiscale ed altri parametri"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Restituisce un oggetto  `DatiEligibilitaStageStu`\
        \ che riporta l'esito dell'operazione di controllo.\n* I codici di errore\
        \ ritornati dalla funzione richiamata sono i seguenti\n  * 100 Servizio non\
        \ abilitato;\n  * 101 Servizio non abilitato - irregolarità pagamento tasse;\n\
        \  * 104 Servizio non abilitato - la data inizio non può cadere dopo i 12\
        \ mesi dalla laurea;\n  * 105 Servizio non abilitato - la data inizio tirocinio\
        \ è antecedente alla data di laurea;\n  * 106 Servizio non abilitato - lo\
        \ studente non soddisfa requisiti configurati dall''ateneo;\n  * 107 Servizio\
        \ non abilitato - lo studente non è laureato;\n  * 108 Servizio non abilitato\
        \ - lo studente non ha una carriera attiva;\n  * -101 Data inizio non definita.\
        \ Il dato è obbligatorio per i tirocini extracurriculari;\n  * -103 Matricola\
        \ non corrispondente al codice fiscale;\n  * -106 Studente laureato, ma la\
        \ data chiusura di carriera non è registrata;\n  * -107 Servizio non abilitato\
        \ - la data inizio tirocinio non ha un formato corretto;\n  * -200 Errore\
        \ generico del servizio.\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
