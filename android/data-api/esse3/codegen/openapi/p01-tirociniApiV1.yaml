---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso ai servizi rest dell'area Tirocini\
    \ e Stages\n"
  version: "1.1.0"
  title: "ESSE3 Tirocini e Stages API"
basePath: "/tirocini-service-v1"
tags:
- name: "matricola"
  description: "informazioni sui tratti di carriera"
- name: "tirocinino"
  description: "informazioni sul tirocinio"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /tirocini:
    get:
      tags:
      - "matricola"
      summary: "matricole per cui è possibile avere una domanda di tirocinio"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti `TrattoCarriera`\
        \ nei quali è possibile avere una domanda di tirocinio \n E' necessario valorizzare\
        \ almeno un filtro tra quelli presenti per poter effettuare il recupero dati\n\
        \n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|midRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza media, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-student-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        STUDENTE|funzione accessibile alle utenze di tipo STUDENTE|Security.checkStudente()\n\
        \n**Utente: user-tecnico-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        UTENTE_TECNICO|funzione accessibile alle utenze tecniche per accessi ai servizi\
        \ REST|Security.checkUserTecnico()\n\n\nClasse di modello : TrattoCarriera\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        aaImm1|optional\ntipoCorsoCod|optional\ntipoCorsoDes|optional\ndrCarr|optional\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getTrattiCarriera"
      parameters:
      - name: "matricola"
        in: "query"
        description: "codice della matricola dello studente"
        required: false
        type: "string"
      - name: "cdsStuId"
        in: "query"
        description: "id del corso di studio di appartenenza dello studente"
        required: false
        type: "integer"
        format: "int64"
      - name: "cdsStuCod"
        in: "query"
        description: "codice del corso di studio di appartenenza dello studente"
        required: false
        type: "string"
      - name: "aaOrdStuId"
        in: "query"
        description: "anno di ordinamento del regolamento del piano"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "pdsStuId"
        in: "query"
        description: "id del percorso di studio di appartenenza dello studente"
        required: false
        type: "integer"
        format: "int64"
      - name: "pdsStuCod"
        in: "query"
        description: "codice del percorso di studio di appartenenza dello studente"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/TrattoCarriera"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      - common-student-permissions:
          kind: "STUDENTE"
          profiles:
          - profile:
              name: "STUDENTE"
              description: "funzione accessibile alle utenze di tipo STUDENTE"
              checks:
              - checkMatId:
                  className: "Security"
                  functionName: "checkStudente"
                  description: "controlla che l'utente sia uno studente"
      x-cache-type: "midRefreshRateUserDependent"
  /tirocini/azienda:
