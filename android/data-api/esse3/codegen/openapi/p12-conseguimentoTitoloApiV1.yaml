  /domandeCt:
    post:
      tags:
      - "domanda di laurea"
      summary: "effettua l'inserimento della domanda di laurea in base ai dati inseriti\
        \ nelle varie azioni del processo"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di inserire di inserire la domanda\
        \ di laurea e la tesi relativa\n\n##### Parametri in ingresso\nCampo     \
        \    | Campi obbligatori                 | Note \n-             | -      \
        \                           | - \nstudente      |  stu_id                \
        \           | id dello studente\nappello       |  app_ct_id              \
        \          | id appello di laurea, può essere recuperato dalla GET appelliCT\n\
        sessione      |  ses_ct_id                        | id della sessione di laurea\
        \ può essere recuperato dalla GET appelliCT\nanno domanda  |  aa_id      \
        \                      | id che identifica anno di ultima iscrizione studente\n\
        \n\n##### Codici di ritorno della funzione\nCodice di Ritorno | Descrizione\n\
        -                 | -\n  1  |  OK\n -1  |  L'oggetto strDomCTitRest che contiene\
        \ tutti i dati necessari per l'elaborazione è nullo\n -2  |  L'oggetto strPreDomCt\
        \ che contiene i dati della domanda è nullo\n -3  |  L'oggetto strPreTesi\
        \ che contiene i dati della tesi è nullo\n -4  |  L'oggetto strPreRelTesi\
        \ che contiene i dati dei relatori di tesi è nullo\n -5  |  L'identificativo\
        \ dello studente è nullo\n -6  |  L'identificativo dell'anno è nullo\n -7\
        \  |  L'identificativo dello studente presente nella domanda non coincide\
        \ con quello presente nella tesi\n -8  |  L'oggetto strPreRelTesi che contiene\
        \ i dati dei relatori di tesi non ha elementi\n -9  |  Nell'oggetto strPreRelTesi\
        \ che contiene i dati dei relatori di tesi la tipologia di relatore non è\
        \ definita\n-10  |  Nell'oggetto strPreRelTesi che contiene i dati dei relatori\
        \ di tesi non è definito nè il docente nè il soggetto esterno\n-11  |  Nell'oggetto\
        \ strPreRelTesi che contiene i dati dei relatori di tesi nessun dato è accettabile\n\
        -12  |  Errore in fase di popolamento della tabella P12_PRE_DOM_CT a partire\
        \ dalla struttura strPreDomCt\n-13  |  Errore in fase di popolamento della\
        \ tabella P12_PRE_TESI a partire dalla struttura strPreTesi\n-14  |  Errore\
        \ in fase di popolamento della tabella P12_PRE_REL_TESI a partire dalla struttura\
        \ strPreRelTesi\n-15  |  Errore in fase di registrazione completa della domanda\
        \ conseguimento titolo e tesi  |  parametri obbligatori non valorizzati\n\
        -16  |  Errore in fase di registrazione completa della domanda conseguimento\
        \ titolo e tesi  |  tesi non trovata\n-17  |  Errore generico in fase di registrazione\
        \ completa della domanda conseguimento titolo e tesi\n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|noCache|Nessuna cache\
        \ impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|funzione\
        \ accessibile alle utenze di tipo STUDENTE|Security.checkStudente()\n\n\n\
        Classe di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
