---
swagger: "2.0"
info:
  description: "i servizi presenti permettono di recuperare informazioni sul processo\
    \ di conseguimeno titolo del sistema Esse3, tra cui\n- le date degli appelli di\
    \ laurea e le informazioni relative,    \n- l'elenco dei docenti che è possibile\
    \ selezionare come relatore di Tesi \n- l'elenco dei soggetti esterni che è possibile\
    \ selezionare come relatore di Tesi \n- il riepilogo di tutti i dati inseriti\
    \ e le opzioni scelte in fase di presentazione della domanda conseguimento titolo\n\
    - le tipologie di tesi configurate in base alle regole di conseguimento titolo\
    \ relative allo studente\n- i dati della tesi di laurea e le informazioni relative\
    \ ad appello, seduta  \n\n## ChangeLog\n\nVersione       | Versione di Esse3 di\
    \ rilascio | Interventi \n-              | -                             | -\n\
    \    1.0.0      | 18.01.02.00                   | creazione\n    1.1.0      |\
    \ 18.03.00.00                   | aggiunto path infoProc e parameter stuId\n \
    \   1.2.0      | 19.08.03.00                   | aggiunto path /domandeCt/annullaDomandaCt/\n\
    \n  \n"
  version: "1.2.0"
  title: "ESSE3 Conseguimento titolo API"
basePath: "/consTit-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
