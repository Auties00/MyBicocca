        /><img src=\"jwt.png\"/></span>consente di effettuare l'inserimento dei metadati\
        \ di un nuovo allegato di tesi, sulla risposta è presente l'header location\
        \ che consente di effettuare l'upload del blob collegato ai metadati\n   \
        \      tramite uploadId. Se la tesi ancora non è stata inserita è possibile\
        \ aggiungerla tramire l'API /domandeCt/tesi.\n\nEsempio di body:\n\n'{\n \
        \  \"chiaviCollegamento\":[\n      {\n         \"nome\":\"tesiId\",\n    \
        \     \"valore\":86084\n      }\n   ],\n   \"proprietaAggiuntive\":[\n   \
        \   {\n         \"nome\":\"def_flg\",\n         \"valNum\":1\n      },\n \
        \     {\n         \"nome\":\"stato_all_tesi_cod\",\n         \"valAlfa\":\"\
        A\"\n      },\n      {\n         \"nome\":\"motivazione\",\n         \"valAlfa\"\
        :\"test motivazione\"\n      },\n      {\n         \"nome\":\"data_app_rif\"\
        ,\n         \"valDate\":\"01/01/2023 20:51:20\"\n      }\n   ],\n   \"filename\"\
        :\"readme.txt\",\n   \"autore\":\"mario rossi\",\n   \"titolo\":\"tesi di\
        \ laurea\",\n   \"descrizione\":\"descrizione libera\",\n   \"tipologiaAllegato\"\
        :\"TESI\"\n}'\n         \n         \n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
