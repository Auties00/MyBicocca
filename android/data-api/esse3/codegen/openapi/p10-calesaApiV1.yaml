    put:
      tags:
      - "appello"
      summary: "aggiorna le informazioni di un appello"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di modificare un appello, nel caso\
        \ il campo della struttura in ingresso non sia impostato a null \noppure non\
        \ sia passato non verrà passato in ingresso, per poter impostare a null in\
        \ campi vanno passati dei valori speciali\ndefiniti nella seguente lista\n\
        \n* Stringhe : #!N!#\n* Numerici : -1\n* Date : 01/01/1970\n\n##### Codici\
        \ di ritorno della funzione\nCodice di Ritorno | Descrizione\n-          \
        \       | -\n-2 | Errore nel recupero del turno\n-1 | La chiamata è di tipo\
        \ WEB e il session_id non si riferisce ad un docente\n1  | Esecuzione Corretta\n\
        2  | Appello non presente\n3  | Esistono sessioni non più valide con studenti\
        \ iscritti, oppure si è verificato un errore nell''inserimento delle nuove\
        \ sessioni\n4  | La data inizio iscrizioni non è valida, in quanto deve essere\
        \ precedente alla data fine iscrizioni\n5  | La data fine iscrizioni non è\
        \ valida, in quanto deve essere compresa fra la data inizio iscrizioni e la\
        \ data inizio appello\n6  | La data inizio appello non è valida in quanto\
        \ è precedente alla data fine iscrizioni\n7  | La data fine appello non è\
        \ valida in quanto non è successiva alla data inizio appello\n8  | La data\
        \ di inizio appello non ricade in nessuna sessione\n9  | Errore nel controllo\
        \ di sovrapposizione delle date\n10 | Non è stato valorizzata la chiave del\
        \ turno e sono richieste delle modifiche allo stesso\n11 | Errore nell'invio\
        \ della comunicazione\n12 | Le date dei turni non sono precedenti rispetto\
        \ alla data di fine appello\n13 | Errore nell'aggiornamento della tipi_gest_app\n\
        14 | Errore nell'aggiornamento del tipo_app_cod\n15 | Valore modificato non\
        \ modificabile\n16 | Il tipo_esame UD è utilizzabile se e solo se viene associato\
        \ un modulo all'appello.\n17 | Non è possibile modificare il modulo associato\
        \ all''appello se ci sono degli studenti iscritti\n18 | I valori tipo iscrizione\
        \ e tipo esame devono essere coerentemente valorizzati\n19 | Alcune sessioni\
        \ passate in ingresso non sono coerenti con le caratteristiche dell''appello\n\
        20 | Le sessioni passate in ingresso non sono compatibili con l'appello\n\
        21 | Mancano i dati obbligatori per inserire il turno\n22 | Il turno non è\
        \ cancellabile perchè sono presenti degli studenti iscritti\n23 | Il turno\
        \ non è cancellabile perchè è il turno di default generato dal sistema\n24\
        \ | Il turno non è cancellabile perchè è l'ultimo turno dell'appello\n25 |\
        \ Esistono delle date di superamento esame di alcuni studenti iscritti all'appello\
        \ precedenti alla data dell'appello\n26 | La scala di voti non risulta compatibile\
        \ con l'appello: per ulteriori dettagli sulle scale di voti compatibili consultare\
        \ la documentazione su kiondocs.\n27 | Non è possibile modificare la scala\
        \ di voti associata all'appello se ci sono degli studenti iscritti\n28 | Non\
        \ è possibile modificare la scala di voti associata all'appello se ci sono\
        \ degli studenti iscritti\n29 | Non è possibile caricare la commissione da\
        \ associare all'appello\n30 | Non è possibile caricare l'index da associare\
        \ all'appello\n31 | Non è possibile modificare il gruppo appello se ci sono\
        \ degli studenti iscritti\n32 | Si sta tentando di inserire un'aula disabilitata\n\
        33 | La modifica al turno non è compatibile con le sessioni dell'appello\n\
        34 | I valori delle commissioni non sono coerenti (non sono valorizzati i\
        \ campi docente_id,ruolo_cod)\n35 | I valori delle commissioni non sono coerenti\
        \ (è presente una commissione del turno ma non è valorizzato il campo pi_app_log_id)\n\
        36 | I valori delle commissioni non sono coerenti (non è possibile impostare\
        \ sul campo ordine_vis_num il valore pkg10.number_null_value)\n37 | La commissione\
        \ può avere al massimo un solo presidente\n38 | La commissione deve avere\
        \ almento un presidente\n39 | Il numero di ordine di visualizzazione dei docente\
        \ non deve avere valori duplicati\n40 | Se esiste un solo turno non è possibile\
        \ modificare la commissione del turno\n41 | Esistono dei docenti nelle commissioni\
        \ dei turni che non sono presenti nella commissione dell'appello\n42 | Non\
        \ è possibile aggiungere turni ad un appello il cui tipo_def_app prevede la\
        \ sincronizzazione con il sistema di logisitica esterno\n43 | Errore passaggio\
        \ parametri sulle associazioni degli appelli\n44 | Errore inserimento/modifica/cancellazione\
        \ associazioni degli appelli\n45 | Codice errore non gestito nelle associazioni\
        \ degli appelli\n\n##### Note\n\nL'oggetto con le modifiche da effettuare\
        \ contiene le SOLE modifiche da apportare, quindi se un campo non è valorizzato\
        \ oppure omesso viene considerato come NON modificato e non viene toccato\
        \ dalla procedura.\n\nPer poter annullare un campo (impostare il valore a\
        \ null) occorre passare dei placedholder speciali che dipendono dal tipo di\
        \ dato del campo \n\n* _NUMERICI_: -1\n* _STRINGHE_: #!N!#\n* _DATE_: 01/01/1970\n\
        \nCi sono particolari campi che hanno delle differenti gestioni\n\n1. il campo\
        \ appLogId indica il tipo di operazione da effettuare  \n  * app_log_id >\
        \ 0    => modifica turno\n  * app_log_id = NULL => inserimento turno (obbligatori,\
        \ data_esa,ora_esa,fat_part_cod,dom_part_cod)\n  * app_log_id < 0    => viene\
        \ cancellato il turno che ha il valore assoluto dell'app_log_id passato in\
        \ ingresso  \n2. sessioni: Se nullo le sessioni sono ricalcolate dal sistema\n\
        3. links: per poter effettuare le modifiche agli appelli collegati è necessario\
        \ indicare una delle due chiavi (templvotoId oppure cdsId,adId,appId), la\
        \ chiave, come per app_log_id va valorizzata con valori positivi per indicare\
        \ inserimenti/modifiche e con valori negativi (con il modulo uguale all'id\
        \ da cancellare) per le cancellazioni\n\n**NB**: le modifiche di dataInizioApp\
        \ sono fatte attraverso dataEesa e oraEsa dei turni\n            \n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza media, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|Visualizza\
        \ gli appelli per i quali il docente ha l'abilitazione sulla coppia AD/CDS\
        \ e (a seconda delle configurazioni) si trova in commissione|SecurityCalesa.checkAppDoc(cdsId,\
        \ adId, appId)\n\n\nClasse di modello : Appello\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nconfig|optional\ndatacalId|optional\n\
        capostipiteId|optional\ncommPianId|optional\nindexId|optional\nperiodoId|optional\n\
        appId|primaryKey\nnoteSistLog|optional\ntagTemplId|optional\nsedeId|optional\n\
        gruppoVotoId|optional\nadId|primaryKey\ncdsId|primaryKey\n\n\nClasse di modello\
        \ : TestataTipoGestApp\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\ntipoGestAppCod|primaryKey\n\n\nClasse di modello :\
        \ TestataTipoGestPren\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\ntipoGestPrenCod|primaryKey\n\n\nClasse di modello\
        \ : AppelloPrenConfigDett\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\nkey|primaryKey\nvalue|primaryKey\n\n\nClasse di modello\
        \ : AppelloTgaConfigDett\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\nkey|primaryKey\nvalue|primaryKey\n\n\nClasse di modello\
        \ : TurnoAppello\n======\n\nEstensioni sulle proprietà\n----\nProprietà |\
        \ x-field-type\n-|-|\nextAulaCod|optional\nappLogId|primaryKey\nappId|primaryKey\n\
        adId|primaryKey\ncdsId|primaryKey\n\n\nClasse di modello : DocenteCommissioneTurno\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        docenteId|primaryKey\nappId|primaryKey\nadId|primaryKey\ncdsId|primaryKey\n\
        appLogId|primaryKey\n\n\nClasse di modello : DocenteCommissioneAppello\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\ndocenteId|primaryKey\n\
        appId|primaryKey\nadId|primaryKey\ncdsId|primaryKey\n\n\nClasse di modello\
        \ : SessioneAppello\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\nsesId|primaryKey\naaSesId|primaryKey\nappId|primaryKey\n\
        adId|primaryKey\ncdsId|primaryKey\n\n\nClasse di modello : DocenteCommissioneAppello\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        docenteId|primaryKey\nappId|primaryKey\nadId|primaryKey\ncdsId|primaryKey\n\
        \n\nClasse di modello : EsameComuneAppello\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\nadId|primaryKey\n\
        aaOffId|primaryKey\ncdsFiglioId|primaryKey\nadFiglioId|primaryKey\nappId|primaryKey\n\
        \n\nClasse di modello : EsameComuneGen\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\nadId|primaryKey\n\
        aaOffId|primaryKey\ncdsFiglioId|primaryKey\nadFiglioId|primaryKey\n\n\nClasse\
        \ di modello : LinkAppello\n======\n\nEstensioni sulle proprietà\n----\nProprietà\
        \ | x-field-type\n-|-|\nappId|primaryKey\nadId|primaryKey\ncdsId|primaryKey\n\
        templvotoId|primaryKey\n\n\nClasse di modello : TipoSvolgimentoEsame\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\n\
        adId|primaryKey\nappId|primaryKey\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n\n\nClasse di modello : AggiornamentoAppello\n======\n\n\
        Estensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nappId|primaryKey\n\
        noteSistLog|optional\ntagTemplId|optional\nsedeId|optional\ngruppoVotoId|optional\n\
        adId|primaryKey\ncdsId|primaryKey\n\n\nClasse di modello : AggiornamentoDocenteCommissione\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        docenteId|primaryKey\n\n\nClasse di modello : InserimentoAggiornamentoSessione\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        aaSesId|primaryKey\nsesId|primaryKey\n\n\nClasse di modello : AggiornamentoTurno\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        appLogId|primaryKey\n\n\nClasse di modello : AggiornamentoDocenteCommissione\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        docenteId|primaryKey\n"
      operationId: "putAppello"
      parameters:
      - name: "cdsId"
        in: "path"
        description: "id del corso di studio di erogazione dell'appello"
        required: true
        type: "integer"
        format: "int64"
      - name: "adId"
        in: "path"
        description: "id dell' attività didattica di erogazione dell'appello"
        required: true
        type: "integer"
        format: "int64"
      - name: "appId"
        in: "path"
        description: "progressivo dell'appello all'interno della coppa CDS/AD di definizione;\
          \ è parte della chiave (cds_id,ad_id,app_id)"
        required: true
        type: "integer"
        format: "int64"
      - name: "attoreCodTipoSvolgEsame"
        in: "query"
        description: "tipo di attore richiesto per l'estrazione dati (STU,DOC,SEG),\
          \ utilizzato per filtrare le tipologie di svolgimento esame possibili per\
          \ l'appello. Se null, viene impostata la configurazione dell'attore corrente"
        required: false
        type: "string"
        pattern: "STU|DOC|SEG"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
