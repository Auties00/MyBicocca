  /prenotazioni/{matId}/{applistaId}/presaVisione:
    put:
      tags:
      - "prenotazione"
      summary: "effettua la presa visione dell'esito pubblicato"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Permette la modifica dello stato di presa visione\
        \ dell'esito\n\nE' possibile utilizzare la presa visione con prenotazioni\
        \ collegate valorizzando i parametri appRelOpType, cdsRelOpType, adRelOpType,\
        \ appRelOpType\n\nappRelOpType tipo di operazione pevista per la gestione\
        \ della prenotazione automatica collegata\n\nValore     | Stato PresaVisione\
        \ | Operazione                         | Chiave appello   \n-          | -\
        \                  | -                                  | - \nINSERT     |\
        \ qualsiasi          | Inserimento prenotazione collegata | chiave appello\
        \ dove effettuare la prentotazione\nDELETE     | != R               | Cancellazione\
        \ prenotazione collegata | chiave appello dove rimuovere la prenotazione\n\
        UPDATE     | R                  | Aggiornamento prenotazione collegata | chiave\
        \ appello dove inserire la prenotazione \nDELETE_ALL | != R              \
        \ | Inserimento prenotazione collegata | Non prevista\n\ni campi cdsRelAppId,\
        \ adRelAppId e appRelId si riferiscono alla chiave appello richiesta a seconda\
        \ della prenotazione\nNel caso non sia prevista una prenotazione automatica\
        \ lasciare i 4 campi nulli\n\n##### Codici di ritorno della funzione\nCodice\
        \ di Ritorno | Descrizione\n-                 | -\n1                 | Pubblicazione\
        \ riuscita\n2                 | La data di pubblicazione differisce dalla\
        \ data odierna\n17                | l'appello collegato su cui effettuare\
        \ la prenotazione non risulta valido \n18                | prenotazione collegata\
        \ non è stata trovata\n19                | errore nell'inserimento della prenotazione\
        \ collegata\n20                | errore nella cancellazione della prenotazione\
        \ collegata\n21                | si sta tentando di cancellare la prenotazione\
        \ collegata ad un appello differente rispetto a quello in ingresso\n22   \
        \             | si sta tentando di modificare la prenotazione collegata allo\
        \ stesso appello di quello passato ingresso\n23                | errore inserimento\
        \ link tra le prenotazioni, link già presente\n24                | errore\
        \ cancellazione link tra le prenotazioni\n50                | Errore generico\n\
        -51               | errore nel recupero della prenotazione\n-52          \
        \     | prenotazione non trovata\n-55               | condizioni per il salvataggio\
        \ non rispettate\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|Permette\
        \ la visualizzazone delle informazioni del tratto della carriea dello studente|Security.checkMatId(matId)\n\
