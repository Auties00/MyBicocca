  /sistLogExt/update/:
    put:
      tags:
      - "sistema logistico esterno"
      summary: "effettua l'aggiornamento"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>effettua l'aggiornamento dei turni già caricati\
        \ dal sistema esterno di logisitica, la procedura richiama la fuzione \ndi\
        \ aggiornamento appello i cui codici di errore sono descritti nel metodo `/appelli/{cdsId}/{adId}/{appId}`\n\
        consultare i codici di errore di quell'endpoint per la legenda degli errori\
        \ possibili.\n\nNB: A quei codici si aggiungono i codici specifici per il\
        \ controllo della chiave di collegamento tra l'ìmpegno e il turno (impegnoId)\n\
        nel caso questa non sia presente nella base dati di esse3 \n\n ##### Codici\
        \ di ritorno della funzione\nCodice di Ritorno | Descrizione\n-          \
        \       | -\n-99               | Errore generico\n-98               | ImpegnoId\
        \ non trovato non è possibile collegare l'impegno ad un turno di esse3\n-97\
        \               | Il codice dell'aula non è stato trovato su esse3\n-96  \
        \             | Sono stati trovati studenti iscritti al turno\n-95       \
        \        | Il codice impegno che si sta tentando di inserire è già presente\n\
        -94               | Il codice impegno non è presente\n-93               |\
        \ I dati non sono congruenti\n-92               | I campi domParCod e FatPartCod\
        \ devono essere entrambi valorizzati\n-91               | i campi fatPartCod\
        \ e domPartCod hanno dei valori non accettabili\n\nNel body della richiesta\
        \ è necessario passare l'insieme di oggetti `UpdateImpegniSistLog' con gli\
        \ impegni da modificare\nI campi necessari sono indicati nella classe di modello.\n\
        Oltre a questo viene richiesto il flag invioCom per indicare se deve essere\
        \ inviata una comunicazione agli studenti con i dati del cambio turno\ni possibili\
        \ valori sono i seguenti\n\n* 0: nono inviare la comunicazione\n* 1: inviare\
        \ la comunicazione (se configurata)\n* -1: nel caso di presenza di studenti\
        \ bloccare l'aggiornamento\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "updateImpegno"
      consumes:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Oggetto con gli impegni da importare"
