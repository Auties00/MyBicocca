      tags:
      - "appello"
      summary: "cancella un appello"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di cancellare un appello\n\n#####\
        \ Codici di ritorno della funzione\nCodice di Ritorno | Descrizione\n-   \
        \              | -\n2  | Nessuna riga cancellata\n1  | Esecuzione corretta\n\
        -1 | Errore nella valorizzazione dei parametri di lancio\n-2 | Impossibile\
        \ cancellare l''appello: sono presenti studenti in lista iscritti\n-3 | Impossibile\
        \ cancellare l''appello: sono presenti degli esiti per gli studenti iscritti\n\
        -4 | Impossibile cancellare l''appello: le informazioni sono state inviate\
        \ al sistema di logistica esterna\n-5 | Errore nella cancellazione dell'appello\n\
        -6 | Errore nella rimozione delle prenotazioni\n-7 | Impossibile cancellare\
        \ l''appello: sono presenti dei log di prenotazioni non cancellabili\n\n\n\
        ##### Note \n1. la forzatura per la cancellazione può assumere i seguenti\
        \ valori  \n  * 0 => Nessuna forzatura sulla cancellazione\n  * 1 => Forza\
        \ la cancellazione anche se ci sono studenti iscritti ma non sono state generate\
        \ pubblicazioni o verbali  \n  * 2 => Forza la cancellazione anche se ci sono\
        \ studenti e se sono state generate pubblicazioni ma non verbali\n  * 3 =>\
        \ Forza la cancellazione anche se l'appello è stao inviato ad UP senza che\
        \ questo non è stato ritornato\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
