---
swagger: "2.0"
info:
  description: "i servizi presenti permetto di operare sul calendario esami di ESSE3\
    \ e di effettuare le operazioni sulle liste iscritti,\nle principali operazioni\
    \ sono le seguenti\n\n* consultazione del calendario esami\n* inserimento e modifica\
    \ di un appello\n* prenotazione dello studente\n* rimozione della prenotazione\n\
    * presa visione del voto  \n* pubblicazione esiti\n* inserimento esiti\n\n## ChangeLog\n\
    \nVersione       | Versione di Esse3 di rilascio | Interventi \n-            \
    \  | -                             | -\n    1.1.0      | 17.07.03.00         \
    \          | aggiunto il metodo /appelli/{cdsId}/{adId}/{appId}/pubblicazione\
    \ \n    1.1.0      | 17.07.03.00                   | aggiunto il metodo /appelli/{cdsId}/{adId}/{appId}/turni/{appLogId}/pubblicazione\
    \ \n    1.1.0      | 17.07.03.00                   | aggiunto il metodo /appelli/{cdsId}/{adId}/{appId}/iscritti/{stuId}/esito\n\
    \    1.2.0      | 17.09.04.00                   | aggiunto l'utente tecnico (grp16)\n\
    \    1.3.0      | 17.12.02.00                   | abilitato lo studente all'accesso\
    \ del metodo /appelli/{cdsId}/{adId}/{appId}\n    1.3.0      | 17.12.02.00   \
    \                | aggiunto il filtro q=APPELLI_PRENOTABILI sui metodo /appelli/{cdsId}/{adId}\
    \ e /appelli/{cdsId}/{adId}/{appId} per i soli studenti\n    1.4.0      | 18.02.00.00\
    \                   | aggiunto il campo extAulaCod sul turno dell'appello\n  \
    \  1.4.0      | 18.02.00.00                   | aggiunti i campi desAppello,desTurno,dataOraInizioTurno\
    \ su IscrizioneAppello\n    1.5.0      | 18.04.01.00                   | aggiunto\
    \ l'endpoint /sessioni e relativi figli con le informazioni sulle sessioni\n \
    \   1.6.0      | 18.06.02.00                   | corretto il bug per sulla prenotazione\
    \ appelli nel caso di warning, aggiunti i warning di prenotazione nella IscrizioneAppello\n\
    \    1.6.0      | 18.06.02.00                   | Aggiunta la gestione delle commissioni\
    \ nella PUT di modifica appello /appelli/{cdsId}/{adId}/{appId}/\n    1.7.0  \
    \    | 18.10.01.00                   | Aggiunta la gestione dei link tra appelli\
    \ nei metodi POST, PUT, GEST /appelli/{cdsId}/{adId}/{appId}/\n    1.8.0     \
    \ | 18.12.01.00                   | Aggiunta la gestione delle prentazioni collegate\
    \ in fase di presa visione su /prenotazioni/{matId}/{applistaId}/presaVisione\n\
    \    1.8.0      | 18.12.01.00                   | Aggiunta la gestione delle prentazioni\
    \ collegate in fase di presa visione su /appelli/{cdsId}/{adId}/{appId}/iscritti/{stuId}/presaVisione\n\
    \    1.9.0      | 19.04.01.00                   | Aggiunta l'API /sistLogExt/export\n\
    \    1.9.0      | 19.04.01.00                   | Aggiunta l'API /sistLogExt/export/{elabId}\n\
    \    1.9.0      | 19.04.01.00                   | Aggiunta l'API /sistLogExt/export/{elabId}/eventi\n\
    \    1.9.0      | 19.04.01.00                   | Aggiunta l'API /sistLogExt/export/{elabId}/sessioni\n\
    \    1.10.0     | 19.10.03.00                   | Modificata l'API calesa-service-v1/appelli/{cdsId}/{adId}/{appId}/iscritti\
    \ aggiungendo il supporto all'utenteTecnico\n    1.10.0     | 19.10.03.00    \
    \               | Modificata l'API calesa-service-v1/appelli/{cdsId}/{adId}/{appId}/iscritti/{stuId}\
    \ aggiungendo il supporto all'utenteTecnico\n    1.10.0     | 19.10.03.00    \
    \               | Modificata l'API calesa-service-v1/prenotazioni/{matId} aggiungendo\
    \ il supporto all'utenteTecnico\n    1.10.0     | 19.10.03.00                \
    \   | Modificata l'API calesa-service-v1/prenotazioni/{matId}/{applistaId} aggiungendo\
    \ il supporto all'utenteTecnico\n    1.11.0     | 20.01.00.00                \
    \   | Modificata l'API calesa-service-v1//appelli/{cdsId}/{adId}/{appId}/iscritti\
    \ aggiungendo al body della post il campo attoreCod (solo per utenti tecnici)\n\
    \    1.12.0     | 20.05.01.00                   | Aggiunto l'endpoint /abilitazioni/{docenteId}\n\
    \    1.12.0     | 20.05.01.00                   | Aggiunto il campo userId alla\
    \ classe di modello IscrizioneAppello\n    1.12.0     | 20.05.01.00          \
    \         | Aggiunta la gestione del caricamento degli esiti tramite utenteTecnico\
    \ (necessario valorizzare il campo docenteImpersId)\n    1.12.0     | 20.05.01.00\
    \                   | Aggiunto un filtro per recuperare la lista di appelli integrati\
    \ con moodle\n    1.13.0     | 20.06.00.00                   | Aggiunta la possibilità\
    \ di definire le misure compensative per una singola prenotazione\n    1.14.0\
    \     | 20.07.02.00                   | Modificata l'API calesa-service-v1/appelli/{cdsId}/{adId}\
    \ aggiungendo il parametro opzionale config e il relativo parametro in queryString\
    \ attoreCod\n    1.14.0     | 20.07.02.00                   | Modificata l'API\
    \ calesa-service-v1/appelli/{cdsId}/{adId}/{appId} aggiungendo il parametro opzionale\
    \ config e il relativo parametro in queryString attoreCod\n    1.15.0     | 20.10.02.00\
    \                   | Aggiunta la gestione del tipoSvolgimentoEsame alla prenotazione\
    \ (POST /appelli/{cdsId}/{adId}/{appId}/iscritti)\n    1.15.0     | 20.10.02.00\
    \                   | Aggiunta la gestione del tipoSvolgimentoEsame all'inserimento\
    \ esiti (PUT /appelli/{cdsId}/{adId}/{appId}/iscritti/{stuId}/esito)\n    1.16.0\
    \     | 20.11.00.00                   | Aggiunto l'endpoint /sistLogExt/update\
    \ per l'aggiornamento di impegni precedentemente importati\n    1.17.0     | 21.03.03.00\
    \                   | Aggiunto il codice del template gruppo turni nel caricamento\
    \ di un appello\n    1.18.0     | 21.04.03.00                   | aggiunto il\
    \ filtro q=APPELLI_PRENOTABILI_E_FUTURI\n    1.19.0     | 21.05.02.00        \
    \           | aggiunto endpoint /abilitazioni/{docenteId}/appelli\n    1.20.0\
    \     | 21.06.01.00                   | Aggiunto endpoint /appelli/{cdsId}/{adId}/{appId}/tipi-svolgimento-esame\n\
    \    1.21.0     | 21.10.00.00                   | Aggiunta descrizione eventi\
    \ in inglese perl'endpoint /sistLogExt/export/{elabId}/eventi\n    1.22.0    \
    \ | 21.10.01.00                   | Aggiunta l'api per la gestione degli esami\
    \  comuni\n    1.23.0     | 21.11.00.00                   | Aggiunto endpoint\
    \ /appelli/{cdsId}/{adId}/{appId}/tags/{adsceId}\n    1.24.0     | 22.06.00.00\
    \                   | Aggiunto endpoint /appelli/{cdsId}/{adId}/{appId}/iscritti/{stuId}\n\
    \    1.25.0     | 23.03.02.00                   | aggiunti gli endpoint per il\
    \ recupero dello statino di prenotazione (pdf) e attestato di presenza esame (pdf)\n\
    \  \n"
  version: "1.25.0"
  title: "ESSE3 Calendario Esami  e Prenotazione API"
basePath: "/calesa-service-v1"
tags:
- name: "abilitazione"
  description: "informazioni sulle abilitazioni per l'utilizzo degli appelli"
- name: "appello"
  description: "informazioni per la gestione dell'appello"
- name: "turno"
  description: "informazioni sul turno di un appello"
- name: "commissione"
  description: "informazioni sulla commissione dell'appello (o del turno)"
- name: "sessione"
  description: "informazioni sulla sessione"
- name: "esame comune"
  description: "informazioni sull' esame comune collegato all'appello"
- name: "lista iscritti"
  description: "informazioni sulla lista iscritti dell'appello"
- name: "prenotazione"
  description: "informazioni sulla prenotazione"
- name: "sistema logistico esterno"
  description: "gestione aule e edifici con il sistema di logistica esterno"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /abilitazioni:
    get:
      tags:
      - "abilitazione"
      summary: "recupera le informazioni sulle Ablitazioni docente"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti  `AbilitazioniDocente`.\
        \  \n E' necessario valorizzare almeno un filtro tra quelli presenti per poter\
        \ effettuare il recupero dati\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|lowRefreshRateUserDependent|Risorsa che varia con frequenza\
        \ bassa, cache Http abilitata, cache server disabilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|Visualizza\
        \ le abilitazioni associate al docente dalla maschera \"Abilitazioni Docente\"\
        |SecurityCalesa.filterAbildocDoc(cdsAbilId, cdsAbilCod, adAbilId, adAbilCod)\n\
        \n\nClasse di modello : AbilitazioniDocente\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\naaAbilDocId|primaryKey\ncdsId|primaryKey\n\
        adId|primaryKey\ndocenteId|primaryKey\nminAaSesId|optional\nmaxAaSesId|optional\n\
        gruppoGiudCod|optional\ngruppoVotoCod|optional\nfigliEsacom|optional\n\n\n\
        Classe di modello : EsameComuneAbilitazione\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\nadId|primaryKey\n\
        aaOffId|primaryKey\ncdsFiglioId|primaryKey\nadFiglioId|primaryKey\ndocenteId|primaryKey\n\
        \n\nClasse di modello : EsameComuneGen\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\nadId|primaryKey\n\
        aaOffId|primaryKey\ncdsFiglioId|primaryKey\nadFiglioId|primaryKey\n\n\nClasse\
        \ di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getAbilitazioniDocente"
      parameters:
      - name: "cdsAbilId"
        in: "query"
        description: "id del corso di studio di erogazione dell'esame comune"
        required: false
        type: "integer"
        format: "int64"
      - name: "cdsAbilCod"
        in: "query"
        description: "codice del corso di studio di erogazione dell'esame comune"
        required: false
        type: "string"
      - name: "adAbilId"
        in: "query"
        description: "id dell'attività didattica di erogazione dell'esame comune"
        required: false
        type: "integer"
        format: "int64"
      - name: "adAbilCod"
        in: "query"
        description: "codice dell'attività didattica di erogazione dell'esame comune"
        required: false
        type: "string"
      - name: "aaOffAbilId"
        in: "query"
        description: "anno di definizione dell'esame comune"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/AbilitazioniDocente"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
