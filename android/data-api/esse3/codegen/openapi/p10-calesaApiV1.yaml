  /appelli/{cdsId}/{adId}/{appId}/iscritti/{stuId}/esito:
    put:
      tags:
      - "prenotazione"
      summary: "inserisce un esito per uno studente"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>*Permette la modifica/inserimento dei campi\
        \ dell'esito per uno studente*  \n   \n   Può inserire anche una nota, la\
        \ data dell'esame o una domanda d'esame.  \n   L'esito è considerato come\
        \ uno dei seguenti 4 valori (non è possibile passare, per un singolo esito\
        \ due valori tra i\nseguenti). Le votazioni, inoltre, devono essere omogenee\
        \ sull'appello (o tutti voti numerici oppure tutti giudizi\nappartenenti allo\
        \ stesso gruppo)\n\n* **voto**: votazione numerica, la lode è espressa con\
        \ il massimo della scala voti più uno (es. 30 e lode = 31), lo zero indica\
        \ la votazione generica insufficiente.\n* **tpoGiudCod**: codice del giudizio,\
        \ se valorizzato deve contenere un codice di giudizio compatibile con gli\
        \ altri (stesso gruppo_giudizio definito su esse3), il primo giudizio inserito\
        \ determina il gruppo dove viene fatto il controllo\n* **asenteFlg**: se valorizzato\
        \ indica che lo studente risulta assente\n* **ritiratoFlg**:  se valorizzato\
        \ indica che lo studente risulta essere ritirato\n\n\n\n ##### Codici di ritorno\
        \ della funzione\nCodice di Ritorno | Descrizione\n-                 | -\n\
