  /appelli/{cdsId}/{adId}/{appId}/pubblicazione:
    put:
      tags:
      - "appello"
      summary: "inserisce la pubblicazione per gli studenti dell'appello"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>E' possibile passare la lista di studenti per\
        \ cui effettuare la pubblicazione: se questa non viene passata, allora la\n\
        pubblicazione viene effettuata per tutti gli studenti attivi iscritti all'appello\
        \   \n   Nel caso ci fossero degli studenti che non risultano pubblicabili\
        \ oppure vengono riscontrati errori sulla pubblicazione,\nla lista degli studenti\
        \ in errore viene restituita nel dettaglio dell'errore nella response.\n\n\
        \ ##### Codici di ritorno della funzione\nCodice di Ritorno | Descrizione\n\
        -                 | -\n1                 | Pubblicazione riuscita\n2     \
        \            | La data di pubblicazione differisce dalla data odierna\n3 \
        \                | Campi relativi al mittente incoerenti (sono uno valorizzato\
        \ e l'altro no)\n4                 | Non è stata passata la chiave dell'appello\n\
        5                 | Non è stata passata la data di ultimo rifiuto, benchè\
        \ prevista dalla configurazione del tipo dell'appello\n6                 |\
        \ Tutte le prenotazioni sono già  pubblicate\n7                 | Esistono\
        \ studenti non pubblicabili \n8                 | L'appello risulta semplificato,\
        \ non sono previste le pubblicazioni\n9                 |\tAppello non esistente\n\
        10                | Valore errato nella data di ultimo rifiuto: risulta precedente\
        \ alla data di pubblicazione o non rispetta i gg minimi e massimi per il rifiuto\n\
        11\t\t\t\t  | Utente non abilitato alla pubblicazione degli esiti, verificare\
        \ il parametro tipi_gest_app.gestione_pubblicazione\n98                | Errore\
        \ in fase di generazione della pubblicazioneo\n99                | Sessione\
        \ non valida\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
