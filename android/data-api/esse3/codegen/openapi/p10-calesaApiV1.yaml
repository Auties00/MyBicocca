    post:
      tags:
      - "appello"
      summary: "inserisce un nuovo appello"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di inserire un nuovo appello per una\
        \ coppia CDS/AD data.\n\n##### Parametri in ingresso\nCampo       | Campi\
        \ obbligatori                 | Note \n-           | -                   \
        \              | - \nappello     |  cdsId,adId,aaCalId,dataInizioApp | cdsId,adId\
        \ se non valorizzati vengono presi dai parametri nel path. aaCalId se non\
        \ valorizzato viene impostato con in massimo anno di abilitazione per l'AD/CDS\
        \ del docente\nturni       |  dataEsa                          | L'array di\
        \ turni è facoltativo (1)\nsessioni    |  aaSesId,sesId                  \
        \  | L'array di sessioni è facoltativo (2)\ncommissione |  docenteId,ruoloCod\
        \               | L'array della commissione è facoltativo (3)\n\n##### Codici\
        \ di ritorno della funzione\nCodice di Ritorno | Descrizione\n-          \
        \       | -\n-1  | Errore nel passaggio dei parametri dell'appello\n-2  |\
        \ Turno numero: XX con cds_id = AAA data_esa non valorizzata\n-3  | Sulla\
        \ tabella TIPI_DEF_APP è abilitata la gestione turni con il sistema di logistica,\
        \ non è possibile inserili in fase di definizione dell'appello\n-4  | Sessione\
        \ numero: XX con cds_id = AAA  aa_ses_id oppure ses_id non valorizzato\n-5\
        \  | Docente numero: XX  con cds_id = AAA docente_id oppure ruolo_cod non\
        \ valorizzato\n-6  | Errore nel controllo di completezza dei periodi : RET\
        \  - DES\n-7  | Non è possibile associare nessuna sessione valida all'appello\n\
        -8  | La chiamata è di tipo WEB e il session_id non si riferisce ad un docente\n\
        -9  | Errore nel recupero delle informazioni sulla TIPI_DEF_APP\n-10 | Non\
        \ è possibile calcolare l'index da associare all'appello\n-11 | Non è possibile\
        \ caricare la commissione da associare all'appello\n-12 | Non è possibile\
        \ inserire l'appello perchè il campo p09_cds_ad_gen.def_app_flg = 0\n-13 |\
        \ Fallita la sincronizzazione con UP\n-14 | Non è possibile creare un appello\
        \ su un modulo se il tipo_esa_cod_prev != 'UD'\n-15 | Errore nella creazione\
        \ del template di voti da associare all'appello\n-16 | Inserire un docente\
        \ con ruolo presidente\n-17 | La data del turno non è compatibile con le date\
        \ dell'appello\n-18 | La minima data del turno deve coincidere con la data\
        \ dell'appello\n-19 | Non è possibile definire il gruppo_voto_id\n-20 | Errore\
        \ passaggio parametri sulle associazioni degli appelli\n-21 | Errore inserimento/modifica/cancellazione\
        \ associazioni degli appelli\n-22 | Codice errore non gestito nelle associazioni\
        \ degli appelli\n-23 | Codice template turni non valido\n-24 | I dati dei\
        \ turni del template devono aver valorizzato i valori di data e ora\n-25 |\
        \ Nel turno numero XX con cds_id = XX è valorizzato il fat_part_cod ma non\
        \ il dom_part_cod\n-26 | Nei dati dei turni del template è valorizzato il\
        \ fat_part_cod ma non il il dom_part_cod\n\n##### Note \n1. turni:  Se nullo\
        \ viene inserito un turno automatico con la stessa data dell'appello;  \n\
        \   Nell'inserimento vanno rispettati i seguenti vincoli:\n  * la data minima\
        \ nel caso di più turni deve coincide con la data dell'appello\n  * le date\
        \ dei turni devono essere contenute nelle sessioni associate agli appelli\n\
        2. sessioni: Se nullo vengono inserite tutte le sessioni compatibili con la\
        \ data dell'appello\n3. commissione: Se nullo viene cercata la commissione\
        \ tra le seguenti\n  * se l'utente di inserimento è un docente viene automaticamente\
        \ inserito in commissione\n  * vengono inserite le commissioni associabili\
        \ all'appello in base al parametro di configurazione **ASSOCIA_COMM_APP**\n\
        4. links: per inserire un link è necessario rispettare i seguenti vincoli\n\
        \  * deve essere valorizzata una delle due chiavi dell'appello collegato :\
        \ templvotoId oppure (cdsId,adId,appId)\n  * deve essere valorizzato il campo\
        \ tipo_rel_app_cod\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|Visualizza\
        \ le abilitazioni associate al docente dalla maschera \"Abilitazioni Docente\"\
        |SecurityCalesa.checkAbildocDoc(cdsId, adId)\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n\n\nClasse di modello : InserimentoAppello\n======\n\nEstensioni\
        \ sulle proprietà\n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\n\
        adId|primaryKey\ngruppoVotoId|optional\nsedeId|optional\ntagTemplId|optional\n\
        noteSistLog|optional\n\n\nClasse di modello : InserimentoDocenteCommissioneAppello\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        docenteId|primaryKey\n\n\nClasse di modello : InserimentoAggiornamentoSessione\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        aaSesId|primaryKey\nsesId|primaryKey\n"
      operationId: "postAppello"
