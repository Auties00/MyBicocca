      dataScadenza:
        type: "string"
        example: "14/09/2021"
        description: "data di scadenza della voce"
      importo:
        type: "number"
        format: "double"
        example: 100.2
        description: "Importo della voce."
      rataId:
        type: "integer"
        format: "int64"
        example: 101
        description: "Rata a cui si referisce la voce."
      voceCod:
        type: "string"
        example: "BOLLO"
        description: "Codice della voce."
      nota:
        type: "string"
        example: "Imposta di Bollo"
        description: "nota aggiuntiva."
