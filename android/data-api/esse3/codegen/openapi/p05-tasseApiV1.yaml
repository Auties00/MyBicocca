  /addebiti-persona/{persId}:
    get:
      tags:
      - "Tasse"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Il servizio restituisce tutti gli addebiti\
        \ legati a un pers_id (sia tasse di ammissione sia tasse di servizio legate\
        \ alla persona).\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|highRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ elevata, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-massive-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nUserTecnicoMassivo|funzione massiva riservata ad utenti tecnici autorizzati|Security.checkMassiveGET()\n\
        \n**Utente: common-persona-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nPERSONA|Permette la visualizzazione delle informazioni della persona\
        \ dell'utente registrato, immatricolato in ipotesi.|Security.checkPersonaPersId(persId)\n\
        \n**Utente: common-student-persona-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nSTUDENTE|Permette la visualizzazione delle informazioni della persona\
        \ dello studente|Security.checkStuPersId(persId)\n\n\nClasse di modello :\
        \ DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getListaAddebitiPersona"
      parameters:
      - name: "persId"
        in: "path"
        description: "Codice univoco che consente di individuare una persona."
        required: true
        type: "integer"
        format: "int64"
      - name: "aaId"
        in: "query"
        description: "Identificativo dell'anno accademico."
        required: false
        type: "integer"
        format: "int64"
      - name: "fattId"
        in: "query"
        description: "Identificativo della fattura."
        required: false
        type: "integer"
        format: "int64"
      - name: "pagatoFlg"
        in: "query"
        description: "Flag che indica se l'addebito è pagato o meno. (1 = solo tasse\
          \ pagate - null = tutte le tasse - 0 = tasse non pagate)"
        required: false
        type: "integer"
        format: "int32"
      - name: "annullataFlg"
        in: "query"
        description: "Flag che indica se l'addebito è annullato o meno. (1 = solo\
          \ tasse annullate - 0 = tasse non non annullate). Il default è 0."
        required: false
        type: "integer"
        format: "int32"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/AddebitoPersona"
        "422":
          description: "Incorrect parameters"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-massive-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UserTecnicoMassivo"
              description: "funzione massiva riservata ad utenti tecnici autorizzati"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkMassiveGET"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      - common-student-persona-permissions:
          kind: "STUDENTE"
          profiles:
          - profile:
              name: "STUDENTE"
              description: "Permette la visualizzazione delle informazioni della persona\
                \ dello studente"
              checks:
              - checkPersId:
                  className: "Security"
                  functionName: "checkStuPersId"
                  description: "controlla che il persId appartenga ad una delle carriere\
                    \ dello studente"
                  parameters:
                  - persId:
                      name: "persId"
                      in: "path"
                      description: "id della persona"
                      required: true
                      type: "integer"
                      format: "int64"
      - common-persona-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "PERSONA"
              description: "Permette la visualizzazione delle informazioni della persona\
                \ dell'utente registrato, immatricolato in ipotesi."
              checks:
              - checkPersId:
                  className: "Security"
                  functionName: "checkPersonaPersId"
                  description: "controlla che il persId appartenga ad una delle carriere\
                    \ dell'utente registrato, immatricolato in ipotesi."
                  parameters:
                  - persId:
                      name: "persId"
                      in: "path"
                      description: "id della persona"
                      required: true
                      type: "integer"
                      format: "int64"
      x-cache-type: "highRefreshRateUserIndependent"
