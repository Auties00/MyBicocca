              description: "controlla che il badge richeisto sia collegato alla persona"
              checks:
              - checkTipologiaAllegato:
                  className: "SecurityBadge"
                  functionName: "checkBadgeStu"
                  description: "la funzione controlla che il il badge sia accessibile\
                    \ dallo studente"
                  parameters:
                  - badgeBlobId: "{\"name\":\"badgeBlobId\",\"in\":\"path\",\"description\"\
                      :\"id del blob con le immagini del badge\",\"required\":true,\"\
                      type\":\"integer\",\"items\":null,\"collectionFormat\":null,\"\
                      default\":null,\"maximum\":null,\"exclusiveMaximum\":null,\"\
                      minimum\":null,\"exclusiveMinimum\":null,\"maxLength\":null,\"\
                      minLength\":null,\"pattern\":null,\"maxItems\":null,\"minItems\"\
                      :null,\"uniqueItems\":null,\"multipleOf\":null,\"format\":\"\
                      int64\",\"x-example\":null,\"enum\":null}"
