---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso ai servizi rest dell'area Badge\n"
  version: "1.1.0"
  title: "ESSE3 Badge API"
basePath: "/badge-service-v1"
tags:
- name: "badge"
  description: "informazioni sul badge"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /badges:
    get:
      tags:
      - "badge"
      summary: "recupera i dati del badge"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|filtra\
        \ i badge collegati alla persona|SecurityBadge.filterBadgeStu(rfid, stuId,\
        \ codFis, cdsCod, aaIscrAnn)\n\n\nClasse di modello : DatiBadge\n======\n\n\
        Estensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nbdgId|primaryKey\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getBadgesNew"
      parameters:
      - name: "rfid"
        in: "query"
        description: "rfid associato al badge dello studente"
        required: false
        type: "string"
      - name: "stuId"
        in: "query"
        description: "identificativo della carriera"
        required: false
        type: "integer"
        format: "int64"
      - name: "codFis"
        in: "query"
        description: "codice fiscale della persona"
        required: false
        type: "string"
      - name: "cdsCod"
        in: "query"
        description: "corso di studio di iscrizione dello studente"
        required: false
        type: "string"
      - name: "aaIscrAnn"
        in: "query"
        description: "anno di iscrizione"
        required: false
        type: "integer"
        format: "int32"
      - name: "staStuCod"
        in: "query"
        description: "stato studente"
        required: false
        type: "string"
        enum:
        - "A"
        - "S"
        - "X"
        - "I"
      - name: "staMatCod"
        in: "query"
        description: "stato matricola"
        required: false
        type: "string"
        enum:
        - "A"
        - "S"
        - "I"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "filter"
        in: "query"
        description: "il parametro consente di applicare dei filtri alla classe di\
          \ modello utilizzando il linguaggio  [RSQL](https://github.com/jirutka/rsql-parser).\n\
          La lista degli operatori utilizzabili è disponibile [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosullerigherecuperate)\
          \   \n   *NB* il filtro viene applicato DOPO aver recuperato i dati\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/DatiBadge"
        "422":
          description: "Parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      - filter-badge-stu-permission:
          kind: "STUDENTE"
          profiles:
          - profile:
              name: "STUDENTE"
              description: "filtra i badge collegati alla persona"
              checks:
              - checkTipologiaAllegato:
                  className: "SecurityBadge"
                  functionName: "filterBadgeStu"
                  description: "la funzione controlla che esistano dei badge collegati\
                    \ allo studente con i filtri richiesti"
                  parameters:
                  - rfid: "{\"name\":\"rfid\",\"in\":\"query\",\"description\":\"\
                      rfid associato al badge dello studente\",\"required\":false,\"\
                      type\":\"string\",\"items\":null,\"collectionFormat\":null,\"\
                      default\":null,\"maximum\":null,\"exclusiveMaximum\":null,\"\
                      minimum\":null,\"exclusiveMinimum\":null,\"maxLength\":null,\"\
                      minLength\":null,\"pattern\":null,\"maxItems\":null,\"minItems\"\
                      :null,\"uniqueItems\":null,\"multipleOf\":null,\"format\":null,\"\
                      x-example\":null,\"enum\":null}"
                  - stuId: "{\"name\":\"stuId\",\"in\":\"query\",\"description\":\"\
                      identificativo della carriera\",\"required\":false,\"type\"\
                      :\"integer\",\"items\":null,\"collectionFormat\":null,\"default\"\
                      :null,\"maximum\":null,\"exclusiveMaximum\":null,\"minimum\"\
                      :null,\"exclusiveMinimum\":null,\"maxLength\":null,\"minLength\"\
                      :null,\"pattern\":null,\"maxItems\":null,\"minItems\":null,\"\
                      uniqueItems\":null,\"multipleOf\":null,\"format\":\"int64\"\
                      ,\"x-example\":null,\"enum\":null}"
                  - codFis: "{\"name\":\"codFis\",\"in\":\"query\",\"description\"\
                      :\"codice fiscale della persona\",\"required\":false,\"type\"\
                      :\"string\",\"items\":null,\"collectionFormat\":null,\"default\"\
                      :null,\"maximum\":null,\"exclusiveMaximum\":null,\"minimum\"\
                      :null,\"exclusiveMinimum\":null,\"maxLength\":null,\"minLength\"\
                      :null,\"pattern\":null,\"maxItems\":null,\"minItems\":null,\"\
                      uniqueItems\":null,\"multipleOf\":null,\"format\":null,\"x-example\"\
                      :null,\"enum\":null}"
                  - cdsCod: "{\"name\":\"cdsCod\",\"in\":\"query\",\"description\"\
                      :\"corso di studio di iscrizione dello studente\",\"required\"\
                      :false,\"type\":\"string\",\"items\":null,\"collectionFormat\"\
                      :null,\"default\":null,\"maximum\":null,\"exclusiveMaximum\"\
                      :null,\"minimum\":null,\"exclusiveMinimum\":null,\"maxLength\"\
                      :null,\"minLength\":null,\"pattern\":null,\"maxItems\":null,\"\
                      minItems\":null,\"uniqueItems\":null,\"multipleOf\":null,\"\
                      format\":null,\"x-example\":null,\"enum\":null}"
                  - aaIscrAnn: "{\"name\":\"aaIscrAnn\",\"in\":\"query\",\"description\"\
                      :\"anno di iscrizione\",\"required\":false,\"type\":\"integer\"\
                      ,\"items\":null,\"collectionFormat\":null,\"default\":null,\"\
                      maximum\":null,\"exclusiveMaximum\":null,\"minimum\":null,\"\
                      exclusiveMinimum\":null,\"maxLength\":null,\"minLength\":null,\"\
                      pattern\":null,\"maxItems\":null,\"minItems\":null,\"uniqueItems\"\
                      :null,\"multipleOf\":null,\"format\":\"int32\",\"x-example\"\
                      :null,\"enum\":null}"
    x-alias-path: "badges"
