securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  DettaglioErroreAggiuntivo:
    type: "object"
    properties:
      errorType:
        type: "string"
        example: "stackTrace"
        description: "descrizione del tipo di errore aggiuntivo"
      value:
        type: "string"
        example: "SocketTimeoutException...."
        description: "descrizione dell'errore"
      rawValue:
        type: "string"
        example: "SocketTimeoutException...."
        description: "descrizione dell'errore"
        x-field-type: "rawJson"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  DettaglioErrore:
    type: "object"
    properties:
      statusCode:
        type: "integer"
        format: "int32"
        example: 200
        description: "Http Status Code"
      retCode:
        type: "integer"
        format: "int32"
        example: -1
        description: "codice di errore"
      retErrMsg:
        type: "string"
        example: "Parametri non corretti"
        description: "descrizione dell'errore"
      errDetails:
        type: "array"
        items:
          $ref: "#/definitions/DettaglioErroreAggiuntivo"
    x-model-sub-package: "frk.v1"
    x-model-sub-path: "frk/v1"
  DatiBadge:
    type: "object"
    required:
    - "rfid"
    discriminator: "typeDatiBadge"
    properties:
      bdgId:
        type: "integer"
        format: "int64"
        example: 123
        description: "id del badge"
        x-field-type: "primaryKey"
      annFlg:
        type: "integer"
        format: "int64"
        example: 1
        description: "flag che indica se il badge è stato restituito"
      badgeBlbId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id del blob con le immagini del badge"
      frontImagePresent:
        type: "integer"
        format: "int32"
        example: 1
        description: "flag che indica se è presente un blob con l'immagine anteriore"
        minimum: 0.0
        maximum: 1.0
      rearImagePresent:
        type: "integer"
        format: "int32"
        example: 1
        description: "flag che indica se è presente un blob con l'immagine posteriore"
        minimum: 0.0
        maximum: 1.0
      restFlg:
        type: "integer"
        format: "int64"
        example: 1
        description: "flag che indica se il badge è annullato"
      consFlg:
        type: "integer"
        format: "int64"
        example: 1
        description: "flag che indica se il badge è stato consegnato"
      dataIni:
        type: "string"
        example: "10/09/2019 11:00:00"
        description: "data e ora di creazione del badge (DD/MM/YYYY HH24:MI:SS)"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})\
          \ ([01][0-9]|2[0-4]):[0-5][0-9]:[0-5][0-9]"
        x-internal-name: "data_emissione"
      dataStampa:
        type: "string"
        example: "10/10/2019 10:00:00"
        description: "data e ora di stampa del badge (DD/MM/YYYY HH24:MI:SS)"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})\
          \ ([01][0-9]|2[0-4]):[0-5][0-9]:[0-5][0-9]"
      dataFin:
        type: "string"
        example: "10/10/2019 10:00:00"
        description: "data e ora di annullamento del badge (DD/MM/YYYY HH24:MI:SS)"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})\
          \ ([01][0-9]|2[0-4]):[0-5][0-9]:[0-5][0-9]"
      dataConsegna:
        type: "string"
        example: "10/10/2019 10:00:00"
        description: "data e ora di consegna del badge (DD/MM/YYYY HH24:MI:SS)"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})\
          \ ([01][0-9]|2[0-4]):[0-5][0-9]:[0-5][0-9]"
      persId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id univoco che consente di individuare la persona"
      stuId:
        type: "integer"
        format: "int64"
        example: 123
        description: "id della carriera dello studente"
      matId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id univoco della matricola"
      matricola:
        type: "string"
        example: "123456"
        description: "matricola dello studente, è il numero assegnato dalle segreterie\n\
          allo studente per identificarlo nel sistema, una matricola potrebbe non\n\
          identificare univocamente un libretto collegato ad un tratto di carriera\n"
      cognome:
        type: "string"
        example: "Rossi"
        description: "cognome della persona"
        maxLength: 80
      nome:
        type: "string"
        example: "Mario"
        description: "nome della persona"
        maxLength: 80
      codFis:
        type: "string"
        example: "GGGTTT81XA944H"
        description: "codice fiscale della persona"
        maxLength: 16
      statoNascita:
        type: "string"
        example: "ITALIA"
        description: "denominazione della nazione di nascita"
        maxLength: 255
      statoResidenza:
        type: "string"
        example: "ITALIA"
        description: "denominazione della nazione di residenza"
        maxLength: 255
      codCds:
        type: "string"
        example: "CDS_1"
        description: "codice del corso di studio di iscrizione dello studente"
      desCds:
        type: "string"
        example: "Esempio di CDS"
        description: "descrizione del corso di iscrizione dello studente"
      codFac:
        type: "string"
        example: "65"
        description: "Codice del dipartimento/facoltà"
      desFac:
        type: "string"
        example: "Facoltà di ECONOMIA"
        description: "Descrizione del dipartimento/facoltà"
      aaIscrAnn:
        type: "integer"
        format: "int32"
        example: 2016
        description: "anno di ordinamento del corso di iscrizione dello studente"
      rfid:
        type: "string"
        example: "83"
        description: "rfid associato al badge"
      codUniversita:
        type: "string"
        example: "A"
        description: "Codice dell'università"
      universita:
        type: "string"
        example: "A"
        description: "Descrizione dell'università"
      staStuCod:
        type: "string"
        example: "A"
        description: "Descrizione dell'università"
      staMatCod:
        type: "string"
        example: "A"
        description: "Descrizione dell'università"
    x-layout-name: "ANAGR_BADGE_REST"
    x-winsession-name: "p18/n_si_18_022_stampa_badge"
    x-model-sub-package: "badge.v1"
