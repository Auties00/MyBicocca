---
swagger: "2.0"
info:
  description: "Il servizio fornisce le API per l'accesso alla rendicontazione docente\n\
    \n* Registro Docente\n* Diario Docente\n\n## ChangeLog\n\nVersione       | Versione\
    \ di Esse3 di rilascio | Interventi \n-              | -                     \
    \        | -\n1.0.0          | 21.12.02.00                   | Prima versione\
    \  \n  \n"
  version: "1.0.0"
  title: "ESSE3 Rendicontazione API"
basePath: "/rendicontazione-doc-service-v1"
tags:
- name: "registro"
  description: "registro docente"
- name: "diario"
  description: "diario docente"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /diari:
    get:
      tags:
      - "diario"
      summary: "filtra le informazioni di testata dei diari docente"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        UTENTE_TECNICO|funzione accessibile alle utenze tecniche per accessi ai servizi\
        \ REST|Security.checkUserTecnico()\n\n\nClasse di modello : DiarioDocente\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        diarioId|primaryKey\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "filterDiarioDocente"
      parameters:
      - name: "aaId"
        in: "query"
        description: "id dell' anno del diario"
        required: false
        type: "integer"
        maximum: 2100.0
        minimum: 1900.0
        format: "int32"
      - name: "docenteId"
        in: "query"
        description: "id del docente"
        required: false
        type: "integer"
        format: "int64"
      - name: "codFis"
        in: "query"
        description: "codice fiscale del docente"
        required: false
        type: "string"
      - name: "matricola"
        in: "query"
        description: "matricola del docente"
        required: false
        type: "string"
      - name: "cognome"
        in: "query"
        description: "cognome del docente (sono necessari almeno i primi 3 caratteri\
          \ del cognome, poi è possibile aggiungere un * per effettuare una ricerca\
          \ in like)"
        required: false
        type: "string"
      - name: "staDiarioCod"
        in: "query"
        description: "stato del diario"
        required: false
        type: "string"
        enum:
        - "B"
        - "S"
        - "A"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/DiarioDocente"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
  /diari/{diarioId}:
    get:
