securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  DiarioDocenteConDettagli:
    allOf:
    - $ref: "#/definitions/DiarioDocente"
    - type: "object"
      properties:
        attivita:
          type: "array"
          items:
            $ref: "#/definitions/DiarioDocenteDett"
        attivitaAnnuali:
          type: "array"
          items:
            $ref: "#/definitions/DiarioDocenteDettAA"
        note:
          type: "array"
          items:
            $ref: "#/definitions/DiarioDocenteNote"
    x-layout-name: "DIARIO_DOC_TESTATA_REST"
    x-winsession-name: "p09/n_di_09_121_diario_docente"
    x-model-sub-package: "offerta.v1"
    x-model-sub-path: "offerta/v1"
  DiarioDocenteDett:
    type: "object"
    required:
    - "dettDiarioId"
    properties:
      dettDiarioId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id del diario docente"
        minimum: 1.0
      tipoAttCod:
        type: "string"
        example: "LEZ"
        description: "codice tipo attività"
        maxLength: 10
      tipoAttDes:
        type: "string"
        example: "Lezione"
        description: "descrizione tipo attività"
        maxLength: 10
      data:
        type: "string"
        example: "10/12/2021"
        description: "data dell'attività rendicontata nel formato DD/MM/YYYY"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      ore:
        type: "integer"
        format: "int32"
        example: 1
        description: "ore rendicontate"
        minimum: 0.0
      minuti:
        type: "integer"
        format: "int32"
        example: 30
        description: "minuti rendicontati"
        minimum: 0.0
    x-layout-name: "DIARIO_DOC_DETT_REST"
    x-winsession-name: "p09/n_di_09_121_diario_docente"
    x-model-sub-package: "offerta.v1"
    x-model-sub-path: "offerta/v1"
  RegistroDocenteDettGrp:
    type: "object"
    properties:
      des:
        type: "string"
        example: "gruppo 1"
        description: "descrizione del gruppo collegato con il dettaglio del registro"
    x-layout-name: "GRP_REG_DOC_DETT_REST"
    x-winsession-name: "p09/n_di_09_120_registro_docente"
    x-model-sub-package: "offerta.v1"
    x-model-sub-path: "offerta/v1"
  DettaglioErrore:
    type: "object"
    properties:
      statusCode:
        type: "integer"
        format: "int32"
        example: 200
        description: "Http Status Code"
      retCode:
        type: "integer"
