      operationId: "getDiarioDocente"
      parameters:
      - name: "diarioId"
        in: "path"
        description: "id univoco del diario docente"
        required: true
        type: "integer"
        format: "int64"
      responses:
        "200":
          description: "successful operation"
          schema:
