        x-field-type: "optional"
        x-internal-name: "ad_cod"
      adDes:
        type: "string"
        example: "adDes"
        description: "descrizione attività didattica del libretto"
        x-field-type: "optional"
        x-internal-name: "ad"
      aaFreqId:
        type: "integer"
        format: "int32"
        example: 2016
        description: "anno di frequenza"
        x-field-type: "optional"
      dataFreq:
        type: "string"
        example: "10/10/2016"
        description: "data di acquisizione della frequenza"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
        x-field-type: "optional"
      dataSup:
        type: "string"
        example: "10/10/2016"
        description: "data di superamento dell'attività"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
        x-field-type: "optional"
      esito:
        $ref: "#/definitions/Esito"
      profCod:
        type: "string"
        example: "profCod"
        description: "codice profilo studente"
        x-field-type: "optional"
      elaboraFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "flag che indica se l'attività risulta da elaborare oppure no"
        minimum: 0.0
        maximum: 1.0
      errMsg:
        type: "string"
        example: "descrizione errore"
        description: "descrizione dell'errore nel caso l'elaborazione della riga risulta\
          \ fallita"
    x-layout-name: "AGG_CARR_PREVIEW_DETT"
    x-winsession-name: "p11/n_di_11_022_aggiorna_carriere_batch"
    x-model-sub-package: "libretto.v1"
