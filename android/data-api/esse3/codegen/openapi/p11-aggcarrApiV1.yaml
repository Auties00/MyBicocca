      pdsStuCod:
        type: "string"
        example: "pdsStuCod"
        description: "codice del percorso di studio di iscrizone dello studente"
      pdsStuDes:
        type: "string"
        example: "pdsStuDes"
        description: "descrizione del percorso di studio di iscrizone dello studente"
