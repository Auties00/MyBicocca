---
swagger: "2.0"
info:
  description: "### Procedure ###\nSono disponibili le procedure seguenti (montate\
    \ sugli endpoint `/aggcarr/{nomeProc}` e `/aggcarr/{nomeProc}/{matId}`): \n\n\
    \ Procedura         | Descrizione\n -                 | - \n **AGG_AD_OFF**  \
    \  | Aggiornamento attiributi attività didattica dall'offerta di riferimento\n\
    \ **FREQ**          | Assegnazione della frequenza\n **RIMUOVI_FREQ**  | Rimozione\
    \ della frequenza\n **SEG**           | Aggionnamento segmenti delle attività\
    \ a libretto a partire dall'offerta di riferimento\n **SOST**          | Sostituzione\
    \ di una attività didattica con un'altra attività\n \n **N.B.**\n L'enpoint con\
    \ il `{matId}` è utilizzato per invocare il motore aggiorna carriere su una specifica\
    \ matricola\n \n ### Filtri Comuni: ###\n \n Tutti i processi contengono dei filtri\
    \ comuni che permettono di selezionare le matricole `{matId}` su cui operare,\n\
    \ i filtri sono contenuti sulla sezione `filtriComuni` dei parametri in ingresso\
    \ alla singola procedura\n \n * *facId / facCod*   : id / codice del dipartimento/facoltà\
    \ (in alternativa)\n * *cdsId / cdsCod*   : id / codice del corso di studio (in\
    \ alternativa)\n * *aaOrdId*          : anno di ordinamento (valido solo se presente\
    \ il cdsId / cdsCod)\n * *pdsId / pdsCod*   : id  /codice del pds relativo al\
    \ cdsId/cdsCod e aaOrdId (in alternativa)\n * *aaRegId*          : anno di coorte\n\
    \ \n \n **N.B.**\n Per le invocazioni massive, vanno valorizzati obbligatoriamente\
    \ facId o cdsId, per le invocazioni puntuali è sufficiente il matId e non è necessario\
    \ valorizzare i filtri comuni\n\n### Esempio di invocazione ##\n\n#### Invocazione\
    \ Massiva ####\n\n1. invocare la procedura desiderata in uno degli endpoint `/aggcarr/{nome_proc}`\n\
    2. l'enpoint restituisce l'header link con l'URL della preview con le righe da\
    \ elaborare\n3. è possibile consultare la preview tramite `/aggcarr/{aggcarrId}`\
    \ e `/aggcarr/{aggcarrId}/dettagli`\n4. se necessario è possibile segnare le righe\
    \ da scartare `/aggcarr/{aggcarrId}/{aggcarrdettId}/elabora`\n5. l'elaborazione\
    \ viene lanciata tramite `/aggcarr/{aggcarrId}/{aggcarrdettId}/esegui`\n6. i risultati\
    \ sono forniti come log (recuperabile anche `/aggcarr/{aggcarrId}/log`) \n7. L'enpoint\
    \ `/aggcarr/{aggcarrId}/dettagli` riporta i dettagli con la situazione aggiornata\n\
    8. Una volta conclusa la consultazione è necessario cancellare l'elaborazione\
    \ tramite la delete sulla risorsa\n\n#### Invocazione Singola ####\n\n 1. Invocare\
    \ la procedura desiderata (presente in uno degli endpoint `/aggcarr/{nome_proc}/{matId}`\n\
    \ 2. Il motore viene lanciato in modo contestuale e viene fornito il log di elaborazione\n\
    \ 3. L'enpoint `/aggcarr/{aggcarrId}//dettagli` riporta i dettagli con la situazione\
    \ aggiornata\n 4. Una volta conclusa la consultazione è necessario cancellare\
    \ l'elaborazione tramite la delete sulla risorsa\n"
  version: "1.0.0"
  title: "AGGIORNA CARRIERE API"
basePath: "/aggcarr-service-v1"
