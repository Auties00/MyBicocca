securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  ParametriProceduraFREQ:
    type: "object"
    required:
    - "forzaDataFreq"
    - "forzaNonPreviste"
    - "forzaStatoF"
    - "forzaStudentiX"
    properties:
      forzaStudentiX:
        type: "boolean"
        example: false
        description: "flag che indica se assegnare la frequenza anche per studenti\
          \ cessati"
      forzaDataFreq:
        type: "boolean"
        example: false
        description: "flag che indica se assegnare la data di frequenza"
      forzaStatoF:
        type: "boolean"
        example: false
        description: "flag che indica se assegnare la frequenza anche alle AD già\
          \ frequentate"
        x-internal-name: "forza_ricalc_flg"
      forzaNonPreviste:
        type: "boolean"
        example: false
        description: "flag che indica se assegnare la frequenza anche se non previsto\
          \ dalla frequenza automatica"
      partCod:
        type: "string"
        example: "S1"
        description: "partizione dell'anno accademico (semestre)"
      domPartCod:
        type: "string"
        example: "AK"
        description: "dominio di partizione da filtrare (domPartCod e fatPartCod devono\
          \ essere entrambi valorizzati)"
      fatPartCod:
        type: "string"
        example: "ALF"
        description: "fattore di partizione da filtrare (domPartCod e fatPartCod devono\
          \ essere entrambi valorizzati)"
      adCod:
        type: "string"
        example: "adCod"
        description: "codice dell'attività didattica su cui applicare la frequenza,\
          \ in alternativa al parametro adId"
      adId:
        type: "integer"
        format: "int64"
        example: 1
        description: "id dell'attività didattica su cui applicare la frequenza, in\
          \ alternativa al parametro adCod"
        x-internal-name: "old_ad_id"
      filtriComuni:
        $ref: "#/definitions/ParametriFiltro"
    x-model-sub-package: "libretto.v1"
    x-model-sub-path: "libretto/v1"
  ParametriProceduraSOST:
    type: "object"
    required:
    - "forzaStatoS"
    properties:
      filtriComuni:
        $ref: "#/definitions/ParametriFiltro"
      adIdDaSostituire:
        type: "integer"
        format: "int64"
        example: 100
        description: "id dell'attività didattica da sostituire, da utilizzare in alternativa\
          \ ad adCodDaSostituire"
      adCodDaSostituire:
        type: "string"
        example: "adCod"
        description: "codice attività didattica da sostituire, da utilizzare in alternativa\
          \ ad adIdDaSostituire"
      forzaStatoS:
        type: "boolean"
        example: false
        description: "flag che indica se sostituire l'attività didattica anche se\
          \ superata"
      chiaveADdaInserire:
        $ref: "#/definitions/ChiaveADContestualizzata"
      udId:
        type: "integer"
        format: "int64"
        example: 100
        description: "id dell'unità didattica da sostituire, valido solo se valorizzata\
          \ la chiave dell'AD"
    x-model-sub-package: "libretto.v1"
    x-model-sub-path: "libretto/v1"
  RigaAggiornaCarriera:
    type: "object"
