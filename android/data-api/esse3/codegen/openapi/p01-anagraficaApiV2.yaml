  version: "1.3.0"
  title: "ESSE3 Anagrafica API"
basePath: "/anagrafica-service-v2"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /activation-url{applicationId}:
    put:
      tags:
      - "dream apply"
      summary: "refresh della data di scadenza del token dreamapply e recupero dell’\
        url di attivazione"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>servizion che provvede al refresh della data\
        \ di scadenza del token dreamapply e al recupero dell’url di attivazione con\
        \ token eventualmente aggiornando la domanda in stato A.\n\n##### Codici di\
        \ ritorno della funzione\n Codice di Ritorno | Descrizione\n-            \
        \     | -\n-1               | Errore generico\n0                 | Carriera\
        \ non attivabile\n1                 | Esecuzione Corretta\n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n\n\n\
        Classe di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "refreshToken"
      consumes:
      - "application/json"
      parameters:
      - name: "applicationId"
        in: "path"
        description: "id esterno della carriera per dreamapply"
        required: true
        type: "string"
      responses:
        "200":
          description: "Update succeded"
          schema:
            $ref: "#/definitions/RefreshedToken"
        "404":
          description: "ApplicationId non valido"
          schema:
            $ref: "#/definitions/DettaglioErrore"
        "422":
          description: "aggiornamento non riuscito"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
  /allegati/autorizzati/{autorizzatoId}/allegatiAutorizzato/:
    get:
      tags:
      - "allegati"
      summary: "recupero metadati allegati relativi ad un autorizzato"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>consente di recuperare i metadati degli allegati\
        \ relativi ad un autorizzato.  Il blob dell'allegato può essere scaricato\
        \ tramite l'api degli allegati utilizzando l'allegatoId e ed il tipoAssAllegato\
        \ recuperato con questo servizio.\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ bassa, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getMetadataAllegatoAutorizzato"
      parameters:
      - name: "autorizzatoId"
        in: "path"
        description: "id dell'autorizzato"
        required: true
        type: "integer"
        format: "int64"
      - name: "tipologiaAllegato"
        in: "query"
        description: "tipologia dell'allegato relativo all'entità p17_tipologia_allegati"
        required: false
        type: "string"
        maxLength: 10
      - name: "validoFlg"
        in: "query"
        description: "flag che indica se l'allegato risulta validato o meno"
        required: false
        type: "integer"
        maximum: 1.0
        minimum: 0.0
        format: "int32"
      - name: "webVisFlg"
        in: "query"
        description: "flag che indica se l'allegato risulta visibile da web o meno"
        required: false
        type: "integer"
        maximum: 1.0
        minimum: 0.0
        format: "int32"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/GetMetadataAllegatoAutorizz"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
    post:
      tags:
      - "allegati"
      summary: "inserimento metadati allegato relativo ad un autorizzato"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>consente di effettuare l'inserimento dei metadati\
        \ di un nuovo allegato, sulla risposta è presente l'header location che consente\
        \ di effettuare l'upload del blob collegato ai metadati\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "postMetadataAllegatoAutorizzato"
      parameters:
      - name: "autorizzatoId"
        in: "path"
        description: "id dell'autorizzato"
        required: true
        type: "integer"
        format: "int64"
      - in: "body"
        name: "body"
        description: "Oggetto che contiene i metadati dell'allegato da inserire"
        required: true
        schema:
          $ref: "#/definitions/MetadataAllegatoAutorizz"
      responses:
        "201":
          description: "Successful response"
        "422":
          description: "Aggiornamento non riuscito"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
