---
swagger: "2.0"
info:
  description: "Il servizio fornisce le API per l'accesso al regolamento di scelta\n\
    \n## ChangeLog\n\nVersione       | Versione di Esse3 di rilascio | Interventi\
    \ \n-              | -                             | -\n    1.1.0      | 18.02.00.00\
    \                   | aggiunto il campo opzionale dataUltimaModifica al RegolamentoDiScelta\
    \ e il relativo parametro di filtro su /regsce    \n  \n"
  version: "1.1.0"
  title: "ESSE3 Regolamento di Scelta API"
basePath: "/regsce-service-v1"
tags:
- name: "regolamento"
  description: "informazioni sulla testata dei regolamenti"
- name: "massivo"
  description: "recuperi massivi dei regolamenti"
- name: "finestra"
  description: "informazioni sulle finestre di compilazione"
- name: "schema di piano"
  description: "informazioni sugli schhemi di piano"
- name: "regola"
  description: "informazioni sulle regole di scelta"
- name: "piano"
  description: "informazioni sui piani di studio collegati alle regole"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
paths:
  /regsce:
    get:
      tags:
      - "regolamento"
      summary: "informazioni di testata sul regolamento di scelta"
      description: "Recupera gli oggetti `RegolamentoDiScelta`  \nE' necessario valorizzare\
        \ almeno un filtro tra quelli presenti per poter effettuare il recupero dati\n\
        \n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa\
        \ di configurazione, la variazione è molto lenta, cache Http abilitata, cache\
        \ server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-public-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        ALL|Funzione Pubblica|Security.checkDummy()\n\n\nClasse di modello : RegolamentoDiScelta\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        regsceId|primaryKey\ndataUltimaModifica|optional\ndataInserimento|optional\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getRegolamentiDiScelta"
      parameters:
      - name: "statoRegsce"
        in: "query"
        description: "stato del regolamento di scelta, se non valorizzato vengono\
          \ recuperati i regolamenti attivi"
        required: false
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
        enum:
        - "A"
        - "B"
        - "X"
      - name: "facId"
        in: "query"
        description: "id della facoltà di afferenza del regolamento"
        required: false
        type: "integer"
        format: "int64"
      - name: "facCod"
        in: "query"
        description: "codice della facoltà di afferenza del regolamento"
        required: false
        type: "string"
      - name: "cdsId"
        in: "query"
        description: "id della corso di studio di afferenza del regolamento"
        required: false
        type: "integer"
        format: "int64"
      - name: "cdsCod"
        in: "query"
        description: "codice del corso di studio di afferenza del regolamento"
        required: false
        type: "string"
      - name: "aaOrdId"
        in: "query"
        description: "anno di ordinamento"
        required: false
        type: "integer"
        format: "int64"
      - name: "aaRevisioneId"
        in: "query"
        description: "anno di revisione"
        required: false
        type: "integer"
        format: "int64"
      - name: "tipoCorsoCod"
        in: "query"
        description: "codice del tipo di corso di afferenza del regolamento"
        required: false
        type: "string"
      - name: "coorte"
        in: "query"
        description: "coorte di afferenza del regolamento"
        required: false
        type: "integer"
        format: "int64"
      - name: "daDataMod"
        in: "query"
        description: "data di ultima modifica, verranno recuperati tutti i record\
          \ inseriti con data di ultima modifica successiva a questa data"
        required: false
        type: "string"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/RegolamentoDiScelta"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
