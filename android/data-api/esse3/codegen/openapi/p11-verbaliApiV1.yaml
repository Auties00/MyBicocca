  /verbali:
    get:
      tags:
      - "verbale"
      summary: "Recupero dei verbali presenti a sistema"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera i verbali di uno studente, è obbligatorio\
        \ uno dei due parametri (matricolaStu, codFisStu) gli altri sono opzionali\n\
        \n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE|Controlla\
        \ che il docente possa accedere ai verbali con i filtri impostati|SecurityCarrieraStudente.findVerbaleDoc(matricolaDoc,\
        \ codFisDoc, matricolaStu, codFisStu, statoVerbale, adCod, cdsCod, adStuCod,\
        \ cdsStuCod, daData, aData)\n\n**Utente: STUDENTE**\n\nProfilo|Controllo|\
        \ Funzione\n-|-|-\nSTUDENTE|Controlla che lo studente possa accedere ai verbali\
        \ con i filtri impostati|SecurityCarrieraStudente.findVerbaleStu(matricolaDoc,\
        \ codFisDoc, matricolaStu, codFisStu, statoVerbale, adCod, cdsCod, adStuCod,\
        \ cdsStuCod, daData, aData)\n\n\nClasse di modello : VerbaleRoot\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nlottoId|primaryKey\n\
        verbId|primaryKey\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\
        \nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "findVerbali"
      parameters:
      - name: "matricolaStu"
        in: "query"
        description: "matricola dello studente per il quale cercare i lotti"
        required: false
        type: "string"
      - name: "matricolaDoc"
        in: "query"
        description: "matricola del docente per il quale cercare i lotti"
        required: false
        type: "string"
      - name: "codFisStu"
        in: "query"
        description: "matricola dello studente per il quale cercare i lotti"
        required: false
        type: "string"
      - name: "codFisDoc"
        in: "query"
        description: "matricola del docente per il quale cercare i lotti"
        required: false
        type: "string"
