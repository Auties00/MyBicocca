---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per la visualizzazione dei verbali e l'import di\
    \ verbali dall'esterno.\n\n## Nomenclatura\n* **VERBALE** : rappresenta il singolo\
    \ statino con l'esito di un esame di uno studente \n* **LOTTO** : rappresenta\
    \ una aggregazione di verbali rispetto al momento di generazione degli stessi.\
    \ \n  _(Esempio: un lotto relativo ad un appello contiene l'insieme dei verbali\
    \ degli studenti della iscrtti)_\n* **BATCH** : rappresenta una aggregazione di\
    \ verbali rispetto al momemnto dell'acquisizione da parte di in sistema esterno\
    \ \n  _(Esempio: dato un lotto di verbali di un appello è possibile acquisire\
    \ gli esiti in differenti momenti tramite Batch differenti)_\n\nIn fase di importazione\
    \ è possibile utilizzare due differenti approcci \n\n* **Aggiornamento** (AGG):\
    \ In questo caso i verbali sono già presenti a sistema (generati con la funzione\
    \ Stampa verbali di Esse3) e possono essere collegati ad una singola prenotazione\
    \ di uno studente (verbale nominale) oppure prevedere la possibilità di inserire\
    \ anche i dettagli dello studente (verbale anonimo). E' necessario specificare\
    \ il numero di verbale da aggiornare. Una volta che l'aggionrnamento è stato effettuato\
    \ non è possibile più effettuare un secondo aggiornamento per il medesimo numero\
    \ di verbale\n* **Inserimento** (INS): In questo caso i verbali NON sono presenti\
    \ a sistema, ogni chiamata con i medesimi dati effettua la creazione di un nuovo\
    \ verbale con un numero differente. Occorre passare i dati dello studente e i\
    \ dati di verbalizzazione.\n\n## Workflow\nPer i dettagli del processo di gestione\
    \ degli appelli e dei verbali è possibile consultare la documentazione presente\
    \ su [wiki](https://wiki.u-gov.it/confluence/display/ESSE3/Verbalizzazione)\n\n\
    Per quanto rigurada l'import dei verbali il processo si divide in due step, il\
    \ primo è obbgligatorio e il secondo facoltativo.\n\n1. _Caricmaneto dei metadati\
    \ dei verbali_: Va invocato l'enpoint `PUT /batches` per effettuare il caricamento\
    \ dei dati dei verbali.  \n  Il JSON passato nel body contiene, oltre ad altre\
    \ informazioni, un array con i metadati di ogni singolo verbale; In ogni oggetto\
    \ verbale è possibile indicare se oltre i metadati del file deve essere caricato\
    \ anche il blob con l'immagine del verbale stesso indicando il nome del file da\
    \ caricare.  \n  Nella reponse del metodo viene restituito un oggetto che contiene\
    \ la lista con i dati aggiornati dei verbali, per ogni verbale su cui è stato\
    \ richiesto l'upload del file viene fornito un url di caricamento sul quale effettuare\
    \ l'ulpload.  \n  I verbali con Blob pendente hanno impostato il campo stato_Warn\
    \ = 1  (in attesa di sblocco del warning) e il warn_num = 1 (mancanza dell'immagine\
    \ del verbale). Pertanto per effettuare il caricamento occorre eseguire il pnto\
    \ 2 oppure sbloccare l'acquisizione da Acquisizione verbali di Esse3.\n2. _Caricamento\
    \ dei BLOB dei verbali_: tramite il campo `uploadUrl` del verbale presente nella\
    \ responnse è possibile effettuare il caricamento del blob. Viene utilizzato il\
    \ servizio `PUT /batches/upload/{uploadId}/blob` per effettuare il caricamento.\
    \ Al caricamento corretto del blob viene sbloccata l'acquisizione del verbale\
    \ e cancellato l'url di upload che non risulta più disponibile\n \n## ChangeLog\n\
    \nVersione       | Versione di Esse3 di rilascio | Interventi \n -           \
    \  | -                             | -\n    1.0.0      | 20.01.00.00         \
    \          | prima versione\n    \n    \n"
