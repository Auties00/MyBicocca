        \ : VerbaleRoot\n======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n\
        -|-|\nlottoId|primaryKey\nverbId|primaryKey\n\n\nClasse di modello : VerbaleRoot\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        lottoId|primaryKey\nverbId|primaryKey\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n"
