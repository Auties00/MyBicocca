    post:
      tags:
      - "batch"
      summary: "import dei verbali"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Inserimento dei metadati di import dei verbali.\
        \  \nIl body da creare contiene: \n\n* il tipo di import da effettuare (INS\
        \ | AGG)\n* i dati del batch da importare (facoltativi)\n* la lista dei verbali,\
        \ va popolata la lista relativa al tipo di import richiesto  \n  INS ==> verbaliInserimento\
        \  \n  AGG ==> verbaliAggiornamento\n\n## Esito\nGli esiti sono definiti dalla\
        \ coppia di valori del verbale `(voto,causale)` \n\n\n TIPO ESITO        |\
        \ VOTO  | CAUSALE\n -                 | -     | -\n voto numerico     | voto\
        \  | null\n IDONEO            | 999   | null\n NON IDONEO        | -1    |\
        \ null\n INSUFFICIENTE     | 994   | null\n SUFFICIENTE       | 998   | null\n\
        \ DISCRETO          | 997   | null\n BUONO             | 996   | null\n OTTIMO\
        \            | 995   | null\n ASSENTE           | 0     | 2\n Ritirato/Respinto\
        \ | 0     | 1\n\nPer i dettagli di tutti i possibili valori è possibile consultare\
        \ la tabella tipi_Giudizio di esse3. I campi verbale_decode_voto e verbale_decode_causale\
        \ contengono i valori da utilizzare.\n\n## Modifiche su sistemi esterni\n\
        L'insieme correzioni consente di indicare le possibili modifiche effettuare\
        \ durante la fase di acquisizione degli esiti (nel caso di lettura ottica)\
        \ che l'operatore ha effettuato perchè l'esito o qualche altra informazione\
        \ non risultava corretta. \nVegnono riportati i valori più comuni della proprietà\
        \ campo\n \n CAMPO    |  DESCRIZIONE\n -        | -\n NOME     | Nome dello\
        \ studente\n COGNOME  | Cognome dello studente\n MAT      | Matricola dello\
        \ studente\n VOTO     | Voto esame\n CAUSALE  | Causale di non verbalizzazione\n\
        \ NUMERO   | Numero del verbale\n AD_COD   | Codice dell'AD del lotto\n AD_DES\
        \   | Descrizione dell'AD del lotto\n DATA_APP | Data dell'appello\n DATA_ESA\
        \ | Data dell'esame\n\nI possibili campi sui quali è possibile registrare\
        \ la modifica sono definiti nella tabella TIPI_VERB_CAMPO_LOG\n## Inserimento\n\
        In questa modalità vegnono creati differenti verbali ad ogni invocazione (anche\
        \ se i dati sono i medesimi)  \nI verbali hanno dei campi obblogatori che\
        \ sono esplicitati in chiaro e dei campi facoltativi che sono utilizzati in\
        \ casi particolari, questi sono popolati con la coppia nome,valore nell'insieme\
        \ campiAggiuntivi  \nNel campo verbaliErrati vengono inseriti i verbali la\
        \ cui creazione è fallita.\n## Aggiornamento             \nIn questa modalità\
        \ i verbali devono essere già creati all'interno di esse3 e l'aggiormaneto\
        \ viene effettuato solo la prima volta.  \nNel campo verbaliErrati vegnono\
        \ inseriti i verbali che presentano erroriu durante  l'importazione. \n\n\n\
        **Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
