    type: "object"
    properties:
      typeId:
        type: "integer"
        format: "int32"
        example: 1
        description: "tipologia dell'allegato"
      typeCod:
        type: "string"
        example: "P"
        description: "codice della tipologia dell'allegato"
      downloadSupported:
        type: "integer"
        format: "int32"
        example: 1
        description: "indica se l'allegato supporta il download"
        minimum: 0.0
        maximum: 1.0
      uploadSupported:
        type: "integer"
        format: "int32"
        example: 1
