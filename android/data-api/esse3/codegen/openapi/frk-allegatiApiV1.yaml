swagger: "2.0"
info:
  description: "Il servizio consente di effettuare l'upload e il download degli allegati\n\
    \n\n## Tipologie Allegati\nGli allegati attualmente supportati sono i seguenti\n\
    \nTiplogia Allegato| Descrizione                        | chiavi collegamento\
    \ | Upload      | Downoload \n-                | -                           \
    \       | -                   | -           | -\nDOM_TIRO         | Allegati alle\
    \ domande di tirocinio | domTiroId           | Si          | Si\n\nLe tipologie\
    \ disponibili sono visibili attraverso l'endpoint `/allegati`\n\n## Processo di\
    \ upload\nIl processo di upload si divide in due step\n* _la prima fase consiste\
    \ nel caricare i metadati collegati all'allegato stesso._  \n  Per questa operazione\
    \ è possibile utilizzare un enpoint specifico (fornito da un servizio applicativo\
    \ specifico) oppure utilizzare l'endpoint generico `/allegati/{tipoAllegato}'\
    \ con il metodo POST  \n  In risposta il metodo fornisce un HEADER Location con\
    \ l'url dove effettuare l'upload del blob    \n* _la secoda fase consiste nell'effettuare\
    \ l'upload del BLOB_  \n  Il passo precedente fornisce (nell'header location)\
    \ l'url dove deve essere effettuata la PUT (`/upload/{uploadId}/blob`)\n  \n**NB**:\
    \  \nIl processo di Upload si conclude al secondo passo : cioè l'inserimento dei\
    \ metadati NON provoca il salvataggio di nessuna informazione nellte tabelle applicative\n\
    \    \n## Processo di Download\nIl processo di download divide i metadati dal\
    \ blob\n* i metadati sono disponibili su `/allegati/{tipoAllegato}/{allegatoId}`\n\
    * il blob è disponibile su `/allegati/{tipoAllegato}/{allegatoId}/blob`\n"
  version: "1.0.0"
  title: "Allegati API"
basePath: "/allegati-service-v1"
tags:
- name: "allegati"
  description: "Informazioni sul download degli allegati e sui relativi metadati"
- name: "upload"
  description: "Informazioni sul processo di upload dei blob"
