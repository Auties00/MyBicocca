  /offerte/attivita/cancellabile:
    get:
      tags:
      - "offerta"
      summary: "Indica se una AD risulta cancellabile."
      description: "Indica se una AD risulta cancellabile recuperando un oggetto di\
        \ tipo 'ADCancellabile'.\nE' necessario specificare almeno un parametro.\n\
        ##### Codici di ritorno della funzione\nCodice di Ritorno | Descrizione\n\
        \ -                | -\n 0                | AD non presente, quindi cancellabile\n\
        \ 1                | AD cancellabile\n 2                | AD presente nei\
        \ libretti (P11_AD_SCE)\n 3                | AD/UD presente nella definizione\
        \ appelli (P10_APP)\n 4                | AD presente nell'abilitazione docenti\
        \ per appelli (P10_ABIL_DOC)\n 5                | AD presente nel registro\
        \ docente (P09_REG_DOC)\n 6                | AD presente nei raggruppamenti\
        \ di AD utilizzati per pianificare calendario esami (P10_INSIEME_AD)\n 7 \
        \               | AD presente in piani A,P,V e che l'ad sia erogata (P11_AD_PIANI)\n\
        \ 8                | AD presente nell'anagrafica tesi e tesine presentate\
        \ dagli studenti (P12_TESI)\n 9                | AD padre di un esame comune\
        \ (P09_AD_ESACOM)\n \n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|configuration|Risorsa di configurazione, la variazione\
        \ è molto lenta, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getOffADCancellabile"
      parameters:
      - name: "afId"
        in: "query"
        description: "af_id di U-Gov"
        required: false
        type: "integer"
        format: "int64"
      - name: "aaOffId"
        in: "query"
        description: "identificativo dell'anno di offerta"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "cdsCod"
        in: "query"
        description: "codice del corso di studio"
        required: false
        type: "string"
      - name: "aaOrdId"
        in: "query"
        description: "Id dell'ordinamento"
        required: false
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "pdsCod"
        in: "query"
        description: "codice del percorso di studio"
        required: false
        type: "string"
      - name: "adCod"
        in: "query"
        description: "codice dell'attivita didattica"
        required: false
        type: "string"
      - name: "udCod"
        in: "query"
        description: "codice dell'unità didattica"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/ADCancellabile"
        "422":
          description: "errore"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
