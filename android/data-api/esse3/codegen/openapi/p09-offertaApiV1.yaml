---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso all''offerta didattica\n## ChangeLog\n\
    Versione       | Versione di Esse3 di rilascio | Interventi \n -             |\
    \ -                             | -\n    1.1.0      | 19.03.03.00            \
    \       | aggiunto il metodo /offerte/{aaOffId}/{cdsOffId}/attivita/cancellabile\
    \ \n    1.1.0      | 19.03.03.00                   | aggiunto il metodo /offerte/{aaOffId}/{cdsOffId}/moduli/cancellabili\
    \ \n    1.2.0      | 19.04.01.00                   | **deprecati** i metodi **/docenti**\
    \ e **/docentiFull** utilizzare gli analoghi su anagrafica-service-v2\n"
  version: "1.2.0"
  title: "ESSE3 Offerta API"
basePath: "/offerta-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
paths:
  /ad-raggruppate:
    get:
      tags:
      - "raggruppamenti"
      summary: "Recupera i raggruppamenti delle AD."
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>recupera i raggruppamenti delle AD con i dettagli\
        \ dell'attività 'padre' e delle sue attività 'figlie'. Il parametro **annoCoorte**\
        \ è obbligatorio, mentre **cdsCod** e **adCod** sono opzionali, si riferiscono\
        \ ai campi dell'attività 'padre' ed è possibile applicare un filtro di tipo\
        \ LIKE.\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|noCache|Nessuna\
        \ cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-massive-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nUserTecnicoMassivo|funzione massiva riservata ad utenti tecnici autorizzati|Security.checkMassiveGET()\n\
        \n\nClasse di modello : ADGruppoPadre\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nadragoffId|primaryKey\n\n\nClasse\
        \ di modello : ADGruppiFiglio\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nadragoffId|primaryKey\n\n\nClasse di modello\
        \ : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getADRaggruppate"
      parameters:
      - name: "annoCoorte"
        in: "query"
        description: "anno coorte"
        required: true
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "cdsCod"
        in: "query"
        description: "codice del corso di studio"
        required: false
        type: "string"
      - name: "adCod"
        in: "query"
        description: "codice dell'attivita didattica"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ADGruppoPadre"
        "422":
          description: "errore"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      security:
      - basicAuth: []
      - jwt:
        - "openid"
      x-enabled-profiles:
      - user-tecnico-massive-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UserTecnicoMassivo"
              description: "funzione massiva riservata ad utenti tecnici autorizzati"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkMassiveGET"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-streaming-output: "chunk_size_10"
      x-cache-type: "noCache"
  /attivitaGeneriche:
    get:
      tags:
      - "offerta"
      summary: "Recupera le informazioni delle attivita didattiche generiche. I parametri\
        \ opzionali filtrano una AD qualsiasi."
      description: "recupera la lista degli oggetti 'ADGenerica'. I parametri opzionali\
        \ *start* e *limit* consentono di paginare i risultati.\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|configuration|Risorsa\
        \ di configurazione, la variazione è molto lenta, cache Http abilitata, cache\
        \ server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-public-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        ALL|Funzione Pubblica|Security.checkDummy()\n"
      operationId: "getADGeneriche"
      parameters:
      - name: "adId"
        in: "query"
        description: "id dell'attivita didattica"
        required: false
        type: "integer"
        format: "int64"
      - name: "adCod"
        in: "query"
        description: "codice dell'attivita didattica"
        required: false
        type: "string"
      - name: "adDes"
        in: "query"
        description: "descrizione  dell'attivita didattica (se viene utilizzato il\
          \ carattere * viene applicato il like)"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ADGenerica"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
