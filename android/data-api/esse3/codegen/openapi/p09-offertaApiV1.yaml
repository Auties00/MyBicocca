securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  ADContestualizzata:
    type: "object"
    required:
    - "chiaveAdContestualizzata"
    discriminator: "adContestualizzataType"
    properties:
      chiaveAdContestualizzata:
        $ref: "#/definitions/ChiaveADContestualizzata"
      adDesEng:
        type: "string"
        example: "Esempio di PDS AD"
        description: "descrizione dell''attività didattica in inglese"
      cdsDesEng:
        type: "string"
        example: "Esempio di CDS AD"
        description: "descrizione del corso di erogazione dell'attività didattica\
          \ in inglese"
      aaOrdDesEng:
        type: "string"
        example: "Esempio di CDS AD"
        description: "descrizione dell''ordinamento di erogazione dell'attività didattica\
          \ in inglese"
      pdsDesEng:
        type: "string"
        example: "Esempio di PDS AD"
        description: "descrizione del percorso di erogazione dell'attività didattica"
      linguaInsDes:
        type: "string"
        example: "inglese"
        description: "lingua di insegnamento dell'attivita didattica usata per ECTS"
      linguaInsDesEng:
        type: "string"
        example: "inglese"
        description: "lingua di insegnamento dell'attivita didattica in inglese"
      nonErogabileOdFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "attività non erogabile. \nSe = 1 indica che per questa attività\
          \ NON vanno tenute in considerazione le partizioni (classi) della p09_ad_log\
          \ \nnei processi della carriera ovvero nel libretto studente non viene mai\
          \ assegna la partizione (classe) per questa attivita\n"
        minimum: 0.0
        maximum: 1.0
      tipoEsaCod:
        type: "string"
        example: "S"
        description: "codice del Tipo di esame"
      tipoEsaDes:
        type: "string"
        example: "scritto"
        description: "descrizione del Tipo di esame"
      tipoEsaDesEng:
        type: "string"
        example: "wrote"
        description: "descrizione del Tipo di esame in inglese"
      tipoValCod:
        type: "string"
        example: "V"
        description: "codice del Tipo di valutazione"
      tipoValDes:
        type: "string"
        example: "voto"
        description: "descrizione del Tipo di valutazione"
      tipoValDesEng:
        type: "string"
        example: "grade"
        description: "descrizione del Tipo di valutazione in inglese"
      tipoInsCod:
        type: "string"
        example: "FON, CAR"
        description: "codice del Tipo di insegnamento. Valido solo per i CDS ante\
          \ riforma"
      tipoInsDes:
        type: "string"
        example: "fondamentale"
