        x-field-type: "optional"
      sceltaId:
        type: "integer"
        format: "int64"
        example: 1234
        description: "id univoco della regola di scelta"
        x-field-type: "optional"
      sceltaAdId:
        type: "integer"
        format: "int32"
        description: "id univoco dell'attività dalle regole di scelta scelta durante\
          \ la compilazione del piano"
      chiaveADContestualizzata:
        $ref: "#/definitions/ChiaveADContestualizzata"
      adsceId:
        type: "integer"
        format: "int64"
        example: 1234
        description: "id univoco dell'attività del libretto. \nViene valorizzato se\
          \ l'attività deriva da tesoretto oppure è stata preselezionata durante la\
          \ compilazione del piano\n"
        x-internal-name: "adsce_presel_id"
      adsceAttId:
        type: "integer"
        format: "int64"
        example: 1234
        description: "id univoco dell'attività del libretto. \nviene valorizzato quando\
          \ il piano risulta approvato e attuato ed la riga di piano è collegata al\
          \ libretto\n"
      sceltaFlg:
        type: "integer"
        format: "int32"
        example: 1
