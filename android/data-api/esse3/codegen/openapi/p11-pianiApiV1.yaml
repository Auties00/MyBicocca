        example: 0
        description: "lode"
        minimum: 0.0
        maximum: 1.0
      tipoGiudCod:
        type: "string"
        example: "IDO"
        description: "codice tipo di giudizio"
      tipoGiudDes:
        type: "string"
        example: "Idoneità"
        description: "descrizione tipo di giudizio"
      ricId:
        type: "integer"
        format: "int32"
        example: 0
        minimum: 0.0
        maximum: 4.0
      tipoRicCod:
        type: "string"
