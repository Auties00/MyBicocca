    post:
      tags:
      - "piano"
      summary: "Inserisce un nuovo piano di studio"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Consente di inserire un nuovo piano\n\n #####\
        \ Parametri in ingresso\nCampo                         | Obbligatorio    \
        \                | Note \n-                             | -              \
        \                   | - \ntipo                          |  Si            \
        \     | Sono gestiti solo i piani di tipo I - Individuale\nstato         \
        \                |  Si                 | Il piano può essere Approvato (A)\
        \ oppure proposto (P)\nattuaFlg                      |  Si               \
        \  | Esegue l'attuazione del piano (solo se lo stato è A)\nannullaPianoValidoFlg\
        \         |  Si                 | Annulla l'eventuale piano valido (stato\
        \ A,P,V) prima di validare quello appena inserito\nTipoOrigModTaf        \
        \        |  Si                 | Applica il regolamento RAD oppure OFFF per\
        \ la validazione delle triplette TAF,AMB,SETT per verificare la laureabilità\
        \ del piano\npdsSceCod                     |  No                 | Indica\
        \ il percorso del piano nel caso lo studente debba effettuare una scelta del\
        \ percorso prima di attuare il piano, se null viene considerato il percorso\
        \ dello studente\nregole.*                      |  No                 | Le\
        \ regole sono opzionali  \nattivita.*                    |  Si           \
        \      | Le attività sono obbligatorie, possono essere collegate alle regole\
        \ tramite il campo ordNum\nattivita.itmPadreId           |  No           \
        \      | Utilizzato per indicare il collegamento tra le attività di un raggruppamento.\
        \ Il padre del raggruppamento è caratterizzato da itmId = itmPadreId\nattivita.annoCorso\
        \            |  Si                 | Il campo è recuperato dalla regola se\
        \ valorizzato l'ordNum altrimenti viene letto il valore presente nel corrispettivo\
        \ campo dell'attività\nattivita.annoCorsoAnticipo    |  No               \
        \  | Il campo è recuperato dalla regola se valorizzato l'ordNum altrimenti\
        \ viene letto il valore presente nel corrispettivo campo dell'attività\nattivita.sovranFlg\
        \            |  No                 | Il campo è recuperato dalla regola se\
        \ valorizzato l'ordNum altrimenti viene letto il valore presente nel corrispettivo\
        \ campo dell'attività\nattivita.cdsAdCod<br/>attivita.ordAdId<br/>attivita.pdsAdCod<br/>attivita.aaOffAdId<br/>attivita.adCod<br/><br/>attivita.adsce_id\
        \ |    | E' richiesta la valorizzazione della chiave dell'offerta oppure della\
        \ adsceId per indicare l'origine dell'attività. L'unico caso un cui non è\
        \ richiesta la valorizzazione dei campi è per le attività figlie di un raggruppamento\
        \ dei dottorati.  \nattivita.tipoInsAdPadreDottorato | No               |\
        \ Nel caso di raggruppamento di tipo dottorati il padre deve avere valorizzato\
        \ il campo tipoIns con un raggruppament di tipo dottorato\nattivita.adDottorati\
        \          |  No                 | Valorizzato per i figli di raggruppamento\
        \ di tipo dottorati, nullo per gli altri\n\n##### Codici di ritorno della\
        \ funzione\nCodice di Ritorno | Descrizione\n-                 | -\n-1  |\
        \ Errore nel passaggio dei parametri\n-2  | Errore durante l'annullamento\
        \ del piano valido\n-3  | Errore durante l'impostazione dello stato del piano\
        \ richiesto\n-101 | L'ordNum con valore XX risulta duplicato nelle regole\n\
        -102 | Lo scePianoId con valore XX risulta duplicato nelle regole\n-103 |\
        \ Il tipUnt per la regola con ordNum XX non è valido, deve essere uno tra\
        \ CFU,BLK,ANN invece risulta YY\n-104 | Il tipSce per la regola con ordNum\
        \ XX non è un valore accettabile = YY\n-105 | Il tipoAfCod per la regola con\
        \ ordNum XX non è un valore accettabile = YY\n-106 | MaxUnt deve esser maggiore\
        \ o uguale di minUn per la regola con ordNum XX invece maxUnt = YY e minUnt\
        \ = ZZ\n-107 | L'ordNum con valore XX ha un l'anno di corso che è maggiore\
        \ o uguale dell'anno di corso di anticipo\n-200 | L'itmId con valore XX risulta\
        \ duplicato nelle Ad\n-201 | L'itmId con valore XX ha un itmPadreId YY che\
        \ non punta a nessuna AD presente\n-202 | L'itmId con valore XX ha un itmPadreId\
        \ YY che punta a più AD presenti\n-203 | L'itmId con valore XX ha un ordNum\
        \ YY che non punta a nessuna regola presente\n-204 | L'itmId con valore XX\
        \ ha un ordNum YY che  punta a più regole presenti\n-205 | L'itmId con valore\
        \ XX ha un l'anno di corso che è maggiore o uguale dell'anno di corso di anticipo\n\
        -206 | Il tipoAfCod per l'ad con itmId XX non è un valore accettabile = YY\n\
        -207 | Errore nel recupero dei dati dell'offerta per la riga con itmId XX\
        \ (l'offerta è attiva?)\n-209 | La riga con itmId XX ha un valore di adsceId\
        \ YY non esistente\n-210 | La riga con itmId XX ha un valore di adsceId YY\
        \ non relativo alla matId dello studente\n-211 | La riga con itmId XX ha un\
        \ valore di tipoInsCodPadreDottorati non valido YY\n-212 | La riga con itmId\
        \ XX prevede il campo dottorati ma la regola collegata non è di tipo dottorato\n\
        -213 | La riga con itmId XX ha un valore di tipoInsCod non valido YY\n-214\
        \ | Errore nel calcolo del peso dall'offerta per l'itmId con valore YY\n-215\
        \ | Errore nel calcolo del peso dal libretto per l'itmId con valore YY\n-216\
        \ | Errore nel recupero delle informazioni del padre del raggruppamento per\
        \ l'itmId con valore XX\n-217 | La riga con itmId XX ha un valore di nazioneCod\
        \ non valido YY\n-218 | Errore nel calcolo del peso dal libretto per l'itmId\
        \ con valore YY (non sono valorizzati ne' adsceId ne' chiave offerta)\";\n\
        -219 | L'itmId con valore XX non è associato a nessuna regola e non ha l'anno\
        \ di corso valorizzato\n-220 | L'itmId con valore XX prevede il campo dottorati\
        \ ma la regola collegata non è di tipo dottorato\n-221 | \"La riga con itmId\
        \ XX prevede il campo dottorati ma è il padre del raggruppamento che non può\
        \ avere gli attributi del dottorato valorizzati che sono riservati solo alle\
        \ ad figlie\"\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|midRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ media, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "postPianoStudente"
      parameters:
      - name: "stuId"
        in: "path"
        description: "id della carriera dello studente"
        required: true
        type: "integer"
