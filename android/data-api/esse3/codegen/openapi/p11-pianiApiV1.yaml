securityDefinitions:
  basicAuth:
    description: "Autenticazione tramite BASIC authentication. Questa modalità è disponibile\
      \ se l'autenticazione su esse3 non usa shibboleth per il gruppo dell'utente"
    type: "basic"
  jwt:
    description: "Autenticazione tramite OAUTH2, occorre configurare il parametro\
      \ di configurazione di ESSE3 che indica il server OAUTH2 da utilizzare"
    type: "oauth2"
    authorizationUrl: "https://idp-idm.unimib.it/idp/profile/oidc/authorize"
    flow: "implicit"
    scopes:
      openid: "informazioni sull'utente"
definitions:
  PostPianoRegola:
    type: "object"
    required:
    - "annoCorso"
    - "des"
    - "maxUnt"
    - "minUnt"
    - "opzFlg"
    - "ordNum"
    - "sovranFlg"
    - "tipoRegola"
    - "unitaMisura"
    properties:
      ordNum:
        type: "integer"
        format: "int32"
        example: 1
        description: "numero della regola"
        minimum: 1.0
        maximum: 999.0
      des:
        type: "string"
        example: "Esami Obbligatori"
        description: "descrizione libera della regola"
      annoCorso:
        type: "integer"
        format: "int32"
        example: 1
        description: "anno di corso della regola"
        minimum: 1.0
        maximum: 999.0
      annoCorsoAnticipo:
        type: "integer"
        format: "int32"
        example: 1
        description: "anno di corso di anticipo della regola"
        minimum: 1.0
        maximum: 999.0
      unitaMisura:
        type: "string"
        example: "CFU"
        description: "tipo di unità di misura della regola. BLK=Blocchi, CFU=Crediti"
        pattern: "CFU|BLK|ANN"
      tipoRegola:
        type: "string"
        example: "F"
        description: "Tipo di regola da creare nel piano, per la validazione vedere\
          \ la tabella TIPI_SCE"
      maxUnt:
        type: "integer"
        format: "int32"
        example: 10
        description: "massimo valore previsto per il vincolo della regola"
        minimum: 1.0
        maximum: 999.0
      minUnt:
        type: "integer"
        format: "int32"
        example: 1
        description: "minimo valore previsto per il vincolo della regola"
        minimum: 0.0
        maximum: 999.0
      opzFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "indica se la regola è opzionale"
        minimum: 0.0
        maximum: 1.0
      sovranFlg:
        type: "integer"
        format: "int32"
        example: 0
        description: "indica se la regola è sovrannumeraria"
        minimum: 0.0
        maximum: 1.0
      taf:
        type: "string"
        example: "D"
        description: "modificatore del TAF della regola. Per la validazione vedere\
          \ la tabella TIPI_AF"
      interateCodeUn:
        type: "string"
        example: "123"
        description: "codeUn dell'ateneo dove verranno erogate le attività didattiche\
          \ della regola"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  PostPianoAttivitaDottorati:
    type: "object"
    required:
    - "desAd"
    - "tipoInsCod"
    properties:
      desAd:
        type: "string"
        example: "Seminario del ginocchio"
        description: "descrizione dell'attività di tipo dottorato"
      tipoInsCod:
        type: "string"
        example: "DOTT"
        description: "tipo di insegnamento collegato alla attività figlia di regole\
          \ di dottorato, la validazione avviene sulla tabella TIPI_INS per le righe\
          \ con dottorato_flg =1"
      codCatNazione:
        type: "string"
        example: "Z500"
        description: "Codice catastale della nazione valida alla presentazione del\
          \ piano"
      dataPartenzaPrev:
        type: "string"
        example: "01/01/2024"
        description: "data di partenza dell'attività, obbligatoria per le attività\
          \ all'estero"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      dataArrivoPrev:
        type: "string"
        example: "01/02/2024"
        description: "data di arrivo dell'attività, obbligatoria per le attività all'estero"
        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      soggettoErogante:
        type: "string"
        example: "Università di Cambrige"
        description: "Soggetto che eroga l'attività"
      destinazione:
        type: "string"
        example: "Cambrige"
        description: "destinazione prevista"
      linkPubblicazioni:
        type: "array"
        description: "link ad eventuali pubblicazioni, previsto solo per le attività\
          \ di ricerca. I link sono inseriti uno per riga"
        items:
          type: "string"
          example: "http://www.google.com"
    description: "informazioni aggiuntive per le attività delle regole dottorati,\
      \ queste informazioni vanno collegate ad AD figlie di raggruppamenti di dottorato\
      \ (itmPadreId != null)"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  PutPianoInterateneoSedeOp:
    type: "object"
    required:
    - "attivita"
    - "attivitaInterateneo"
    - "pianiInterateneo"
    - "segmentiInterateneo"
    properties:
      attuaPiano:
        type: "boolean"
        example: true
        description: "indica se attuare il piano una volta sincronizzato"
      attivita:
        type: "array"
        items:
          $ref: "#/definitions/PostPianoAttivita"
      pianiInterateneo:
        type: "array"
        items:
          $ref: "#/definitions/PostPianoInterateneoTratto"
      attivitaInterateneo:
        type: "array"
        items:
          $ref: "#/definitions/PostPianoInterateneoAttivita"
      segmentiInterateneo:
        type: "array"
        items:
          $ref: "#/definitions/PostPianoInterateneoSegmento"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  EntitaDaAggiornare:
    type: "object"
    properties:
      entita:
        type: "string"
        example: "PIANO_INTERATE"
        description: "tipo di entità da aggiornare"
      interateId:
        type: "integer"
        format: "int32"
        example: 1
        description: "id del piano interateneo"
      itmId:
        type: "integer"
        format: "int32"
        example: 1
        description: "id dell'attività del piano (se previsto)"
      staPianoInterateCod:
        type: "string"
        example: "SYN"
        description: "stato del piano interateneo"
      staAdInterateCod:
        type: "string"
        example: "RIT"
        description: "stato dell'attività interateneo (se previsto)"
      dettstaAdInterateCod:
        type: "string"
        example: "DIFF"
        description: "dettaglio dello stato dell'attività interateneo (se previsto)"
      msg:
        type: "string"
        example: "errore durante l'aggiornamento - bla bla bla"
        description: "messaggio di dettaglio"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  PostPianoInterateneoTratto:
    allOf:
    - $ref: "#/definitions/PianoInterateneoTratto"
    - type: "object"
      required:
      - "interateId"
      - "regoleInterateneo"
      properties:
        interateId:
          type: "integer"
          format: "int32"
          description: "id del tratto di piano interateneo"
          minimum: 1.0
        regoleInterateneo:
          type: "array"
          items:
            $ref: "#/definitions/PostPianoInterateneoTrattoRegola"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  FiltroCdsOrCondition:
    type: "object"
    required:
    - "andConditions"
    properties:
      andConditions:
        type: "array"
        description: "lista delle condizioni in AND da applicare alla condizione in\
          \ OR"
        items:
          $ref: "#/definitions/FiltroCdsAndCondition"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  PianoInterateneoSegmentoWithDetails:
    allOf:
    - $ref: "#/definitions/PianoInterateneoSegmento"
    - type: "object"
      required:
      - "itmId"
      - "pianoId"
      - "segId"
      - "stuId"
      - "udId"
      properties:
        stuId:
          type: "integer"
          format: "int64"
          description: "id della carriera dello studente"
          x-field-type:
          - "primaryKey"
          - "excluded"
        pianoId:
          type: "integer"
          format: "int32"
          description: "progressivo del piano di studio per la carriera dello studente"
          x-field-type:
          - "primaryKey"
          - "excluded"
        itmId:
          type: "integer"
          format: "int32"
          example: 1
          description: "id della riga del piano alla quale si collegano le informazioni\
            \ dell'interateneo"
          minimum: 1.0
          x-field-type: "primaryKey"
        udId:
          type: "integer"
          format: "int64"
          example: 1
          description: "id del modulo nell'ateneo di offerta dell'attività"
          minimum: 1.0
          x-field-type: "primaryKey"
        segId:
          type: "integer"
          format: "int64"
          example: 1
          description: "id del segmento nell'ateneo di offerta dell'attività"
          minimum: 1.0
          x-field-type: "primaryKey"
    x-layout-name: "PIANI_INTERATE_SEG_REST"
    x-winsession-name: "p11/n_di_11_001_piano_carriera_web"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
