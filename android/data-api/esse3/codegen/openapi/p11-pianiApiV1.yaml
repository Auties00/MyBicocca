        pattern: "([0][1-9]|[12][0-9]|[3][01])/([0][1-9]|[1][012])/(19|20)([0-9]{2})"
      aaSupId:
        type: "integer"
        format: "int32"
        example: 1234
        description: "anno di superamento dell'attività prevista nell'ateneo di sostenimento\
          \ della attività"
        minimum: 1970.0
        maximum: 2100.0
      modValCod:
        type: "string"
        description: "modalità di valutazione dell'attività"
        pattern: "V|G"
      voto:
        type: "number"
        format: "float"
        example: 25.0
        description: "voto assegnato all'attività"
      lode:
        type: "integer"
