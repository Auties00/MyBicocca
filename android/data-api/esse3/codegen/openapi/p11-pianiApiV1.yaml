        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti `TrattoCarriera`\
        \ nei quali è possibile avere un piano di studio.  \n E' necessario valorizzare\
        \ almeno un filtro tra quelli presenti per poter effettuare il recupero dati\n\
        \n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|midRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza media, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: DOCENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nDOCENTE_PIANI|Permette\
        \ la visualizzazione dei piani per i corsi abilitati al docente per la valutazione\
        \ dei piani|SecurityCarrieraStudente.checkFilterResponsabilePiani(matricola,\
        \ cdsStuId, cdsStuCod, aaOrdStuId, pdsStuId, pdsStuCod, coorte, codiceFiscale,\
        \ staStuCod)\n\n**Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        STUDENTE|Permette la visualizzazone dei piani delle carriere dello studente|SecurityCarrieraStudente.checkFilterMatId(matricola,\
