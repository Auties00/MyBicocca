        \ staStuCod)\n\n\nClasse di modello : TrattoCarriera\n======\n\nEstensioni\
        \ sulle proprietà\n----\nProprietà | x-field-type\n-|-|\naaImm1|optional\n\
        tipoCorsoCod|optional\ntipoCorsoDes|optional\ndrCarr|optional\n\n\nClasse\
        \ di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
