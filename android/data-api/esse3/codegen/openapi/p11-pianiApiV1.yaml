      itmId:
        type: "integer"
        format: "int32"
        example: 12
        description: "progressivo dell'attività all'interno del piano di studio"
        x-field-type: "primaryKey"
      matId:
        type: "integer"
        format: "int64"
        example: 123
        description: "id del tratto di carriera a cui si riferisce il piano di studio"
