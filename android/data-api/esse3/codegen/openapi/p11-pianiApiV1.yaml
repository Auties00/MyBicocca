          \ le attività sono state selezionate (1) oppure no (0), per tutte le altre\
          \ regole vale 1"
        minimum: 0.0
        maximum: 1.0
      tesorettoFlg:
        type: "integer"
        format: "int32"
        example: 1
        description: "indica se l'attività didattica è derivante da tesoretto"
        minimum: 0.0
        maximum: 1.0
      ragId:
