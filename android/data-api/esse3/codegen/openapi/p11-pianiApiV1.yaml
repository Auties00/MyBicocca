        description: "tipo di riconoscimento nel caso di riconoscimento nella sede\
          \ operativa, valido solo se ric_id IN (1,2)"
      livelloLinguaCod:
        type: "string"
        example: "B2"
        description: "livello della lingua"
      linguaCod:
        type: "string"
        example: "ita"
        description: "codice della lingua in iso6392"
      tipoSvolgimentoEsameCod:
        type: "string"
        example: "si"
        description: "codice tipo svoltigemnto esame"
    x-model-sub-package: "piani.v1"
    x-model-sub-path: "piani/v1"
  ADPianoDiStudio:
    type: "object"
    properties:
      stuId:
        type: "integer"
        format: "int64"
        example: 12
        description: "id della carriera dello studente"
        x-field-type: "primaryKey"
      pianoId:
        type: "integer"
        format: "int32"
        example: 1
        description: "progressivo del piano di studio per la carriera dello studente"
        x-field-type: "primaryKey"
      scePianoId:
        type: "integer"
        format: "int32"
        example: 1
        description: "progressivo della regola a cui fa riferimento l'attività interno\
