        description: "Voto minimo di esame, ovvero il punteggio minimo per essere\
          \ valido un esame.\nPer i corsi post riforma il valore è fisso a 18, infatti\
          \ viene stabilito dal decreto 509/99.\nPer i corsi definiti prima della\
          \ Riforma il valore è variabile e deve essere valorizzato.\n"
      maxPuntiEsa:
        type: "integer"
        example: 30
        description: "Base voto esami, ovvero il punteggio massimo di un singolo esame.\n\
          Per i corsi post riforma il valore è fisso a 30, infatti viene stabilito\
          \ dal decreto 509/99.\nPer i corsi definiti prima della Riforma il valore\
          \ è variabile e deve essere valorizzato.\n"
      genAdVerbFlg:
        type: "integer"
        example: 1
        description: "Indicatore utilizzato in fase di verbalizzazione, consente la\
          \ generazione automatica delle attività didattiche nel libretto\n0 - generazione\
          \ non abiltata\n1 - generazione abilitata\n2 - generazione abilitata solo\
          \ per le attività didattiche presenti nel piano ma non nel libretto\n"
        x-field-type: "optional"
      autoSovrSFlg:
        type: "integer"
        example: 1
        description: "Indicatore utilizzato durante attuazione piani se = 1 inserisce\
          \ nel libretto le atttività fuori piano come sovranumerarie. (Valido solo\
          \ per le AD con stato S)"
        x-field-type: "optional"
      autoSovrFFlg:
        type: "integer"
        example: 1
        description: "Indicatore utilizzato durante attuazione piani se = 1 inserisce\
          \ nel libretto le atttività fuori piano come sovranumerarie. (Valido solo\
          \ per le AD con stato F)"
        x-field-type: "optional"
      freqObblFlg:
        type: "integer"
        example: 1
        description: "Indica se la frequenza è obbligatoria."
        x-field-type: "optional"
      autoFreqFlg:
        type: "integer"
        example: 1
        description: "Indicatore utilizzato durante inserimento attività nel libretto\
          \ e attuazione del piano: il sistema mette in automatico a Frequentato le\
          \ attività del libretto, ovvero P11_AD_SCE.STA_SCE_COD = 'F', se si verificano\
          \ le seguenti condizioni: anno di corso attività del piano/libretto =anno\
          \ di corso ultima iscrizione attiva dello studente (P11_AD_PIANI.ANNO_CORSO\
          \ = P04_ISCR_ANN.ANNO_CORSO)"
        x-field-type: "optional"
      acScelta:
        type: "integer"
        example: 2025
        description: "Indica l'anno di corso in cui deve essere effettuata la scelta\
          \ di un PDS diverso da quello comune (PDS_ID = 9999). Valorizzato se ordinamento\
          \ suddiviso IN percorsi (flag PDS_FLG = 1), IN tal caso deve essere > 1\
          \ e < durata anni del corso"
      pdsFlg:
        type: "integer"
        example: 1
        description: "Indica se l´ordinamento è suddiviso in percorsi, tabella P06_PDSORD.\
          \ Se previsto solo il percorso comune (PDS_ID=9999) allora PDS_FLG = 0"
      cdsExt:
        type: "string"
        example: "xyz"
        description: "Codice utilizzato per comunicazioni sistema esterno"
        x-field-type: "optional"
      cdsRad:
        type: "string"
        example: "xyz"
        description: "Codice del RAD presentato in Offerta Formativa (un RAD rappresenta\
