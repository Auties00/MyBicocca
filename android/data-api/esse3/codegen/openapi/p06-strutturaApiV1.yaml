      umDurata:
        type: "string"
        example: "A"
        description: "Unità di misura della durata effettiva del corso (valore del\
          \ campo DURATA_EFFETTIVA). Sono ammessi i valori: A=anni, M=mesi, G=giorni.\n\
          Viene proposto il corrispondente valore dei tipi corso (tipi_corso.um_durata).\n\
          Per i tipi corso L2, LS, LC5 e LC6 il valore è sempre A, come stabilito\
