---
swagger: "2.0"
info:
  description: "API REST di ESSE3 per l'accesso alla struttura didattica\n\n## ChangeLog\n\
    \nVersione       | Versione di Esse3 di rilascio | Interventi \n -           \
    \  | -                             | -\n    1.1.0      | 19.04.02.00         \
    \          | aggiunto il campo opzionale struttureCorso nell'endpoint /corsi \n"
  version: "1.0.0"
  title: "ESSE3 Struttura API"
basePath: "/struttura-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
paths:
  /areeDisc:
    get:
      tags:
      - "struttura"
      description: "recupera gli oggetti `AreaDisciplinare` con le informazioni delle\
        \ aree disciplinari\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|configuration|Risorsa di configurazione, la variazione\
        \ è molto lenta, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: common-public-permissions**\n\nProfilo|Controllo| Funzione\n-|-|-\n\
        ALL|Funzione Pubblica|Security.checkDummy()\n\n\nClasse di modello : AreaDisciplinare\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        areaDiscCod|primaryKey\n"
      operationId: "getAreeDisciplinari"
      parameters:
      - name: "areaDiscDes"
        in: "query"
        description: "descrizione dell'area disciplinare (se viene utilizzato il carattere\
          \ * viene applicato il like)"
        required: false
        type: "string"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/AreaDisciplinare"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
  /areeDisc/{areaDiscCod}:
    get:
      tags:
      - "struttura"
      description: "recupera gli oggetti `AreaDisciplinare` con le informazioni delle\
        \ aree disciplinari\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|configuration|Risorsa di configurazione, la variazione\
        \ è molto lenta, cache Http abilitata, cache server abilitata. Maggiori dettagli\
        \ [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\nClasse di modello : AreaDisciplinare\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\nareaDiscCod|primaryKey\n"
      operationId: "getAreaDisciplinare"
      parameters:
      - name: "areaDiscCod"
        in: "path"
        description: "Codice dell'area disciplinare"
        required: true
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/AreaDisciplinare"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
  /corsi:
    get:
      tags:
      - "struttura"
      description: "recupera gli oggetti `CorsoDiStudioConStruttura` con le informazioni\
        \ dei corsi di studio\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: ALL**\n\nProfilo|Controllo| Funzione\n-|-|-\nALL|Funzione Pubblica|Security.checkDummy()\n\
        \n\n**Valori parametro q :**\n\nValore|descrizione\n-|-\nSTRUTTURE_DEF_AMM|recupera\
        \ solo se strutture con def_amm_flg e def_amm_old_flg = 1\n\n\nClasse di modello\
        \ : CorsoDiStudioConStruttura\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nstruttureCorso|optional\ncdsId|primaryKey\n\
        \n\nClasse di modello : StruttureCorso\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\ncdsId|primaryKey\nfacId|primaryKey\n\
        oldDefAmmFlg|optional\nracFlg|optional\n\n\nClasse di modello : DettaglioErroreAggiuntivo\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        rawValue|rawJson\n"
      operationId: "getCorsiDiStudio"
      parameters:
      - name: "cdsCod"
        in: "query"
        description: "codice del corso di studio"
        required: false
        type: "string"
      - name: "cdsDes"
        in: "query"
        description: "descrizione del corso di studio (se viene utilizzato il carattere\
          \ * viene applicato il like)"
        required: false
        type: "string"
      - name: "tipoCorsoCod"
        in: "query"
        description: "codice del tipo di corso di studio"
        required: false
        type: "string"
      - name: "dataModCds"
        in: "query"
        description: "data di ultima modifica del corso"
        required: false
        type: "string"
        maxLength: 10
        minLength: 10
      - name: "sdrFlg"
        in: "query"
        description: "flag che indica se il corso è collegato a una struttura didattica"
        required: false
        type: "integer"
        format: "int32"
      - name: "ordAttivoFlg"
        in: "query"
        description: "flag che indica se l'ordinamento del corso è attivo"
        required: false
        type: "integer"
        format: "int32"
      - name: "ordAbilImmaFlg"
        in: "query"
        description: "flag che indica se l'ordinamento del corso è abilitato all'immatricolazione"
        required: false
        type: "integer"
        format: "int32"
      - name: "tipoCatalogoCod"
        in: "query"
        description: "Codice tipi corso catalogo"
        required: false
        type: "string"
        maxLength: 10
      - name: "tipoCicloFormCod"
        in: "query"
        description: "Codice tipi ciclo formativo"
        required: false
        type: "string"
        maxLength: 10
      - name: "attivoInAa"
        in: "query"
        description: "filtra le strutture attive nell'anno accademico indicato"
        required: false
        type: "integer"
        format: "int32"
      - name: "facId"
        in: "query"
        description: "ID della struttura didattica"
        required: false
        type: "integer"
        format: "int32"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "q"
        in: "query"
        description: "il parametro consente di filtrare i campi con delle particolari\
          \ condizioni predefinite, consultare la documentazione del metodo per verificare\
          \ i codici che \nè possibile utilizzare\n"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/CorsoDiStudioConStruttura"
        "422":
          description: "Parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-public-permissions:
          kind: "ALL"
          profiles:
          - profile:
              name: "ALL"
              description: "Funzione Pubblica"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkDummy"
                  description: "funzione che ritorna sempre true"
      x-query-params:
      - name: "STRUTTURE_DEF_AMM"
        description: "recupera solo se strutture con def_amm_flg e def_amm_old_flg\
          \ = 1"
        queries:
        - type: "querystring"
          value: "STRUTTURE_DEF_AMM"
          filter: "struttureCorso.racFlg == 0 and (struttureCorso.defAmmFlg==1 or\
            \ struttureCorso.oldDefAmmFlg==1)"
      x-custom-operation: "multiple"
      x-cache-type: "noCache"
  /corsi/caratteristiche:
    get:
      tags:
      - "struttura"
      summary: "Recupera le caratteristiche di un corso"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera le caratteristiche di un corso. Occorre\
        \ specificare il codice del corso e l'intervallo di anni accademici.\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|noCache|Nessuna cache\
        \ impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: user-tecnico-massive-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nUserTecnicoMassivo|funzione massiva riservata ad utenti tecnici autorizzati|Security.checkMassiveGET()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getCorsoCaratteristiche"
      parameters:
      - name: "cdsCod"
        in: "query"
        description: "codice corso di studio"
        required: true
        type: "string"
      - name: "aaInizio"
        in: "query"
        description: "anno accademico minimo"
        required: true
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      - name: "aaFine"
        in: "query"
        description: "anno accademico massimo"
        required: true
        type: "integer"
        maxLength: 4
        minLength: 4
        format: "int32"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/CaratteristicheCds"
        "422":
          description: "errore"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      security:
      - basicAuth: []
      - jwt:
        - "openid"
      x-enabled-profiles:
      - user-tecnico-massive-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UserTecnicoMassivo"
              description: "funzione massiva riservata ad utenti tecnici autorizzati"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkMassiveGET"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-cache-type: "noCache"
