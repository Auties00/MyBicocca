      - "carriere"
      summary: "Recupero delle carriere degli studenti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti 'Carriera'\
        \ con i dettagli di carriera dello studente: - periodi di studio all'estero\
        \ - proroga - periodi di sospensione. I parametri ozionali **start** e **limit**\
        \ consentono di paginare i risultati. E'' possibile filtrare le carriere da\
        \ ricercare utilizzando i parametri di corso ordinamento e percorso dei tratti\
        \ dello studente. Se il parametro aaIdDa è valorizzato, verrà ignorato il\
        \ parametro aaId.\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: STUDENTE**\n\nProfilo|Controllo| Funzione\n-|-|-\nSTUDENTE|funzione\
        \ accessibile alle utenze di tipo STUDENTE|Security.checkStudente()\n\n\n\
        Classe di modello : CarrieraDottorato\n======\n\nEstensioni sulle proprietà\
        \n----\nProprietà | x-field-type\n-|-|\naaOrdId|primaryKey\npdsId|primaryKey\n\
        iscrId|primaryKey\ncdsId|primaryKey\nstuId|primaryKey\ncoordinatore|optional\n\
        supervisoreTutoreDottorato|optional\nperiodoStudioEstero|optional\nprorogaTesi|optional\n\
        sospensioni|optional\n\n\nClasse di modello : CarrieraDott\n======\n\nEstensioni\
        \ sulle proprietà\n----\nProprietà | x-field-type\n-|-|\naaOrdId|primaryKey\n\
        pdsId|primaryKey\niscrId|primaryKey\ncdsId|primaryKey\nstuId|primaryKey\n\n\
        \nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
