  ParametriAttesaLaurea:
    type: "object"
    required:
    - "attlauFlg"
    properties:
      stuId:
        type: "integer"
        format: "int64"
        example: 12345
        description: "id univoco che consente di individuare la carriera"
      matricola:
        type: "string"
        example: "754657"
        description: "matricola dello studente"
        maxLength: 20
