    put:
      tags:
      - "carriere"
      summary: "permette di aggiornare i dati relativi all'attesa di laurea dello\
        \ studente"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Permette di aggiornare il check di attesa di\
        \ laurea e la data di attesa di laurea di uno studente.\n\nCodice di Ritorno\
        \ | Descrizione\n-                 | -\n-1               | Errore generico\n\
