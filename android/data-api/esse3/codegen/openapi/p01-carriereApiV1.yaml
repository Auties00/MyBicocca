  /carriere-gdpr/{stuId}:
    get:
      tags:
      - "carriere"
      summary: "Recupero della carriera degli studenti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera l' oggetto 'CarrieraGdpr' che contiene\
        \ i dati della carriera con anche le informazioni riservate. Per gli utenti\
        \ tecnici è necessario farsi abilitare dall'ateneo all'utilizzo di questa\
        \ operation.\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n-|-|-\n\
        x-cache-type|noCache|Nessuna cache impostata Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n**Utente: common-student-carriera-permissions**\n\nProfilo|Controllo| Funzione\n\
        -|-|-\nSTUDENTE|Permette la visualizzazione delle informazioni della carriea\
        \ dello studente|Security.checkStuId(stuId)\n\n\nClasse di modello : CarrieraGdpr\n\
        ======\n\nEstensioni sulle proprietà\n----\nProprietà | x-field-type\n-|-|\n\
        aaOrdId|primaryKey\npdsId|primaryKey\niscrId|primaryKey\ncdsId|primaryKey\n\
        stuId|primaryKey\ndatiCarrieraStudente|optional\ndatiIscrizioneStudente|optional\n\
        \n\nClasse di modello : Carriera\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\naaOrdId|primaryKey\npdsId|primaryKey\niscrId|primaryKey\n\
        cdsId|primaryKey\nstuId|primaryKey\n"
      operationId: "getCarrieraGdprByStu"
      parameters:
      - name: "stuId"
        in: "path"
        description: "identificativo della carriera"
        required: true
        type: "integer"
        format: "int64"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/CarrieraGdpr"
      x-enabled-profiles:
      - common-student-carriera-permissions:
          kind: "STUDENTE"
          profiles:
          - profile:
              name: "STUDENTE"
              description: "Permette la visualizzazione delle informazioni della carriea\
                \ dello studente"
              checks:
              - checkStuId:
                  className: "Security"
                  functionName: "checkStuId"
                  description: "controlla che lo stuId appartenga ad una delle carriere\
                    \ dello studente"
                  parameters:
                  - stuId:
                      name: "stuId"
                      in: "path"
                      description: "id della carriera studente"
                      required: true
                      type: "integer"
                      format: "int64"
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-security-permission:
        retrieve: false
        insert: false
        update: false
        delete: false
      x-cache-type: "noCache"
      x-streaming-output: "chunk_size_3"
