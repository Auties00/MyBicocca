      - name: "identificativo U-Gov"
        in: "query"
        description: "identificativo di U-Gov che permette di ritirare le informazioni\
          \ dei responsabili."
        required: false
        type: "string"
      - name: "stuId"
        in: "query"
        description: "identificativo dello studente"
        required: false
        type: "integer"
        format: "int64"
      - name: "matricolaStudente"
        in: "query"
        description: "matricola dello studente"
        required: false
        type: "string"
      - name: "Codice esterno carriera"
        in: "query"
        description: "codice esterno carriera"
        required: false
        type: "string"
      - name: "cognome"
        in: "query"
        description: "cognome dell'utente (se viene utilizzato il carattere * viene\
          \ applicato il like)"
        required: false
        type: "string"
      - name: "nome"
        in: "query"
        description: "nome dell'utente (se viene utilizzato il carattere * viene applicato\
          \ il like)"
        required: false
        type: "string"
      - name: "codFis"
        in: "query"
        description: "codice fiscale dell'utente"
        required: false
        type: "string"
      - name: "staStuCod"
        in: "query"
        description: "codice dello stato della carriera"
        required: false
        type: "string"
      - name: "aaId"
        in: "query"
        description: "anno di immatricolazione"
        required: false
        type: "string"
      - name: "aaIdDa"
        in: "query"
        description: "anno di immatricolazione di partenza. Verranno recuperate tutte\
          \ le carriere con aaId maggiore o uguale a quello specificato"
        required: false
        type: "integer"
        format: "int64"
      - name: "daDataMod"
        in: "query"
        description: "data di ultima modifica, verranno recuperati tutti i record\
          \ inseriti con data di ultima modifica successiva a questa data"
        required: false
        type: "string"
      - name: "daOraMod"
        in: "query"
        description: "ora, minuti e secondi dell'ultima modifica (HH:MI:SS), verranno\
          \ recuperati tutti i record inseriti con orario di ultima modifica successivo\
          \ a questo orario in data daDataMod. Se i secondi verranno omessi saranno\
          \ impostati automaticamente a 00."
        required: false
        type: "string"
      - name: "soloImmatricolati"
        in: "query"
        description: "se 1 recupero dei soli immatricolati, se 0 recupero anche dei\
          \ non immatricolati"
        required: false
        type: "integer"
        format: "int32"
      - name: "cdsId"
        in: "query"
        description: "identificativo corso di studi"
        required: false
        type: "integer"
        format: "int64"
      - name: "cdsCod"
        in: "query"
        description: "codice corso di studi"
        required: false
        type: "string"
      - name: "tipoCorsoCod"
        in: "query"
        description: "Codice tipo corso di studio."
        required: false
        type: "string"
        maxLength: 10
      - name: "aaIscrId"
        in: "query"
        description: "anno di ultima iscrizione annuale"
        required: false
        type: "integer"
        format: "int64"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      - name: "fields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "soloAttivi"
        in: "query"
        description: "indica se recuperare solo carriere attive, in ipotesi o sospese\
          \ (no trasferiti in uscita)"
        required: false
        type: "integer"
        maximum: 1.0
        minimum: 0.0
        format: "int32"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/CarrieraDottorato"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - common-student-permissions:
          kind: "STUDENTE"
          profiles:
          - profile:
              name: "STUDENTE"
              description: "funzione accessibile alle utenze di tipo STUDENTE"
              checks:
