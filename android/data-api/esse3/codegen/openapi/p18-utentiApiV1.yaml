        \ e percorso dei tratti dello studente\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ bassa, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : Utente\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nuserId|primaryKey\ngrants|optional\naliasUtente|optional\n\
        \n\nClasse di modello : UtenteFun\n======\n\nEstensioni sulle proprietà\n\
        ----\nProprietà | x-field-type\n-|-|\nfunName|primaryKey\nfunDescr|optional\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getUtente"
      parameters:
      - name: "userId"
        in: "path"
        description: "id univoco che consente di individuare l'account utente"
        required: true
        type: "string"
      - name: "caseSensitive"
        in: "query"
        description: "1: userId gestito in maniera case sensitive; 0: viene ignorato\
          \ il case per lo userId. Default 1."
        required: false
        type: "integer"
        maximum: 1.0
        minimum: 0.0
        format: "int32"
      - name: "grants"
        in: "query"
        description: "elenco nomi funzioni separati da virgola"
        required: false
        type: "string"
      - name: "abilRecuperoAlias"
        in: "query"
        description: "Indica che l’utente indicato sarà ricercato sia tra gli utenti\
          \ che tra gli alias validi. 0-la ricerca sarà per il solo utente. 1-la ricerca\
          \ sarà per utente e alias"
        required: false
        type: "integer"
        maximum: 1.0
        minimum: 0.0
        format: "int32"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Utente"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-custom-operation: "multiple"
