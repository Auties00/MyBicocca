        type: "string"
        example: "CDS_1"
        description: "codice del corso di studio di iscrizione dello studente"
      cdsDes:
        type: "string"
        example: "Esempio di CDS"
        description: "descrizione del corso di iscrizione dello studente"
      ordCod:
        type: "string"
        example: "ORD_1"
        description: "codice dell'ordinamento di studio di iscrizione dello studente"
