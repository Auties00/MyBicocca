---
swagger: "2.0"
info:
  description: "I servizi presenti permettono di recuperare le informazioni degli\
    \ utenti ed eseguire operazioni su di essi.\n"
  version: "1.0.0"
  title: "ESSE3 Utenti API"
basePath: "/utenti-service-v1"
schemes:
- "https"
- "http"
consumes:
- "application/json"
produces:
- "application/json"
security:
- basicAuth: []
- jwt:
  - "openid"
paths:
  /utenti:
    get:
      tags:
      - "utenti"
      summary: "Recupero degli utenti abilitati presenti a sistema"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>Recupera la lista degli oggetti 'Utente'. I\
        \ parametri ozionali **start** e **limit** consentono di paginare i risultati.\
        \ E'' possibile filtrare i libretti da ricercare utilizzando i parametri di\
        \ corso ordinamento e percorso dei tratti dello studente\n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserDependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server disabilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : Utente\n======\n\nEstensioni sulle proprietà\n----\n\
        Proprietà | x-field-type\n-|-|\nuserId|primaryKey\ngrants|optional\naliasUtente|optional\n\
        \n\nClasse di modello : UtenteFun\n======\n\nEstensioni sulle proprietà\n\
        ----\nProprietà | x-field-type\n-|-|\nfunName|primaryKey\nfunDescr|optional\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "getUtenti"
      parameters:
      - name: "nome"
        in: "query"
        description: "nome dell'utente (se viene utilizzato il carattere * viene applicato\
          \ il like)"
        required: false
        type: "string"
      - name: "cognome"
        in: "query"
        description: "cognome dell'utente (se viene utilizzato il carattere * viene\
          \ applicato il like)"
        required: false
        type: "string"
      - name: "codFis"
        in: "query"
        description: "codice fiscale dell'utente"
        required: false
        type: "string"
      - name: "grpId"
        in: "query"
        description: "id univoco che consente di individuare il gruppo utente"
        required: false
        type: "integer"
        format: "int64"
      - name: "email"
        in: "query"
        description: "indirizzo email (email personale o di ateneo)"
        required: false
        type: "string"
      - name: "userId"
        in: "query"
        description: "userId"
        required: false
        type: "string"
      - name: "grants"
        in: "query"
        description: "elenco nomi funzioni separati da virgola"
        required: false
        type: "string"
      - name: "optionalFields"
        in: "query"
        description: "specifica la lista dei campi opzionali (che non vengono recupeati\
          \ di default);\nimpostando il valore `ALL` vengono mostrati tutti i campi.\
          \ \n\nPer gli oggetti è possibile utilizzare la notazione *Ant Glob Patterns*\
          \  \nI dettagli sono presenti [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Filtrosuicampidelleclassidimodello)\n\
          \nEsempi\n* per il campo childObj con la poprietà childProp utilizzare la\
          \ notazione `childProp.prop1`\n* Per visualizzare tutte le proprietà di\
          \ childObj utilizzare la notazione `childProp.*`\n* Per visualizzare tutte\
          \ le proprietà di childObj e di tutti i discendenti utilizzare la notazione\
          \ `childProp.**`\n"
        required: false
        type: "string"
      - name: "start"
        in: "query"
        description: "utilizzato insieme a `limit` per indicare la paginazione sui\
          \ record; `start` indica il numero del primo record da caricare (se non\
          \ indicato viene utilizzato 0)\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "utilizzato insieme a `start` per indicare la paginazione sui\
          \ record, `limit` indica il numero di record da recuperare (a partire da\
          \ `start`); \nse non indicato viene utilizzato 50, i valori consentiti vanno\
          \ da 0 a 100\n"
        required: false
        type: "integer"
        format: "int32"
      - name: "order"
        in: "query"
        description: "consente di specificare un ordine per il recupero dei record.\
          \ La sintassi è la seguente\n * +/- : specifica l'ordinamento (+ = ASC,\
          \ - = DESC); se omesso viene utilizzato +\n * field : nome del campo da\
          \ ordinare\n \n E' possibile indicare più campi separandoli da virgola (Es:\
          \ +annoCorso,+adCod) \n"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Utente"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-cache-type: "lowRefreshRateUserDependent"
  /utenti/datiFirma:
    post:
      tags:
      - "firma"
      summary: "Consente di aggiornare i dati degli utenti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>permette di aggioranre i dati di firma degli\
        \ utenti con codice fiscale indicato. Il formato è analogo a quello del servizio\
        \ per i csv solo che in formato json\n\n\n**Estensioni:**\n\nCodice Estensione|Valore|Nota\n\
        -|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa che varia con frequenza\
        \ bassa, cache Http abilitata, cache server abilitata. Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "postDatiFirmaUtenti"
      parameters:
      - in: "body"
        name: "body"
        description: "file CSV che contiene i valori da importare"
        required: true
        schema:
          $ref: "#/definitions/DatiFirmaImport"
      responses:
        "201":
          description: "Successful response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/DatiFirmaResponse"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-custom-operation: "single"
      x-cache-endpoint-relations:
        canonicalEndpointsAction: "none"
        customEndpoints:
        - operationId: "getUtenti"
          action: "invalidate"
  /utenti/datiFirma/csv:
    post:
      tags:
      - "firma"
      summary: "Consente di aggiornare i dati degli utenti"
      description: "<span class=\"e3rest-operation-auth-img-list\"><img src=\"basic.png\"\
        /><img src=\"jwt.png\"/></span>permette di aggioranre i dati di firma degli\
        \ utenti con codice fiscale indicato.\nDeve essere passato in ingresso un\
        \ file csv formato dai seguenti campi\n\n codFis   | tipoFirmaId | hsmPrefix\
        \ | tipoFirmaFaId | faPrefix\n -        | -           | -         | -    \
        \         | -\n cod_fis  | (1)         | (2)       | (1)           | (2)\n\
        \ \n *Legenda*:\n \n * (1): Va passato il valore della tabella tipi_firma\
        \ di esse3 (1 - Autografa , 2 Smart_card, 3 INFOCERT, ecc. ecc.)\n   Il campo\
        \ tipoFirmaId è relativo al valore per la firma REMOTA\n   Il campo tipoFirmaFaId\
        \ è relativo al valore per la firma AUTOMATICA  \n * (2): il prefisso dipende\
        \ dal tipo di provider. è lo stesso valore richiesto nel client di esse3\n\
        \ * Nel caso di campi nulli occorre inserire la stringa null\n  \n\n\n**Estensioni:**\n\
        \nCodice Estensione|Valore|Nota\n-|-|-\nx-cache-type|lowRefreshRateUserIndependent|Risorsa\
        \ che varia con frequenza bassa, cache Http abilitata, cache server abilitata.\
        \ Maggiori dettagli [qui](https://wiki.u-gov.it/confluence/display/ESSE3/Servizi+REST+su+ESSE3#ServiziRESTsuESSE3-Cachingdellerichieste)\
        \ \n\n\n**Controlli di sicurezza:**\n======\n_Nota: Il controllo per utente\
        \ è verificato quando viene passato almeno uno dei controlli previsti_\n\n\
        **Utente: USER_TECNICO**\n\nProfilo|Controllo| Funzione\n-|-|-\nUTENTE_TECNICO|funzione\
        \ accessibile alle utenze tecniche per accessi ai servizi REST|Security.checkUserTecnico()\n\
        \n\nClasse di modello : DettaglioErroreAggiuntivo\n======\n\nEstensioni sulle\
        \ proprietà\n----\nProprietà | x-field-type\n-|-|\nrawValue|rawJson\n"
      operationId: "postDatiFirmaUtentiCsv"
      produces:
      - "text/csv"
      parameters:
      - in: "body"
        name: "body"
        description: "file CSV che contiene i valori da importare"
        required: true
        schema:
          type: "string"
      - name: "delimiter"
        in: "query"
        description: "delimitatore del file CSV, se non valorizzato vale \",\""
        required: false
        type: "string"
      responses:
        "201":
          description: "Successful response"
          schema:
            type: "string"
        "422":
          description: "parametri Errati"
          schema:
            $ref: "#/definitions/DettaglioErrore"
      x-wrapped-response: true
      x-enabled-profiles:
      - user-tecnico-permissions:
          kind: "USER_TECNICO"
          profiles:
          - profile:
              name: "UTENTE_TECNICO"
              description: "funzione accessibile alle utenze tecniche per accessi\
                \ ai servizi REST"
              checks:
              - checkDummy:
                  className: "Security"
                  functionName: "checkUserTecnico"
                  description: "controlla che l'utente abbia gli accessi per i corsi\
                    \ a lui abilitati"
      x-cache-endpoint-relations:
        canonicalEndpointsAction: "none"
        customEndpoints:
        - operationId: "getUtenti"
          action: "invalidate"
  /utenti/{userId}:
    get:
      tags:
