      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_get_forum_access_information]
              wstoken:
                type: string
              forumid:
                type: integer
                description: Forum instance ID
            required:
              - wsfunction
              - wstoken
              - forumid
    responses:
      '200':
        description: Access information
        content:
          application/json:
            schema:
              type: object
              properties:
                canaddinstance:
                  type: boolean
                canviewdiscussion:
                  type: boolean
                canviewhiddentimedposts:
                  type: boolean
                canstartnewdiscussion:
                  type: boolean
                canreplypost:
                  type: boolean
                canaddnews:
                  type: boolean
                canreplynews:
                  type: boolean
                canviewrating:
                  type: boolean
                canviewanyrating:
                  type: boolean
                canviewallratings:
                  type: boolean
                canrate:
                  type: boolean
                canpostprivatereply:
                  type: boolean
                canreadprivatereplies:
                  type: boolean
                canmod:
                  type: boolean
                canexportdiscussion:
                  type: boolean
                canexportforum:
                  type: boolean
                canexportownpost:
                  type: boolean
                cansplitdiscussions:
                  type: boolean
                canmanagesubscriptions:
                  type: boolean
                canmovefromanyforum:
                  type: boolean
                canmovetotopic:
                  type: boolean
                canpindiscussions:
                  type: boolean
                cangrade:
                  type: boolean
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_set_lock_state:
  post:
    operationId: mod_forum_set_lock_state
    summary: Set lock state
    description: Set the lock state for the discussion
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_set_lock_state]
              wstoken:
                type: string
              forumid:
                type: integer
                description: Forum instance ID
              discussionid:
                type: integer
                description: Discussion ID
              targetstate:
                type: integer
                description: Target lock state
            required:
              - wsfunction
              - wstoken
              - forumid
              - discussionid
              - targetstate
    responses:
      '200':
        description: Lock result
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                locked:
                  type: boolean
                times:
                  type: object
                  properties:
                    locked:
                      type: integer
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_view_forum:
  post:
    operationId: mod_forum_view_forum
    summary: View forum
    description: Trigger the forum viewed event
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_view_forum]
              wstoken:
                type: string
              forumid:
                type: integer
                description: Forum instance ID
            required:
              - wsfunction
              - wstoken
              - forumid
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreStatusWithWarningsWSResponse'

mod_forum_view_forum_discussion:
  post:
    operationId: mod_forum_view_forum_discussion
    summary: View forum discussion
    description: Trigger the discussion viewed event
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_view_forum_discussion]
              wstoken:
                type: string
              discussionid:
                type: integer
                description: Discussion ID
            required:
              - wsfunction
              - wstoken
              - discussionid
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreStatusWithWarningsWSResponse'

mod_forum_prepare_draft_area_for_post:
  post:
    operationId: mod_forum_prepare_draft_area_for_post
    summary: Prepare draft area for post
    description: Prepares a draft area for editing a post
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_prepare_draft_area_for_post]
              wstoken:
                type: string
              postid:
                type: integer
                description: Post ID (0 for new)
              area:
                type: string
                description: Draft area (post or attachment)
              draftitemid:
                type: integer
                description: Existing draft item ID
            required:
              - wsfunction
              - wstoken
              - postid
              - area
    responses:
      '200':
        description: Draft area info
        content:
          application/json:
            schema:
              type: object
              properties:
                draftitemid:
                  type: integer
                  description: Draft item ID
                files:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSStoredFile'
                areaoptions:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                messagetext:
                  type: string
                  description: Message text
                messageformat:
                  type: integer
                  description: Message format
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

components:
  schemas:
    ModForumData:
      type: object
      properties:
        id:
          type: integer
          description: Forum instance ID
        course:
          type: integer
          description: Course ID
        type:
          type: string
          description: Forum type
        name:
          type: string
          description: Forum name
        intro:
          type: string
          description: Forum introduction
        introformat:
          type: integer
          description: Introduction format
        introfiles:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
        duedate:
          type: integer
          description: Due date
        cutoffdate:
          type: integer
          description: Cut-off date
        assessed:
          type: integer
          description: Assessed
        assesstimestart:
          type: integer
          description: Assess time start
        assesstimefinish:
          type: integer
          description: Assess time finish
        scale:
          type: integer
          description: Scale
        maxbytes:
          type: integer
          description: Max bytes
        maxattachments:
          type: integer
          description: Max attachments
        forcesubscribe:
          type: integer
          description: Force subscribe
        trackingtype:
          type: integer
          description: Tracking type
        rsstype:
          type: integer
          description: RSS type
        rssarticles:
          type: integer
          description: RSS articles
        timemodified:
          type: integer
          description: Time modified
        warnafter:
          type: integer
          description: Warn after
        blockafter:
          type: integer
          description: Block after
        blockperiod:
          type: integer
          description: Block period
        completiondiscussions:
          type: integer
          description: Completion discussions
        completionreplies:
          type: integer
          description: Completion replies
        completionposts:
          type: integer
          description: Completion posts
        cmid:
          type: integer
          description: Course module ID
        numdiscussions:
          type: integer
          description: Number of discussions
        cancreatediscussions:
          type: boolean
          description: Can create discussions
        lockdiscussionafter:
          type: integer
          description: Lock discussion after

    ModForumDiscussion:
      type: object
      properties:
        id:
          type: integer
          description: Discussion ID
        name:
          type: string
          description: Discussion name
        groupid:
          type: integer
          description: Group ID
        timemodified:
          type: integer
          description: Time modified
        usermodified:
          type: integer
          description: User who modified
        timestart:
          type: integer
          description: Time start
        timeend:
          type: integer
          description: Time end
        discussion:
          type: integer
          description: Discussion ID
        parent:
          type: integer
          description: Parent ID
        userid:
          type: integer
          description: User ID
        created:
          type: integer
          description: Time created
        modified:
          type: integer
          description: Time modified
        mailed:
          type: integer
          description: Mailed status
        subject:
          type: string
          description: Subject
        message:
          type: string
          description: Message
        messageformat:
          type: integer
          description: Message format
        messagetrust:
          type: integer
          description: Message trust
        attachment:
          type: string
          description: Has attachment
        attachments:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
        totalscore:
          type: integer
          description: Total score
        mailnow:
          type: integer
          description: Mail now
        userfullname:
          type: string
          description: User full name
        usermodifiedfullname:
          type: string
          description: Modified user full name
        userpictureurl:
          type: string
          format: uri
          description: User picture URL
        usermodifiedpictureurl:
          type: string
          format: uri
          description: Modified user picture URL
        numreplies:
          type: integer
          description: Number of replies
        numunread:
          type: integer
          description: Number of unread
        pinned:
          type: boolean
          description: Is pinned
        locked:
          type: boolean
          description: Is locked
        starred:
          type: boolean
          description: Is starred
        canreply:
          type: boolean
          description: Can reply
        canlock:
          type: boolean
          description: Can lock
        canfavourite:
          type: boolean
          description: Can favourite

    ModForumPost:
      type: object
      properties:
        id:
          type: integer
          description: Post ID
        discussion:
          type: integer
          description: Discussion ID
        parent:
          type: integer
          description: Parent post ID
        userid:
          type: integer
          description: User ID
        created:
          type: integer
          description: Created timestamp
        modified:
          type: integer
          description: Modified timestamp
        mailed:
          type: integer
          description: Mailed status
        subject:
          type: string
          description: Subject
        message:
          type: string
          description: Message
        messageformat:
          type: integer
          description: Message format
        messagetrust:
          type: integer
          description: Message trust
        attachment:
          type: string
          description: Has attachment
        attachments:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
        totalscore:
          type: integer
          description: Total score
        mailnow:
          type: integer
          description: Mail now
        children:
          type: array
          items:
            type: integer
          description: Child post IDs
        canreply:
          type: boolean
          description: Can reply
        postread:
          type: boolean
          description: Post read
        userfullname:
          type: string
          description: User full name
        userpictureurl:
          type: string
          format: uri
          description: User picture URL

    ModForumPostNew:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        replysubject:
          type: string
        message:
          type: string
        messageformat:
          type: integer
        author:
          type: object
          properties:
            id:
              type: integer
            fullname:
              type: string
            isdeleted:
              type: boolean
            groups:
              type: array
              items:
                type: object
            urls:
              type: object
              properties:
                profile:
                  type: string
                profileimage:
                  type: string
        discussionid:
          type: integer
        hasparent:
          type: boolean
        parentid:
          type: integer
        timecreated:
          type: integer
        timemodified:
          type: integer
        unread:
          type: boolean
        isdeleted:
          type: boolean
        isprivatereply:
          type: boolean
        haswordcount:
          type: boolean
        wordcount:
          type: integer
        charcount:
          type: integer
        capabilities:
          type: object
          properties:
            view:
              type: boolean
            edit:
              type: boolean
            delete:
              type: boolean
            split:
              type: boolean
            reply:
              type: boolean
            selfenrol:
              type: boolean
            export:
              type: boolean
            controlreadstatus:
              type: boolean
            canreplyprivately:
              type: boolean
        urls:
          type: object
          properties:
            view:
              type: string
            viewisolated:
              type: string
            viewparent:
              type: string
            edit:
              type: string
            delete:
              type: string
            split:
              type: string
            reply:
              type: string
            export:
              type: string
            markasread:
              type: string
            markasunread:
              type: string
            discuss:
              type: string
        attachments:
          type: array
