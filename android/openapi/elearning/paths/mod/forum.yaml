# Forum Module Web Service Functions

mod_forum_get_forums_by_courses:
  post:
    operationId: mod_forum_get_forums_by_courses
    summary: Get forums by courses
    description: Returns a list of forum instances in the provided courses
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_get_forums_by_courses]
              wstoken:
                type: string
              courseids[]:
                type: array
                items:
                  type: integer
                description: Array of course IDs
            required:
              - wsfunction
              - wstoken
    responses:
      '200':
        description: List of forums
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ModForumData'

mod_forum_get_forum_discussions:
  post:
    operationId: mod_forum_get_forum_discussions
    summary: Get forum discussions
    description: Returns a list of forum discussions
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_get_forum_discussions]
              wstoken:
                type: string
              forumid:
                type: integer
                description: Forum instance ID
              sortorder:
                type: integer
                description: Sort order
              page:
                type: integer
                description: Page number
              perpage:
                type: integer
                description: Items per page
              groupid:
                type: integer
                description: Group ID
            required:
              - wsfunction
              - wstoken
              - forumid
    responses:
      '200':
        description: List of discussions
        content:
          application/json:
            schema:
              type: object
              properties:
                discussions:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModForumDiscussion'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_get_forum_discussion_posts:
  post:
    operationId: mod_forum_get_forum_discussion_posts
    summary: Get forum discussion posts
    description: Returns posts for a discussion
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_get_forum_discussion_posts]
              wstoken:
                type: string
              discussionid:
                type: integer
                description: Discussion ID
              sortby:
                type: string
                enum: [id, created, modified]
                description: Sort by field
              sortdirection:
                type: string
                enum: [ASC, DESC]
                description: Sort direction
              includeinlineattachments:
                type: boolean
                description: Include inline attachments
            required:
              - wsfunction
              - wstoken
              - discussionid
    responses:
      '200':
        description: List of posts
        content:
          application/json:
            schema:
              type: object
              properties:
                posts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModForumPost'
                ratinginfo:
                  type: object
                  properties:
                    contextid:
                      type: integer
                    component:
                      type: string
                    ratingarea:
                      type: string
                    canviewall:
                      type: boolean
                    canviewany:
                      type: boolean
                    scales:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          courseid:
                            type: integer
                          name:
                            type: string
                          max:
                            type: integer
                          isnumeric:
                            type: boolean
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                value:
                                  type: integer
                                name:
                                  type: string
                    ratings:
                      type: array
                      items:
                        type: object
                        properties:
                          itemid:
                            type: integer
                          scaleid:
                            type: integer
                          userid:
                            type: integer
                          aggregate:
                            type: number
                          aggregatestr:
                            type: string
                          aggregatelabel:
                            type: string
                          count:
                            type: integer
                          rating:
                            type: integer
                          canrate:
                            type: boolean
                          canviewaggregate:
                            type: boolean
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_get_discussion_posts:
  post:
    operationId: mod_forum_get_discussion_posts
    summary: Get discussion posts (new)
    description: Returns posts for a discussion with additional data
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_get_discussion_posts]
              wstoken:
                type: string
              discussionid:
                type: integer
                description: Discussion ID
              sortby:
                type: string
                description: Sort by field
              sortdirection:
                type: string
                description: Sort direction
            required:
              - wsfunction
              - wstoken
              - discussionid
    responses:
      '200':
        description: Discussion posts
        content:
          application/json:
            schema:
              type: object
              properties:
                posts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModForumPostNew'
                forumid:
                  type: integer
                courseid:
                  type: integer
                ratinginfo:
                  type: object
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_add_discussion:
  post:
    operationId: mod_forum_add_discussion
    summary: Add discussion
    description: Add a new discussion to a forum
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_add_discussion]
              wstoken:
                type: string
              forumid:
                type: integer
                description: Forum instance ID
              subject:
                type: string
                description: Discussion subject
              message:
                type: string
                description: Discussion message
              groupid:
                type: integer
                description: Group ID
              options[0][name]:
                type: string
                description: Option name
              options[0][value]:
                type: string
                description: Option value
            required:
              - wsfunction
              - wstoken
              - forumid
              - subject
              - message
    responses:
      '200':
        description: New discussion info
        content:
          application/json:
            schema:
              type: object
              properties:
                discussionid:
                  type: integer
                  description: New discussion ID
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_add_discussion_post:
  post:
    operationId: mod_forum_add_discussion_post
    summary: Add discussion post
    description: Add a new post to a forum discussion
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_add_discussion_post]
              wstoken:
                type: string
              postid:
                type: integer
                description: Parent post ID
              subject:
                type: string
                description: Post subject
              message:
                type: string
                description: Post message
              options[0][name]:
                type: string
                description: Option name (e.g., discussionsubscribe, private, inlineattachmentsid, attachmentsid, topreferredformat)
              options[0][value]:
                type: string
                description: Option value
            required:
              - wsfunction
              - wstoken
              - postid
              - subject
              - message
    responses:
      '200':
        description: New post info
        content:
          application/json:
            schema:
              type: object
              properties:
                postid:
                  type: integer
                  description: New post ID
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'
                post:
                  $ref: '#/components/schemas/ModForumPostNew'
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string

mod_forum_update_discussion_post:
  post:
    operationId: mod_forum_update_discussion_post
    summary: Update discussion post
    description: Update a post
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_update_discussion_post]
              wstoken:
                type: string
              postid:
                type: integer
                description: Post ID
              subject:
                type: string
                description: Post subject
              message:
                type: string
                description: Post message
              messageformat:
                type: integer
                description: Message format
              options[0][name]:
                type: string
                description: Option name
              options[0][value]:
                type: string
                description: Option value
            required:
              - wsfunction
              - wstoken
              - postid
    responses:
      '200':
        description: Update result
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreStatusWithWarningsWSResponse'

mod_forum_delete_post:
  post:
    operationId: mod_forum_delete_post
    summary: Delete post
    description: Deletes a post or discussion
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_delete_post]
              wstoken:
                type: string
              postid:
                type: integer
                description: Post ID
            required:
              - wsfunction
              - wstoken
              - postid
    responses:
      '200':
        description: Delete result
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreStatusWithWarningsWSResponse'

mod_forum_can_add_discussion:
  post:
    operationId: mod_forum_can_add_discussion
    summary: Can add discussion
    description: Check if user can add discussion
    tags:
      - mod_forum
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_forum_can_add_discussion]
              wstoken:
                type: string
              forumid:
                type: integer
                description: Forum instance ID
              groupid:
                type: integer
                description: Group ID
            required:
              - wsfunction
              - wstoken
              - forumid
    responses:
      '200':
        description: Can add status
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: boolean
                  description: Whether user can add
                canpindiscussions:
                  type: boolean
                  description: Can pin discussions
                cancreateattachment:
                  type: boolean
                  description: Can create attachments
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_forum_get_forum_access_information:
  post:
    operationId: mod_forum_get_forum_access_information
