# Assignment Module Web Service Functions

mod_assign_get_assignments:
  post:
    operationId: mod_assign_get_assignments
    summary: Get assignments
    description: Returns the courses and assignments for the user
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_get_assignments]
              wstoken:
                type: string
              courseids[]:
                type: array
                items:
                  type: integer
                description: Array of course IDs
              capabilities[]:
                type: array
                items:
                  type: string
                description: Array of capabilities
              includenotenrolledcourses:
                type: boolean
                description: Include not enrolled courses
            required:
              - wsfunction
              - wstoken
    responses:
      '200':
        description: List of courses with assignments
        content:
          application/json:
            schema:
              type: object
              properties:
                courses:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModAssignCourse'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_get_submission_status:
  post:
    operationId: mod_assign_get_submission_status
    summary: Get submission status
    description: Returns information about the submission status for a user
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_get_submission_status]
              wstoken:
                type: string
              assignid:
                type: integer
                description: Assignment instance ID
              userid:
                type: integer
                description: User ID (0 for current user)
              groupid:
                type: integer
                description: Group ID
            required:
              - wsfunction
              - wstoken
              - assignid
    responses:
      '200':
        description: Submission status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModAssignSubmissionStatus'

mod_assign_get_submissions:
  post:
    operationId: mod_assign_get_submissions
    summary: Get submissions
    description: Returns the submissions for assignments
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_get_submissions]
              wstoken:
                type: string
              assignmentids[]:
                type: array
                items:
                  type: integer
                description: Array of assignment IDs
              status:
                type: string
                description: Status filter
              since:
                type: integer
                description: Submitted since
              before:
                type: integer
                description: Submitted before
            required:
              - wsfunction
              - wstoken
              - assignmentids[]
    responses:
      '200':
        description: Submissions
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      assignmentid:
                        type: integer
                      submissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/ModAssignSubmission'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_get_grades:
  post:
    operationId: mod_assign_get_grades
    summary: Get grades
    description: Returns grades from the assignment
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_get_grades]
              wstoken:
                type: string
              assignmentids[]:
                type: array
                items:
                  type: integer
                description: Array of assignment IDs
              since:
                type: integer
                description: Grades since timestamp
            required:
              - wsfunction
              - wstoken
              - assignmentids[]
    responses:
      '200':
        description: Grades
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      assignmentid:
                        type: integer
                      grades:
                        type: array
                        items:
                          $ref: '#/components/schemas/ModAssignGrade'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_save_submission:
  post:
    operationId: mod_assign_save_submission
    summary: Save submission
    description: Update the current students submission
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_save_submission]
              wstoken:
                type: string
              assignmentid:
                type: integer
                description: Assignment instance ID
              plugindata[onlinetext_editor][text]:
                type: string
                description: Online text content
              plugindata[onlinetext_editor][format]:
                type: integer
                description: Text format
              plugindata[onlinetext_editor][itemid]:
                type: integer
                description: Draft item ID
              plugindata[files_filemanager]:
                type: integer
                description: Files draft area ID
            required:
              - wsfunction
              - wstoken
              - assignmentid
    responses:
      '200':
        description: Save result
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_submit_for_grading:
  post:
    operationId: mod_assign_submit_for_grading
    summary: Submit for grading
    description: Submit the current students assignment for grading
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_submit_for_grading]
              wstoken:
                type: string
              assignmentid:
                type: integer
                description: Assignment instance ID
              acceptsubmissionstatement:
                type: boolean
                description: Accept submission statement
            required:
              - wsfunction
              - wstoken
              - assignmentid
              - acceptsubmissionstatement
    responses:
      '200':
        description: Submit result
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_submit_grading_form:
  post:
    operationId: mod_assign_submit_grading_form
    summary: Submit grading form
    description: Submit the grading form data via ajax
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_submit_grading_form]
              wstoken:
                type: string
              assignmentid:
                type: integer
                description: Assignment instance ID
              userid:
                type: integer
                description: User ID
              jsonformdata:
                type: string
                description: JSON encoded form data
            required:
              - wsfunction
              - wstoken
              - assignmentid
              - userid
              - jsonformdata
    responses:
      '200':
        description: Grading result
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_list_participants:
  post:
    operationId: mod_assign_list_participants
    summary: List participants
    description: List the participants for a single assignment
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_list_participants]
              wstoken:
                type: string
              assignid:
                type: integer
                description: Assignment instance ID
              groupid:
                type: integer
                description: Group ID
              filter:
                type: string
                description: Filter string
              skip:
                type: integer
                description: Skip records
              limit:
                type: integer
                description: Limit records
              onlyids:
                type: boolean
                description: Only return IDs
              includeenrolments:
                type: boolean
                description: Include enrollments
              tablesort:
                type: boolean
                description: Apply table sorting
            required:
              - wsfunction
              - wstoken
              - assignid
              - groupid
    responses:
      '200':
        description: List of participants
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ModAssignParticipant'

mod_assign_view_assign:
  post:
    operationId: mod_assign_view_assign
    summary: View assignment
    description: Trigger the assignment viewed event
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_view_assign]
              wstoken:
                type: string
              assignid:
                type: integer
                description: Assignment instance ID
            required:
              - wsfunction
              - wstoken
              - assignid
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreStatusWithWarningsWSResponse'

mod_assign_view_submission_status:
  post:
    operationId: mod_assign_view_submission_status
    summary: View submission status
    description: Trigger the submission status viewed event
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
