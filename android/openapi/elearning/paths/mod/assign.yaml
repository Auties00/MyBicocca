    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_remove_submission]
              wstoken:
                type: string
              assignid:
                type: integer
                description: Assignment instance ID
              userid:
                type: integer
                description: User ID
            required:
              - wsfunction
              - wstoken
              - assignid
    responses:
      '200':
        description: Remove result
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreWarningsWSResponse'

components:
  schemas:
    ModAssignCourse:
      type: object
      properties:
        id:
          type: integer
          description: Course ID
        fullname:
          type: string
          description: Course full name
        shortname:
          type: string
          description: Course short name
        timemodified:
          type: integer
          description: Last time modified
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/ModAssignAssignment'

    ModAssignAssignment:
      type: object
      properties:
        id:
          type: integer
          description: Assignment ID
        cmid:
          type: integer
          description: Course module ID
        course:
          type: integer
          description: Course ID
        name:
          type: string
          description: Assignment name
        nosubmissions:
          type: integer
          description: No submissions
        submissiondrafts:
          type: integer
          description: Submission drafts
        sendnotifications:
          type: integer
          description: Send notifications
        sendlatenotifications:
          type: integer
          description: Send late notifications
        sendstudentnotifications:
          type: integer
          description: Send student notifications
        duedate:
          type: integer
          description: Due date
        allowsubmissionsfromdate:
          type: integer
          description: Allow submissions from date
        grade:
          type: integer
          description: Grade value
        timemodified:
          type: integer
          description: Last time modified
        completionsubmit:
          type: integer
          description: Completion on submit
        cutoffdate:
          type: integer
          description: Cut-off date
        gradingduedate:
          type: integer
          description: Grading due date
        teamsubmission:
          type: integer
          description: Team submission
        requireallteammemberssubmit:
          type: integer
          description: Require all team members submit
        teamsubmissiongroupingid:
          type: integer
          description: Team submission grouping ID
        blindmarking:
          type: integer
          description: Blind marking
        hidegrader:
          type: integer
          description: Hide grader
        revealidentities:
          type: integer
          description: Reveal identities
        attemptreopenmethod:
          type: string
          description: Attempt reopen method
        maxattempts:
          type: integer
          description: Max attempts
        markingworkflow:
          type: integer
          description: Marking workflow
        markingallocation:
          type: integer
          description: Marking allocation
        requiresubmissionstatement:
          type: integer
          description: Require submission statement
        preventsubmissionnotingroup:
          type: integer
          description: Prevent submission not in group
        intro:
          type: string
          description: Introduction
        introformat:
          type: integer
          description: Introduction format
        introfiles:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
        introattachments:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
        activity:
          type: string
          description: Activity
        activityformat:
          type: integer
          description: Activity format
        activityattachments:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
        timelimit:
          type: integer
          description: Time limit
        submissionattachments:
          type: integer
          description: Submission attachments

    ModAssignSubmissionStatus:
      type: object
      properties:
        gradingsummary:
          type: object
          properties:
            participantcount:
              type: integer
            submissiondraftscount:
              type: integer
            submissionsenabled:
              type: boolean
            submissionssubmittedcount:
              type: integer
            submissionsneedgradingcount:
              type: integer
            warnofungroupedusers:
              type: string
        lastattempt:
          type: object
          properties:
            submission:
              $ref: '#/components/schemas/ModAssignSubmission'
            teamsubmission:
              $ref: '#/components/schemas/ModAssignSubmission'
            submissiongroup:
              type: integer
            submissiongroupmemberswhoneedtosubmit:
              type: array
              items:
                type: integer
            submissionsenabled:
              type: boolean
            locked:
              type: boolean
            graded:
              type: boolean
            canedit:
              type: boolean
            caneditowner:
              type: boolean
            cansubmit:
              type: boolean
            extensionduedate:
              type: integer
            blindmarking:
              type: boolean
            gradingstatus:
              type: string
            usergroups:
              type: array
              items:
                type: integer
        feedback:
          type: object
          properties:
            grade:
              $ref: '#/components/schemas/ModAssignGrade'
            gradefordisplay:
              type: string
            gradeddate:
              type: integer
        previousattempts:
          type: array
          items:
            type: object
            properties:
              attemptnumber:
                type: integer
              submission:
                $ref: '#/components/schemas/ModAssignSubmission'
              grade:
                $ref: '#/components/schemas/ModAssignGrade'
        warnings:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

    ModAssignSubmission:
      type: object
      properties:
        id:
          type: integer
          description: Submission ID
        userid:
          type: integer
          description: User ID
        attemptnumber:
          type: integer
          description: Attempt number
        timecreated:
          type: integer
          description: Time created
        timemodified:
          type: integer
          description: Time modified
        timestarted:
          type: integer
          description: Time started
        status:
          type: string
          description: Submission status
        groupid:
          type: integer
          description: Group ID
        assignment:
          type: integer
          description: Assignment ID
        latest:
          type: integer
          description: Whether latest
        plugins:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              fileareas:
                type: array
                items:
                  type: object
                  properties:
                    area:
                      type: string
                    files:
                      type: array
                      items:
                        $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
              editorfields:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    text:
                      type: string
                    format:
                      type: integer

    ModAssignGrade:
      type: object
      properties:
        id:
          type: integer
          description: Grade ID
        assignment:
          type: integer
          description: Assignment ID
        userid:
          type: integer
          description: User ID
        attemptnumber:
          type: integer
          description: Attempt number
        timecreated:
          type: integer
          description: Time created
        timemodified:
          type: integer
          description: Time modified
        grader:
          type: integer
          description: Grader user ID
        grade:
          type: string
          description: Grade value

    ModAssignParticipant:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        fullname:
          type: string
          description: Full name
        submitted:
          type: boolean
          description: Has submitted
        requiregrading:
          type: boolean
          description: Requires grading
        grantedextension:
          type: boolean
          description: Granted extension
        groupid:
          type: integer
          description: Group ID
        groupname:
          type: string
          description: Group name
        submissionstatus:
          type: string
          description: Submission status
