                type: string
                enum: [mod_assign_view_submission_status]
              wstoken:
                type: string
              assignid:
                type: integer
                description: Assignment instance ID
            required:
              - wsfunction
              - wstoken
              - assignid
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreStatusWithWarningsWSResponse'

mod_assign_start_submission:
  post:
    operationId: mod_assign_start_submission
    summary: Start submission
    description: Start a submission for an assignment (timed submissions)
    tags:
      - mod_assign
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [mod_assign_start_submission]
              wstoken:
                type: string
              assignid:
                type: integer
                description: Assignment instance ID
            required:
              - wsfunction
              - wstoken
              - assignid
    responses:
      '200':
        description: Start result
        content:
          application/json:
            schema:
              type: object
              properties:
                submissionid:
                  type: integer
                  description: Submission ID
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

mod_assign_remove_submission:
  post:
    operationId: mod_assign_remove_submission
    summary: Remove submission
