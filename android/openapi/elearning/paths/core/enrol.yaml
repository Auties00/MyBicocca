# Core Enrolment Web Service Functions

core_enrol_get_enrolled_users:
  post:
    operationId: core_enrol_get_enrolled_users
    summary: Get enrolled users
    description: Get the list of enrolled users in a course
    tags:
      - core_enrol
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_enrol_get_enrolled_users]
              wstoken:
                type: string
              courseid:
                type: integer
                description: Course ID
              options[0][name]:
                type: string
                description: Option name
              options[0][value]:
                type: string
                description: Option value
            required:
              - wsfunction
              - wstoken
              - courseid
    responses:
      '200':
        description: List of enrolled users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CoreEnrolledUser'

core_enrol_get_users_courses:
  post:
    operationId: core_enrol_get_users_courses
    summary: Get user's courses
    description: Get the list of courses a user is enrolled in
    tags:
      - core_enrol
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_enrol_get_users_courses]
              wstoken:
                type: string
              userid:
                type: integer
                description: User ID
              returnusercount:
                type: boolean
                description: Return user count
            required:
              - wsfunction
              - wstoken
              - userid
    responses:
      '200':
        description: List of courses
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CoreEnrolledCourse'

core_enrol_get_course_enrolment_methods:
  post:
    operationId: core_enrol_get_course_enrolment_methods
    summary: Get course enrolment methods
    description: Get the enrolment methods for a course
    tags:
      - core_enrol
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_enrol_get_course_enrolment_methods]
              wstoken:
                type: string
              courseid:
                type: integer
                description: Course ID
            required:
              - wsfunction
              - wstoken
              - courseid
    responses:
      '200':
        description: Enrolment methods
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Enrolment instance ID
                  courseid:
                    type: integer
                    description: Course ID
                  type:
                    type: string
                    description: Enrolment type
                  name:
                    type: string
                    description: Enrolment name
                  status:
                    type: string
                    description: Enrolment status
                  wsfunction:
                    type: string
                    description: WS function to enrol

core_enrol_search_users:
  post:
    operationId: core_enrol_search_users
    summary: Search users to enrol
    description: Search for users that can be enrolled in a course
    tags:
      - core_enrol
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_enrol_search_users]
              wstoken:
                type: string
              courseid:
                type: integer
                description: Course ID
              search:
                type: string
                description: Search string
              searchanywhere:
                type: boolean
                description: Search anywhere
              page:
                type: integer
                description: Page number
              perpage:
                type: integer
                description: Per page
            required:
              - wsfunction
              - wstoken
              - courseid
              - search
    responses:
      '200':
        description: Search results
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  fullname:
                    type: string
                  profileimageurl:
                    type: string
                  profileimageurlsmall:
                    type: string

enrol_self_enrol_user:
  post:
    operationId: enrol_self_enrol_user
    summary: Self enrol user
    description: Self enrol current user in a course
    tags:
      - enrol_self
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [enrol_self_enrol_user]
              wstoken:
                type: string
              courseid:
                type: integer
                description: Course ID
              password:
                type: string
                description: Enrolment key
              instanceid:
                type: integer
                description: Instance ID
            required:
              - wsfunction
              - wstoken
              - courseid
    responses:
      '200':
        description: Enrolment result
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: boolean
                  description: Success status
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

enrol_self_get_instance_info:
  post:
    operationId: enrol_self_get_instance_info
    summary: Get self enrolment instance info
    description: Get self enrolment instance information
    tags:
      - enrol_self
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [enrol_self_get_instance_info]
              wstoken:
                type: string
              instanceid:
                type: integer
                description: Instance ID
            required:
              - wsfunction
              - wstoken
              - instanceid
    responses:
      '200':
        description: Instance info
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                courseid:
                  type: integer
                type:
                  type: string
                name:
                  type: string
                status:
                  type: boolean
                enrolpassword:
                  type: string
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

enrol_guest_get_instance_info:
  post:
    operationId: enrol_guest_get_instance_info
    summary: Get guest enrolment instance info
    description: Get guest enrolment instance information
    tags:
      - enrol_guest
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [enrol_guest_get_instance_info]
              wstoken:
                type: string
              instanceid:
                type: integer
                description: Instance ID
            required:
              - wsfunction
              - wstoken
              - instanceid
    responses:
      '200':
        description: Instance info
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceinfo:
                  type: object
                  properties:
                    id:
                      type: integer
                    courseid:
                      type: integer
                    type:
                      type: string
                    name:
                      type: string
                    status:
                      type: boolean
                    passwordrequired:
                      type: boolean
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

enrol_guest_validate_password:
  post:
    operationId: enrol_guest_validate_password
    summary: Validate guest password
    description: Validate a guest enrolment password
    tags:
      - enrol_guest
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [enrol_guest_validate_password]
              wstoken:
                type: string
              instanceid:
                type: integer
                description: Instance ID
              password:
                type: string
                description: Password
            required:
              - wsfunction
              - wstoken
              - instanceid
              - password
    responses:
      '200':
        description: Validation result
        content:
          application/json:
            schema:
              type: object
              properties:
                validated:
                  type: boolean
                hint:
                  type: string
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

components:
  schemas:
    CoreEnrolledUser:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        username:
          type: string
          description: Username
        firstname:
          type: string
          description: First name
        lastname:
          type: string
          description: Last name
        fullname:
          type: string
          description: Full name
        email:
          type: string
          format: email
          description: Email
        department:
          type: string
          description: Department
        firstaccess:
          type: integer
          description: First access
        lastaccess:
          type: integer
          description: Last access
        lastcourseaccess:
          type: integer
          description: Last course access
        description:
          type: string
          description: Description
        descriptionformat:
          type: integer
          description: Description format
        city:
          type: string
          description: City
        country:
          type: string
          description: Country
        profileimageurlsmall:
          type: string
          format: uri
          description: Small profile image
        profileimageurl:
          type: string
          format: uri
          description: Profile image
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              description:
                type: string
              descriptionformat:
                type: integer
        roles:
          type: array
          items:
            type: object
            properties:
              roleid:
                type: integer
              name:
                type: string
              shortname:
                type: string
              sortorder:
                type: integer
        enrolledcourses:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              fullname:
                type: string
              shortname:
                type: string

    CoreEnrolledCourse:
      type: object
      properties:
        id:
          type: integer
          description: Course ID
        shortname:
          type: string
          description: Short name
        fullname:
          type: string
          description: Full name
        displayname:
          type: string
          description: Display name
        enrolledusercount:
          type: integer
          description: Enrolled user count
        idnumber:
          type: string
          description: ID number
        visible:
          type: integer
          description: Visibility
        summary:
          type: string
          description: Summary
        summaryformat:
          type: integer
          description: Summary format
        format:
          type: string
          description: Course format
        showgrades:
          type: boolean
          description: Show grades
        lang:
          type: string
          description: Language
        enablecompletion:
          type: boolean
          description: Enable completion
        completionhascriteria:
          type: boolean
          description: Has completion criteria
        completionusertracked:
          type: boolean
          description: User tracked
        category:
          type: integer
          description: Category ID
        progress:
          type: number
          description: Progress percentage
        completed:
          type: boolean
          description: Is completed
        startdate:
          type: integer
          description: Start date
        enddate:
          type: integer
          description: End date
        marker:
          type: integer
          description: Marker
        lastaccess:
          type: integer
          description: Last access
        isfavourite:
          type: boolean
          description: Is favourite
        hidden:
          type: boolean
          description: Is hidden
        overviewfiles:
          type: array
          items:
            $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalFile'
