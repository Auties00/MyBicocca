components:
  schemas:
    CoreMessageConversation:
      type: object
      properties:
        id:
          type: integer
          description: Conversation ID
        name:
          type: string
          description: Conversation name
        subname:
          type: string
          description: Subname
        imageurl:
          type: string
          format: uri
          description: Image URL
        type:
          type: integer
          description: Type (1=individual, 2=group, 3=self)
        membercount:
          type: integer
          description: Member count
        ismuted:
          type: boolean
          description: Is muted
        isfavourite:
          type: boolean
          description: Is favourite
        isread:
          type: boolean
          description: Is read
        unreadcount:
          type: integer
          description: Unread count
        members:
          type: array
          items:
            $ref: '#/components/schemas/CoreMessageMember'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CoreMessageMessage'
        candeletemessagesforallusers:
          type: boolean

    CoreMessageMember:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        fullname:
          type: string
          description: Full name
        profileurl:
          type: string
          format: uri
          description: Profile URL
        profileimageurl:
          type: string
          format: uri
          description: Profile image URL
        profileimageurlsmall:
          type: string
          format: uri
          description: Small profile image URL
        isonline:
          type: boolean
          description: Is online
        showonlinestatus:
          type: boolean
          description: Show online status
        isblocked:
          type: boolean
          description: Is blocked
        iscontact:
          type: boolean
          description: Is contact
        isdeleted:
          type: boolean
          description: Is deleted
        canmessageevenifblocked:
          type: boolean
        canmessage:
          type: boolean
        requirescontact:
          type: boolean
        contactrequests:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              userid:
                type: integer
              requesteduserid:
                type: integer
              timecreated:
                type: integer

    CoreMessageMessage:
      type: object
      properties:
        id:
          type: integer
          description: Message ID
        useridfrom:
          type: integer
          description: From user ID
        text:
          type: string
          description: Message text
        timecreated:
          type: integer
          description: Time created

    CoreMessageLegacyMessage:
      type: object
      properties:
        id:
          type: integer
        useridfrom:
          type: integer
        useridto:
          type: integer
        subject:
          type: string
        text:
          type: string
        fullmessage:
          type: string
        fullmessageformat:
          type: integer
        fullmessagehtml:
          type: string
        smallmessage:
          type: string
        notification:
          type: integer
        contexturl:
          type: string
        contexturlname:
          type: string
        timecreated:
          type: integer
        timeread:
          type: integer
        usertofullname:
          type: string
        userfromfullname:
          type: string
        component:
          type: string
        eventtype:
          type: string
        customdata:
          type: string

    CoreMessageContact:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        fullname:
          type: string
          description: Full name
        profileurl:
          type: string
          format: uri
        profileimageurl:
          type: string
          format: uri
        profileimageurlsmall:
          type: string
          format: uri
        isonline:
          type: boolean
        showonlinestatus:
          type: boolean
        isblocked:
          type: boolean
        iscontact:
          type: boolean
        isdeleted:
          type: boolean
        canmessage:
          type: boolean
        requirescontact:
          type: boolean
