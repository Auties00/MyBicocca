    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_get_unread_conversation_counts]
              wstoken:
                type: string
              userid:
                type: integer
                description: User ID
            required:
              - wsfunction
              - wstoken
              - userid
    responses:
      '200':
        description: Unread counts
        content:
          application/json:
            schema:
              type: object
              properties:
                favourites:
                  type: integer
                types:
                  type: object
                  properties:
                    '1':
                      type: integer
                    '2':
                      type: integer
                    '3':
