# Core Message Web Service Functions

core_message_get_conversations:
  post:
    operationId: core_message_get_conversations
    summary: Get conversations
    description: Get the list of conversations for a user
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_get_conversations]
              wstoken:
                type: string
              userid:
                type: integer
                description: User ID
              limitfrom:
                type: integer
                description: Limit from
              limitnum:
                type: integer
                description: Limit number
              type:
                type: integer
                description: Filter by type (null, 1=individual, 2=group, 3=self)
              favourites:
                type: boolean
                description: Filter favourites
              mergeself:
                type: boolean
                description: Merge self conversation
            required:
              - wsfunction
              - wstoken
              - userid
    responses:
      '200':
        description: List of conversations
        content:
          application/json:
            schema:
              type: object
              properties:
                conversations:
                  type: array
                  items:
                    $ref: '#/components/schemas/CoreMessageConversation'

core_message_get_conversation_between_users:
  post:
    operationId: core_message_get_conversation_between_users
    summary: Get conversation between users
    description: Get the conversation between two users
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_get_conversation_between_users]
              wstoken:
                type: string
              userid:
                type: integer
                description: User ID
              otheruserid:
                type: integer
                description: Other user ID
              includecontactrequests:
                type: boolean
                description: Include contact requests
              includeprivacyinfo:
                type: boolean
                description: Include privacy info
              memberlimit:
                type: integer
                description: Member limit
              memberoffset:
                type: integer
                description: Member offset
              messagelimit:
                type: integer
                description: Message limit
              messageoffset:
                type: integer
                description: Message offset
              newestmessagesfirst:
                type: boolean
                description: Order newest first
            required:
              - wsfunction
              - wstoken
              - userid
              - otheruserid
    responses:
      '200':
        description: Conversation data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreMessageConversation'

core_message_get_conversation_messages:
  post:
    operationId: core_message_get_conversation_messages
    summary: Get conversation messages
    description: Get messages for a conversation
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_get_conversation_messages]
              wstoken:
                type: string
              currentuserid:
                type: integer
                description: Current user ID
              convid:
                type: integer
                description: Conversation ID
              limitfrom:
                type: integer
                description: Limit from
              limitnum:
                type: integer
                description: Limit number
              newest:
                type: boolean
                description: Newest first
              timefrom:
                type: integer
                description: Time from
            required:
              - wsfunction
              - wstoken
              - currentuserid
              - convid
    responses:
      '200':
        description: Conversation messages
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                members:
                  type: array
                  items:
                    $ref: '#/components/schemas/CoreMessageMember'
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/CoreMessageMessage'

core_message_send_messages_to_conversation:
  post:
    operationId: core_message_send_messages_to_conversation
    summary: Send messages to conversation
    description: Send messages to an existing conversation
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_send_messages_to_conversation]
              wstoken:
                type: string
              conversationid:
                type: integer
                description: Conversation ID
              messages[0][text]:
                type: string
                description: Message text
              messages[0][textformat]:
                type: integer
                description: Text format
            required:
              - wsfunction
              - wstoken
              - conversationid
    responses:
      '200':
        description: Sent messages
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CoreMessageMessage'

core_message_send_instant_messages:
  post:
    operationId: core_message_send_instant_messages
    summary: Send instant messages
    description: Send instant messages to users
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_send_instant_messages]
              wstoken:
                type: string
              messages[0][touserid]:
                type: integer
                description: Recipient user ID
              messages[0][text]:
                type: string
                description: Message text
              messages[0][textformat]:
                type: integer
                description: Text format
            required:
              - wsfunction
              - wstoken
    responses:
      '200':
        description: Sent message results
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  msgid:
                    type: integer
                    description: Message ID (-1 on error)
                  clientmsgid:
                    type: string
                  errormessage:
                    type: string

core_message_get_messages:
  post:
    operationId: core_message_get_messages
    summary: Get messages
    description: Get messages (legacy)
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_get_messages]
              wstoken:
                type: string
              useridto:
                type: integer
                description: Recipient user ID
              useridfrom:
                type: integer
                description: Sender user ID
              type:
                type: string
                enum: [both, conversations, notifications]
                description: Message type
              read:
                type: integer
                description: Read status (0=unread, 1=read, 2=both)
              newestfirst:
                type: boolean
                description: Order newest first
              limitfrom:
                type: integer
                description: Limit from
              limitnum:
                type: integer
                description: Limit number
            required:
              - wsfunction
              - wstoken
              - useridto
              - type
    responses:
      '200':
        description: Messages
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/CoreMessageLegacyMessage'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

core_message_mark_message_read:
  post:
    operationId: core_message_mark_message_read
    summary: Mark message read
    description: Mark a message as read
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_mark_message_read]
              wstoken:
                type: string
              messageid:
                type: integer
                description: Message ID
              timeread:
                type: integer
                description: Time read (defaults to now)
            required:
              - wsfunction
              - wstoken
              - messageid
    responses:
      '200':
        description: Mark result
        content:
          application/json:
            schema:
              type: object
              properties:
                messageid:
                  type: integer
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

core_message_mark_all_notifications_as_read:
  post:
    operationId: core_message_mark_all_notifications_as_read
    summary: Mark all notifications read
    description: Mark all notifications as read for a user
    tags:
      - core_message
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_message_mark_all_notifications_as_read]
              wstoken:
                type: string
              useridto:
                type: integer
                description: User ID
              useridfrom:
                type: integer
                description: From user ID filter
              timecreatedto:
                type: integer
                description: Created before time
            required:
              - wsfunction
              - wstoken
              - useridto
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: boolean

core_message_get_unread_conversation_counts:
