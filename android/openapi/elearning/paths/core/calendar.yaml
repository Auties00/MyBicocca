# Core Calendar Web Service Functions

core_calendar_get_calendar_events:
  post:
    operationId: core_calendar_get_calendar_events
    summary: Get calendar events
    description: Get calendar events
    tags:
      - core_calendar
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_calendar_get_calendar_events]
              wstoken:
                type: string
              events[eventids][]:
                type: array
                items:
                  type: integer
                description: Event IDs
              events[courseids][]:
                type: array
                items:
                  type: integer
                description: Course IDs
              events[groupids][]:
                type: array
                items:
                  type: integer
                description: Group IDs
              events[categoryids][]:
                type: array
                items:
                  type: integer
                description: Category IDs
              options[userevents]:
                type: boolean
                description: Include user events
              options[siteevents]:
                type: boolean
                description: Include site events
              options[timestart]:
                type: integer
                description: Start time
              options[timeend]:
                type: integer
                description: End time
              options[ignorehidden]:
                type: boolean
                description: Ignore hidden events
            required:
              - wsfunction
              - wstoken
    responses:
      '200':
        description: Calendar events
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/CoreCalendarEvent'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

core_calendar_get_calendar_event_by_id:
  post:
    operationId: core_calendar_get_calendar_event_by_id
    summary: Get calendar event by ID
    description: Get a calendar event by its ID
    tags:
      - core_calendar
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_calendar_get_calendar_event_by_id]
              wstoken:
                type: string
              eventid:
                type: integer
                description: Event ID
            required:
              - wsfunction
              - wstoken
              - eventid
    responses:
      '200':
        description: Calendar event
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  $ref: '#/components/schemas/CoreCalendarEventDetail'
                warnings:
                  type: array
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/CoreWSExternalWarning'

core_calendar_get_calendar_day_view:
  post:
    operationId: core_calendar_get_calendar_day_view
    summary: Get calendar day view
    description: Get the calendar day view
    tags:
      - core_calendar
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_calendar_get_calendar_day_view]
              wstoken:
                type: string
              year:
                type: integer
                description: Year
              month:
                type: integer
                description: Month
              day:
                type: integer
                description: Day
              courseid:
                type: integer
                description: Course ID
              categoryid:
                type: integer
                description: Category ID
            required:
              - wsfunction
              - wstoken
              - year
              - month
              - day
    responses:
      '200':
        description: Day view data
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/CoreCalendarEventDetail'
                defaulteventcontext:
                  type: integer
                filter_selector:
                  type: string
                courseid:
                  type: integer
                categoryid:
                  type: integer
                neweventtimestamp:
                  type: integer
                date:
                  $ref: '../schemas/common.yaml#/components/schemas/CoreWSDate'
                periodname:
                  type: string
                previousperiod:
                  $ref: '../schemas/common.yaml#/components/schemas/CoreWSDate'
                previousperiodlink:
                  type: string
                previousperiodname:
                  type: string
                nextperiod:
                  $ref: '../schemas/common.yaml#/components/schemas/CoreWSDate'
                nextperiodlink:
                  type: string
                nextperiodname:
                  type: string
                larrow:
                  type: string
                rarrow:
                  type: string

core_calendar_get_calendar_monthly_view:
  post:
    operationId: core_calendar_get_calendar_monthly_view
    summary: Get calendar monthly view
    description: Get the monthly calendar view
    tags:
      - core_calendar
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_calendar_get_calendar_monthly_view]
              wstoken:
                type: string
              year:
                type: integer
                description: Year
              month:
                type: integer
                description: Month
              courseid:
                type: integer
                description: Course ID
              categoryid:
                type: integer
                description: Category ID
              includenavigation:
                type: boolean
                description: Include navigation
              mini:
                type: boolean
                description: Mini calendar
            required:
              - wsfunction
              - wstoken
              - year
              - month
    responses:
      '200':
        description: Monthly view data
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                courseid:
                  type: integer
                categoryid:
                  type: integer
                filter_selector:
                  type: string
                weeks:
                  type: array
                  items:
                    type: object
                    properties:
                      prepadding:
                        type: array
                        items:
                          type: integer
                      postpadding:
                        type: array
                        items:
                          type: integer
                      days:
                        type: array
                        items:
                          type: object
                          properties:
                            seconds:
                              type: integer
                            minutes:
                              type: integer
                            hours:
                              type: integer
                            mday:
                              type: integer
                            wday:
                              type: integer
                            year:
                              type: integer
                            yday:
                              type: integer
                            istoday:
                              type: boolean
                            isweekend:
                              type: boolean
                            timestamp:
                              type: integer
                            neweventtimestamp:
                              type: integer
                            viewdaylink:
                              type: string
                            viewdaylinktitle:
                              type: string
                            events:
                              type: array
                              items:
                                $ref: '#/components/schemas/CoreCalendarEventDetail'
                            hasevents:
                              type: boolean
                            calendareventtypes:
                              type: array
                              items:
                                type: string
                            popovertitle:
                              type: string
                            haslastdayofevent:
                              type: boolean
                daynames:
                  type: array
                  items:
                    type: object
                    properties:
                      dayno:
                        type: integer
                      shortname:
                        type: string
                      fullname:
                        type: string
                date:
                  $ref: '../schemas/common.yaml#/components/schemas/CoreWSDate'
                periodname:
                  type: string
                includenavigation:
                  type: boolean
                initialeventsloaded:
                  type: boolean
                previousperiod:
                  $ref: '../schemas/common.yaml#/components/schemas/CoreWSDate'
                previousperiodlink:
                  type: string
                previousperiodname:
                  type: string
                nextperiod:
                  $ref: '../schemas/common.yaml#/components/schemas/CoreWSDate'
                nextperiodlink:
                  type: string
                nextperiodname:
                  type: string
                larrow:
                  type: string
                rarrow:
                  type: string
                defaulteventcontext:
                  type: integer

