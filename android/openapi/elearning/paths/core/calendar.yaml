core_calendar_delete_calendar_events:
  post:
    operationId: core_calendar_delete_calendar_events
    summary: Delete calendar events
    description: Delete calendar events
    tags:
      - core_calendar
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_calendar_delete_calendar_events]
              wstoken:
                type: string
              events[0][eventid]:
                type: integer
                description: Event ID
              events[0][repeat]:
                type: boolean
                description: Delete all events in series
            required:
              - wsfunction
              - wstoken
    responses:
      '200':
        description: Delete result
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/components/schemas/CoreWarningsWSResponse'

core_calendar_submit_create_update_form:
  post:
    operationId: core_calendar_submit_create_update_form
    summary: Submit create/update form
    description: Submit the calendar event form
    tags:
      - core_calendar
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              wsfunction:
                type: string
                enum: [core_calendar_submit_create_update_form]
              wstoken:
                type: string
              formdata:
                type: string
                description: URL encoded form data
            required:
              - wsfunction
              - wstoken
              - formdata
    responses:
      '200':
        description: Form submission result
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  $ref: '#/components/schemas/CoreCalendarEventDetail'
                validationerror:
                  type: boolean

components:
  schemas:
    CoreCalendarEvent:
      type: object
      properties:
        id:
          type: integer
          description: Event ID
        name:
          type: string
          description: Event name
        description:
          type: string
          description: Description
        format:
          type: integer
          description: Description format
        courseid:
          type: integer
          description: Course ID
        categoryid:
          type: integer
          description: Category ID
        groupid:
          type: integer
          description: Group ID
        userid:
          type: integer
          description: User ID
        repeatid:
          type: integer
          description: Repeat ID
        modulename:
          type: string
          description: Module name
        instance:
          type: integer
          description: Instance ID
        eventtype:
          type: string
          description: Event type
        timestart:
          type: integer
          description: Start time
        timeduration:
          type: integer
          description: Duration
        visible:
          type: integer
          description: Visibility
        uuid:
          type: string
          description: UUID
        sequence:
          type: integer
          description: Sequence
        timemodified:
          type: integer
          description: Time modified
        subscriptionid:
          type: integer
          description: Subscription ID

    CoreCalendarEventDetail:
      allOf:
        - $ref: '#/components/schemas/CoreCalendarEvent'
        - type: object
          properties:
            url:
              type: string
              format: uri
            descriptionformat:
              type: integer
            iscourseevent:
              type: boolean
            iscategoryevent:
              type: boolean
            groupname:
              type: string
            normalisedeventtype:
              type: string
            normalisedeventtypetext:
              type: string
            action:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                itemcount:
                  type: integer
                actionable:
                  type: boolean
                showitemcount:
                  type: boolean
            course:
              type: object
              properties:
                id:
                  type: integer
                fullname:
                  type: string
                shortname:
                  type: string
                idnumber:
                  type: string
                summary:
                  type: string
                summaryformat:
                  type: integer
                startdate:
                  type: integer
                enddate:
                  type: integer
                visible:
                  type: boolean
                showactivitydates:
                  type: boolean
                showcompletionconditions:
                  type: boolean
                fullnamedisplay:
                  type: string
                viewurl:
                  type: string
                courseimage:
                  type: string
                progress:
                  type: number
                hasprogress:
                  type: boolean
                isfavourite:
                  type: boolean
                hidden:
                  type: boolean
                timeaccess:
                  type: integer
                showshortname:
                  type: boolean
                coursecategory:
                  type: string
            canedit:
              type: boolean
            candelete:
              type: boolean
            deleteurl:
              type: string
            editurl:
              type: string
            viewurl:
              type: string
            formattedtime:
              type: string
            formattedlocation:
              type: string
            isactionevent:
              type: boolean
            iscourseevent:
              type: boolean
            iscategoryevent:
              type: boolean
            icon:
              type: object
              properties:
                key:
                  type: string
                component:
                  type: string
                alttext:
                  type: string
                iconurl:
                  type: string
                iconclass:
                  type: string
            category:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                idnumber:
                  type: string
                description:
                  type: string
                parent:
                  type: integer
                coursecount:
                  type: integer
                visible:
                  type: integer
                timemodified:
                  type: integer
                depth:
                  type: integer
                nestedname:
                  type: string
                url:
                  type: string
            mindaytimestamp:
              type: integer
            mindayerror:
              type: string
            maxdaytimestamp:
              type: integer
            maxdayerror:
              type: string
            draggable:
              type: boolean
