openapi: 3.1.0
info:
  title: Moodle Web Services API
  description: 'OpenAPI specification for Moodle Web Services used by the Moodle Mobile
    App.


    All API calls are made to a single endpoint (`/webservice/rest/server.php`) with

    the `wsfunction` parameter determining which operation to perform. Each unique

    `wsfunction` value is modeled as a separate operation in this specification.


    ## Authentication

    All requests require a `wstoken` parameter for authentication. This token is

    obtained during the login process.


    ## Response Format

    All responses are in JSON format (specified via `moodlewsrestformat=json` query
    parameter).


    ## Error Handling

    Errors are returned as JSON objects with `exception`, `errorcode`, and `message`
    fields.

    '
  version: 5.1.0
  contact:
    name: Moodle
    url: https://moodle.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: '{protocol}://{host}/webservice/rest'
  description: Moodle Web Services REST endpoint
  variables:
    protocol:
      default: https
      enum:
      - https
      - http
      description: Protocol (HTTPS recommended)
    host:
      default: your-moodle-site.com
      description: Your Moodle site hostname
security:
- wsToken: []
