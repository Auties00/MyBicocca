          - tool_mobile_get_content
          - tool_mobile_get_tokens_for_qr_login
          - tool_mobile_validate_subscription_key
          - tool_mobile_call_external_functions
        description: The web service function to call
      - name: wstoken
        in: query
        required: true
        schema:
          type: string
        description: Authentication token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServerphpPostRequest'
      responses:
        '200':
          description: 'Successful response. The format depends on the wsfunction
            called.

            See individual function documentation for response schemas.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerphpPostResponse200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSError'
        '401':
          description: Unauthorized - invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSError'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSError'
