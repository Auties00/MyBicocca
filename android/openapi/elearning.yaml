paths:
  /server.php:
    post:
      summary: Moodle Web Service Endpoint
      description: 'Single endpoint that handles all web service calls. The `wsfunction`
        parameter

        determines which operation to perform.


        ## How to Use This API

        All Moodle Web Services are called through this single endpoint. The specific

        function is determined by the `wsfunction` parameter.


        ## Individual Function Documentation

        See the individual path files for detailed documentation of each wsfunction:

        - `paths/core/` - Core Moodle functions (auth, user, course, enrol, message,
        calendar)

        - `paths/mod/` - Module functions (quiz, assign, forum)

        - `paths/tool/` - Tool functions (mobile)


        ## Example Request

        ```

        POST /webservice/rest/server.php?moodlewsrestformat=json HTTP/1.1

        Content-Type: application/x-www-form-urlencoded


        wstoken=YOUR_TOKEN&wsfunction=core_user_get_users_by_field&field=id&values[0]=2

        ```

        '
      parameters:
      - name: moodlewsrestformat
        in: query
        required: true
        schema:
          type: string
          enum:
          - json
        description: Response format (always json for mobile app)
      - name: wsfunction
        in: query
        required: true
        schema:
          type: string
          description: The web service function to call
          enum:
          - core_auth_is_minor
          - core_auth_request_password_reset
          - core_auth_resend_confirmation_email
          - auth_email_get_signup_settings
          - core_user_get_users_by_field
          - core_user_get_course_user_profiles
          - core_user_get_user_preferences
          - core_user_update_user_preferences
          - core_user_update_picture
          - core_user_agree_site_policy
          - core_user_view_user_profile
          - core_user_view_user_list
          - core_user_add_user_device
          - core_user_remove_user_device
          - core_user_get_private_files_info
          - core_user_add_user_private_files
          - core_course_get_categories
          - core_course_get_courses
          - core_course_get_courses_by_field
          - core_course_get_contents
          - core_course_get_course_module
          - core_course_get_course_module_by_instance
          - core_course_get_recent_courses
          - core_course_search_courses
          - core_course_view_course
          - core_course_set_favourite_courses
          - core_course_check_updates
          - core_my_view_page
          - core_enrol_get_enrolled_users
          - core_enrol_get_users_courses
          - core_enrol_get_course_enrolment_methods
          - core_enrol_search_users
          - enrol_self_enrol_user
          - enrol_self_get_instance_info
          - enrol_guest_get_instance_info
          - enrol_guest_validate_password
          - core_message_get_conversations
          - core_message_get_conversation_between_users
          - core_message_get_conversation_messages
          - core_message_send_messages_to_conversation
          - core_message_send_instant_messages
          - core_message_get_messages
          - core_message_mark_message_read
          - core_message_mark_all_notifications_as_read
          - core_message_get_unread_conversation_counts
          - core_message_block_user
          - core_message_unblock_user
          - core_message_delete_conversations_by_id
          - core_message_get_user_contacts
          - core_message_confirm_contact_request
          - core_message_decline_contact_request
          - core_message_get_received_contact_requests_count
          - core_calendar_get_calendar_events
          - core_calendar_get_calendar_event_by_id
          - core_calendar_get_calendar_day_view
          - core_calendar_get_calendar_monthly_view
          - core_calendar_get_calendar_upcoming_view
          - core_calendar_get_calendar_access_information
          - core_calendar_get_allowed_event_types
          - core_calendar_delete_calendar_events
          - core_calendar_submit_create_update_form
          - mod_quiz_get_quizzes_by_courses
          - mod_quiz_get_quiz_access_information
          - mod_quiz_get_attempt_access_information
          - mod_quiz_get_user_attempts
          - mod_quiz_get_user_best_grade
          - mod_quiz_start_attempt
          - mod_quiz_get_attempt_data
          - mod_quiz_get_attempt_summary
          - mod_quiz_save_attempt
          - mod_quiz_process_attempt
